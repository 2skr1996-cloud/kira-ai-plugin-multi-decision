<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>多样决策 · 设置</title>
<script>
/* 首帧引导（v3.08）
   ① 主题：先从父页面或上次缓存取主题，深色模式下不白闪；
   ② 外壳标题占位：KiraAI 外壳是单页应用，菜单接口返回前标题先显示「插件页面」，这里立刻纠正；
   ③ booting 期间关掉所有过渡，首帧元素不再从初始态滑到目标态。 */
(function(){
  var d = document, e = d.documentElement;
  e.className += " booting";
  // 记下「当前停在设置页」，刷新外壳时首页脚本据此跳回来（v3.12，用户 m39759 ①）
  try{ localStorage.setItem("mdp_page", "settings"); }catch(x){}
  function pickTheme(){
    try{
      var p = window.parent;
      if(p && p !== window && p.document && p.document.documentElement){
        var t = p.document.documentElement.getAttribute("data-theme");
        if(t === "dark" || t === "light") return t;
      }
    }catch(x){}
    try{ var c = localStorage.getItem("mdp_theme"); if(c === "dark" || c === "light") return c; }catch(x){}
    return "";
  }
  var th = pickTheme();
  if(th) e.setAttribute("data-theme", th);
  function release(){ e.classList.remove("booting"); }
  window.__releaseBoot = release;
  setTimeout(release, 1500);
  try{
    var p = window.parent;
    if(p && p !== window && p.document){
      var fix = function(){
        try{
          var h = p.document.querySelector("header.app-header h2");
          if(h && h.textContent.trim() === "插件页面") h.textContent = "设置";
        }catch(x){}
      };
      fix();
      var t0 = Date.now();
      (function loop(){ fix(); if(Date.now() - t0 < 2000) requestAnimationFrame(loop); })();
    }
  }catch(x){}
})();
</script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e3e9f3;--text:#1f2937;--muted:#6b7280;--accent:#3b82f6;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--soft:rgba(127,127,127,.08);}
html[data-theme="dark"]{--bg:#0f172a;--card:#16213a;--line:#26344f;--text:#e5edff;--muted:#93a4c4;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:rgba(255,255,255,.06);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
/* v3.67（用户 m20117 第 6 条）：整页收一点边距，一屏能多看两行。 */
.wrap{padding:14px 20px 32px;max-width:none;margin:0;}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
/* header 里的控件统一 26px 高，整条 header 正好 32px —— 和首页一样高，切页不跳（用户 m33994 图5） */
header > button,header > select{height:26px;padding:0 12px;line-height:1;border-radius:8px;font-size:13px;}
header > select{padding:0 6px;}
h1{font-size:20px;margin:0;font-weight:600;}
/* 顶部导航和首页同一套：切换页面时 header 高度不变（用户 m33994 图5） */
.navseg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:11px;background:var(--soft);border:1px solid var(--line);height:32px;}
.navbtn{height:26px;padding:0 15px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;line-height:1;transition:background .15s,color .15s;}
.navbtn:hover{border:0;color:var(--text);}
.navbtn.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.10);}
html[data-theme="dark"] .navbtn.on{background:rgba(255,255,255,.10);}
.grow{flex:1;}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;}
button:hover{border-color:var(--accent);color:var(--accent);}
button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
button.mini{padding:2px 8px;font-size:12px;border-radius:6px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.hint{color:var(--muted);font-size:12px;}
/* 用户 m07864 第 1 条：头部这句说明一换长度，上半部分就像被推了一下。
   定宽 + 等宽数字，且默认先写上次的文案（sessionStorage），首帧不再「加载中…」跳长句。 */
/* v3.68（用户 m20632 第 7 条）：去掉最小宽度和右对齐——这行紧跟页签胶囊，别再被推到右边 */
#set-sub{display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.saved{color:var(--ok);font-size:12px;}
.empty{padding:36px;text-align:center;color:var(--muted);}
select,input[type=text],input[type=number]{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);}
input[type=number]{width:var(--ipt-w);} /* v3.49：兜底宽度也走同一套变量，见下面 .ipt 那段 */
/* v3.43（用户本轮第 3 条）：设置页的数字框收成一套尺寸 —— 宽 / 高 / 字号只在这里各写一次，
   不再有三列 108px、参数行 78px、价目 96px 三套数（图 8 里同一列的数字框宽窄不一）。
   百分号也挪进框里：.ipt 是个定位容器，框内右侧留出 21px，% 绝对定位在留白里，
   不再是框外另挂一个 <b>%</b>（那种写法 % 会跟着 gap 飘开，看着像漏出来的字）。 */
:root{--ipt-w:96px;--ipt-h:32px;--ipt-fs:13.5px;--ipt-pad:4px 10px;}
/* v3.49（用户 m06348 第 7 条）：选择器从「.ctl > .ipt」放宽成「.ctl .ipt」——成对行
   （抖动 / 静默兜底 / 休息时段兜底）的数字框套在 <span class='nspan'> 里，隔了一层就匹配
   不到这套规则，掉到全局 input[type=number]{width:120px} 上变成 120×34，跟别处 96×32 差一截。
   改成后代选择器后，页面上所有数字框不管嵌几层都是同一套 --ipt-w / --ipt-h。 */
.setrow .ctl .ipt{position:relative;display:inline-flex;align-items:center;flex:0 0 auto;
  width:var(--ipt-w);min-width:0;}
.setrow .ctl .ipt > input[type=number]{width:100%;min-width:0;height:var(--ipt-h);
  padding:var(--ipt-pad);font-size:var(--ipt-fs);text-align:right;}
.setrow .ctl .ipt.has-pct > input[type=number]{padding-right:21px;}
.setrow .ctl .ipt > .pct{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1;}
/* v3.50（用户 m06761 第 4 条）：单位（秒 / 分钟 / 次）也搬进框里——原来它挂在框外，
   窄列里会被挤到下一行、框和字之间还跟着 gap 飘。跟 % 同一套做法：框内右侧留白，
   单位绝对定位在留白里。两个字（分钟）要留宽一点，用 .uw2 单独给。 */
.setrow .ctl .ipt.has-unit > input[type=number]{padding-right:24px;}
.setrow .ctl .ipt.has-unit.uw2 > input[type=number]{padding-right:36px;}
.setrow .ctl .ipt > .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--muted);font-size:12px;font-weight:600;line-height:1;}
/* 数字框自带的上下箭头会盖住框里的 %；设置项都是键进去的，箭头收掉 */
.setrow .ctl .ipt > input[type=number]::-webkit-inner-spin-button,
.setrow .ctl .ipt > input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.tabs button{padding:5px 15px;border-radius:8px;font-size:13px;}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
/* v3.26（用户 m46693 ①）：切页签的两处顿挫
   ① 各页高度差很大（831~1324px），切到短页时滚动条突然消失、整页横向挪 15px；
      给 html 预留滚动条槽位，位置就不再跳。
   ② 页签吸顶，滚到页面下半部也能直接换页；换页内容淡入 120ms，不再「啪」一下换掉。 */
html{scrollbar-gutter:stable;}
.tabs{position:sticky;top:0;z-index:30;background:var(--bg);margin:0 -20px 10px;padding:8px 20px;
  border-bottom:1px solid var(--line);}
@media (max-width:860px){.tabs{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px;}}
@keyframes mdPageIn{from{opacity:.35;}to{opacity:1;}}
.setgrp.pgin{animation:mdPageIn .12s ease-out both;}
html.booting .setgrp.pgin{animation:none;}
/* 页内模态（v3.26，用户 m46693 ②）：外壳 iframe 的 sandbox 没有 allow-modals，
   原生 confirm/alert 被浏览器忽略（confirm 恒 false），确认类操作永远不生效。 */
.mask{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.46);display:flex;align-items:center;justify-content:center;padding:20px;}
.dlg{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.32);}
.dlg h3{margin:0 0 8px;font-size:14px;}
.dlg p{margin:0;font-size:13px;line-height:1.8;color:var(--text);}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.dlg-btns button{padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:13px;}
.dlg-btns button.pri,.dlg-btns button:hover{border-color:var(--accent);color:var(--accent);}
.dlg-btns button.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
.dlg textarea{width:100%;box-sizing:border-box;min-height:158px;margin-top:10px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:13px;line-height:1.75;
  font-family:inherit;resize:vertical;outline:none;}
.dlg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}
.phbtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--soft);
  color:var(--text);font-size:12.5px;cursor:pointer;white-space:nowrap;}
.phbtn:hover{border-color:var(--accent);color:var(--accent);}
/* 设置项：两列紧凑排布（v3.08）。一页 20 项时一列要滚很久，
   改成一屏左右两列，名称与控件同一行、说明压到下一行最多两行。 */
.setgrp{margin-bottom:16px;}
.setgrp h3{font-size:13.5px;margin:0 0 8px;padding:8px 14px;background:var(--soft);border-radius:9px;color:var(--muted);font-weight:600;}
.setgrp .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;}
/* v3.13（用户 m39983）：单列组——主要开关、身份、缓存记录这类整幅宽的块。4 个开关排在
   同一列右侧、从上往下，不再左右两列各两个（眼睛要来回扫，看着也不齐）。 */
.setgrp[data-solo="1"] .rows{grid-template-columns:1fr;}
/* v3.13：锁定项（后端强制开启、页面不许改的键）——控件禁用，名称后跟「已锁定」 */
.setrow.locked{background:var(--soft);}
.setrow.locked .nm{color:var(--muted);}
.setrow.locked .lk{margin-left:8px;padding:1px 7px;border-radius:6px;background:var(--line);color:var(--muted);font-size:11.5px;font-weight:500;}
.setrow.locked .ctl{opacity:.65;}
@media (max-width:1150px){.setgrp .rows{grid-template-columns:1fr;}}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);}
.setrow.wide{grid-template-columns:1fr;row-gap:7px;grid-column:1/-1;}
.setrow:last-child{border-bottom:none;}
/* v3.11：紧凑分组（身份区）——行距收一半，说明只留一行，全文在 title 里
   v3.12：紧凑组的右内边距必须和普通组一样（12→14），否则同一列里
   紧凑组的开关比普通组偏右 2px，四条开关列不成一条线（用户 m39759 ③）
   v3.41（用户本轮第 7 条）：说明一律排在名称右侧，原来「说明压到第二行」的 .hh 随渲染分支一起删掉。 */
.setgrp[data-compact="1"] .setrow{padding:7px 14px;}
.setrow .nm{font-size:14px;line-height:1.36;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.setrow .kh{display:none;}
.setrow .ctl{justify-self:end;display:flex;align-items:center;gap:8px;min-width:0;}
.setrow.wide .ctl{justify-self:stretch;}
/* v3.10：设置项控件整体放大一号，两列排布下不再显得空 */
.setrow select,.setrow input[type=text]{font-size:14px;padding:7px 11px;min-width:120px;}
.setrow select{min-width:150px;}
/* v3.12：控件列固定 200px，所有行的控件右边缘对齐成一条竖线（用户 m39759 ③）。
   以前第二列是 auto：开关行只有 82px、输入框行 200px，右边看着参差不齐。 */
.setrow{grid-template-columns:minmax(0,1fr) 200px;}
.setrow .ctl{width:100%;justify-content:flex-end;}
.setrow .ctl > input[type=text],.setrow .ctl > select{width:100%;min-width:0;}
/* v3.12：填昵称、外号的两处控件单独美化（用户 m39759 ⑤）：软底 + 圆角，
   悬停浮起来一点，聚焦时描边发光，跟首页卡片的质感统一。 */
.setrow .ctl > input[type=text]{border-radius:10px;background:var(--soft);border-color:transparent;padding:8px 12px;transition:background .15s,border-color .15s,box-shadow .15s;}
.setrow .ctl > input[type=text]:hover{background:var(--card);border-color:var(--line);}
.setrow .ctl > input[type=text]:focus{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}

/* v3.10：滑动开关。原来用原生 checkbox + 「开/关」文字，和首页的大开关风格不一致。
   这里保留真实 input 供 collectSettings 读取，视觉换成轨道+圆点，勾选态交给 :checked。 */
.sw2{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  /* v3.12：状态文字挪到轨道左边（用户 m39759 ③）。原来「开」字在轨道右侧，
     把开关往左顶了 38px，跟同一列的输入框右边缘对不齐。 */
  flex-direction:row-reverse;}
.sw2 input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
/* v3.42（用户 m03616 第 3 条）：全站只有一种尺寸的开关——轨道 38×22、圆点 16。
   以前「模式开关」单独缩成 36×21，同一屏里两种大小的胶囊并排，看着不齐。 */
.sw2 .tr{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:.18s;flex:none;}
.sw2 .tr:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s;}
.sw2 input:checked ~ .tr{background:var(--accent);}
.sw2 input:checked ~ .tr:after{transform:translateX(16px);}
.sw2 .st{font-size:12.5px;color:var(--muted);min-width:2em;white-space:nowrap;}
.sw2 input:checked ~ .st{color:var(--text);font-weight:600;}
/* v3.50（用户 m06761 第 4 条）：开关小字跟着状态走——开着显「开」、关着显「关」。
   两个字都写在标签里（<i class='on'>开</i><i class='off'>关</i>），露哪个由 :checked 决定：
   纯 CSS、不重渲染，切开关不会掉字，也不需要 JS 去改 textContent。 */
.sw2 .st i{font-style:normal;}
.sw2 .st .on{display:none;}
.sw2 .st .off{display:inline;}
.sw2 input:checked ~ .st .on{display:inline;}
.sw2 input:checked ~ .st .off{display:none;}
.sw2 input:focus-visible ~ .tr{outline:2px solid var(--accent);outline-offset:2px;}
html.booting .sw2 .tr,html.booting .sw2 .tr:after{transition:none;}
html.booting *,html.booting *::before,html.booting *::after{transition:none!important;}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
/* 列表类设置（外号/唤醒词）撑满整行，否则输入框缩在左边、右边一大片空 */
.setrow.wide .chips{width:100%;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:13.5px;}
.chip b{cursor:pointer;color:var(--muted);font-weight:400;}
.chip b:hover{color:var(--bad);}
#check-bar{margin-bottom:12px;}
/* v3.73（用户 m24918 澄清第 1 条）：只留一行，文字靠左；要的是行内垂直居中，不是水平居中。 */
#check-bar .chk{position:relative;display:flex;align-items:center;justify-content:flex-start;padding:8px 12px;border-radius:8px;

#check-bar .chk .lvl{position:absolute;left:10px;top:50%;transform:translateY(-50%);flex:none;font-weight:600;font-size:11px;padding:1px 6px;border-radius:5px;

#check-bar .chk.error{background:rgba(239,68,68,.09);border-color:rgba(239,68,68,.35);color:var(--bad);}
#check-bar .chk.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.38);color:var(--warn);}
#check-bar .chk .txt{flex:1 1 auto;text-align:left;padding:0 12px 0 54px;color:var(--text);}
.chip-in{min-width:160px;flex:1;border:1px dashed var(--line);border-radius:999px;background:transparent;padding:4px 11px;font-size:13.5px;}
.chip-in:focus{outline:none;border-color:var(--accent);border-style:solid;}
/* v3.12：外号 / 唤醒词这组 chips 与输入框一起美化（用户 m39759 ⑤）：
   胶囊改实底带阴影，输入框从虚线框换成软底圆角，聚焦时描边发光。 */
.chips{gap:8px;padding:2px 0;}

.chip:hover{border-color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.10);}
.chip b{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s,color .15s;}
.chip b:hover{background:rgba(239,68,68,.14);}
.chip-in{border:1px solid transparent;border-radius:10px;background:var(--soft);padding:6px 12px;transition:background .15s,border-color .15s,box-shadow .15s;}
.chip-in:hover{background:var(--card);border-color:var(--line);}
.chip-in:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}

th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap;}

@media (max-width:860px){.wrap{padding:12px;}}
/* v3.14：单群模式下「不在白名单里的全局项」用 .ro 置灰，与 v3.13 的锁定项 .locked
   （控件禁用 + 「已锁定」标签）分开。以前两者共用 .locked，这两条写在后面把 v3.13 的样式

.setgrp[data-split="3"] .col.off .bandbox{pointer-events:auto;}
.bandprev{position:relative;height:72px;border-radius:10px;background:var(--soft);cursor:pointer;overflow:hidden;

/* 时段曲线所在的 .sub 在「非当前模式」的灰列里也保持正常亮度：

.setgrp[data-split="3"] .col.off > .sub.sub-bands{opacity:1;}
/* v3.30（用户 m47796 第 1 条）：底图与概率线都改成 SVG 折线，不再是一根根柱子。 */
.bp-line{position:absolute;left:0;right:0;top:0;width:100%;height:calc(100% - 12px);pointer-events:none;}
.bp-line .larea{fill:rgba(100,116,139,.18);}
.bp-line .lline{stroke:rgba(100,116,139,.55);stroke-width:1.5;stroke-linejoin:round;}
.bp-prob{position:absolute;left:0;right:0;top:0;width:100%;height:calc(100% - 12px);pointer-events:none;}
.bp-prob path{stroke:var(--accent);stroke-width:2;stroke-linejoin:round;fill:none;}
.bp-tag{position:absolute;top:2px;font-size:10px;color:var(--accent);transform:translateX(-50%);white-space:nowrap;}
.bandfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.bandfoot .bsum{font-size:12px;color:var(--muted);flex:1;min-width:0;}
.bandfoot .bsum i{font-style:normal;color:var(--muted);opacity:.85;}
.bp-edge{position:absolute;top:0;bottom:12px;width:1px;background:var(--line);}
.bp-axis{position:absolute;left:0;right:0;bottom:1px;height:11px;font-size:9px;color:var(--muted);pointer-events:none;}
.bp-axis span{position:absolute;transform:translateX(-50%);}
.bp-axis span:first-child{transform:none;}
.bp-axis span:last-child{transform:translateX(-100%);}
/* 深色下灰线太暗，抬一点对比 */
html[data-theme="dark"] .bp-line .larea{fill:rgba(255,255,255,.10);}
html[data-theme="dark"] .bp-line .lline{stroke:rgba(255,255,255,.32);}
/* v3.30：艾特一行两个开关（触发 / 必回），必回是进阶模式的占位，灰着不可点 */

   两个开关一宽一窄时文字位置看着歪。

   这里多一层灰底就显得两种控件不一样；唤醒那六行也一并统一成裸开关。 */

   休息时段）的开关排成「轨道在左、文字在右」，跟普通行的 row-reverse 正好相反——同一页两种排法，

.bd-chart{position:relative;height:252px;margin:4px 0 4px;border-radius:10px;background:var(--soft);overflow:hidden;touch-action:none;user-select:none;}
.bd-grid{position:absolute;inset:0;pointer-events:none;}

.bd-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

/* v3.74（用户 m00024 第 4-a 条）：手柄原来整条 16px 都能吃指针，正好把格线 ±8px 全盖住——

.bd-handle:after{content:"";position:absolute;left:3px;top:50%;width:10px;height:24px;margin-top:-12px;border-radius:5px;background:var(--accent);opacity:.9;pointer-events:auto;cursor:col-resize;}

.bd-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap;}

.bd-hgrid{position:absolute;inset:0;pointer-events:none;}
.bd-hgrid span{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line);opacity:.5;}

    font-variant-numeric:tabular-nums;}

  .bd-chart{cursor:default;}
  .bd-chart.near-edge{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><path d='M3 21 L9 15' stroke='%23111827' stroke-width='2.4'/><path d='M9 15 L20 4 L22 6 L11 17 Z' fill='%23e5e7eb' stroke='%23111827' stroke-width='1.4' stroke-linejoin='round'/></svg>") 3 21, crosshair;}

/* v3.92（用户 m06951 第 5~7 条）：提示词页——左设置、右预览，右栏吸顶。
   v4.10（本轮美化）：整页收紧。基线这条 .pp-tabs 保留（测试拿它当锚点），紧跟着覆盖成分段控件：
   两个 54px 蓝块 → 一条 34px 的胶囊条，标题与副标题同行。 */
.pp-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px;}
.pp-tabs{grid-template-columns:auto auto;justify-content:flex-start;gap:2px;width:max-content;max-width:100%;
  padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:10px;}
.pp-tab{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;height:28px;
  padding:0 13px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12.5px;
  font-weight:600;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;}
.pp-tab .pp-sub{font-size:11px;font-weight:400;color:inherit;opacity:.72;}
.pp-tab:hover{color:var(--text);}
.pp-tab.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px var(--line);}
.pp-tab.on .pp-sub{color:var(--muted);opacity:1;}
.pp-pane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;}
.pp-pane[hidden]{display:none;}
.pp-left,.pp-right{min-width:0;display:flex;flex-direction:column;gap:8px;}
.pp-right{position:sticky;top:6px;}
.pp-left>.dcard,.pp-right>.dcard{padding:10px 12px;margin:0;}
/* 左栏参数：一行一个键值对，说明收进 i 的 title，只有悬停才出现。 */
.pp-left .dhead{display:flex;align-items:center;gap:6px;margin:0 0 3px;font-size:12px;font-weight:600;color:var(--muted);}
.pp-left .dhead-x{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);}
.pp-left .di{flex:none;width:13px;height:13px;border-radius:50%;border:1px solid var(--line);color:var(--muted);
  font:600 9px/1 -apple-system,"Segoe UI",sans-serif;font-style:normal;display:inline-flex;align-items:center;
  justify-content:center;cursor:help;letter-spacing:0;}
.pp-left .di:hover{border-color:var(--accent);color:var(--accent);}
.pp-left .drow{padding:4px 0;gap:8px;}
.pp-left .dlb{flex:0 0 96px;font-size:12.5px;font-weight:500;gap:5px;}
.pp-left .dipt{height:27px;font-size:12.5px;}
.pp-left .dipt.wide{min-width:200px;max-width:100%;}
.pp-left .dtip{display:none;}
.pp-left .dtools{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 12px;}
.pp-left .dtool{padding:3px 2px;font-size:12px;}
/* 右栏：一条标题带（复制 / 放大）→ 一行 chips → 整块等宽正文 → 状态 / 警告 / 分段。 */
.pp-prev{display:flex;flex-direction:column;overflow:hidden;}
.pp-prev-h{display:flex;align-items:center;gap:8px;margin:-10px -12px 0;padding:8px 12px;border-bottom:1px solid var(--line);}
.pp-prev-h h4{margin:0;font-size:12.5px;font-weight:600;}
.pp-prev-h .pp-h4s{font-size:11px;font-weight:400;color:var(--muted);}
.pp-prev-acts{margin-left:auto;display:flex;gap:3px;}
.pp-prev-acts .pm-ico{width:auto;min-width:0;padding:0 7px;font-size:11px;height:22px;}
.pp-prev-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 -12px;padding:6px 12px;border-bottom:1px solid var(--line);}
.pp-chip{padding:0 7px;height:19px;line-height:18px;border-radius:999px;background:var(--soft);border:1px solid var(--line);
  font-size:10.5px;color:var(--muted);white-space:nowrap;}
.psegbox{display:flex;flex-direction:column;gap:4px;}
.pp-prev .psegbox{margin:0 -12px;padding:8px 12px;border-top:1px solid var(--line);max-height:34vh;overflow:auto;}
.pseg{border:1px solid var(--line);border-radius:8px;background:rgba(127,127,127,.04);overflow:hidden;}
.pseg>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;padding:5px 8px;}
.pseg>summary::-webkit-details-marker{display:none;}
.pseg>summary:before{content:"\25B8";color:var(--muted);font-size:10px;transition:transform .15s;}
.pseg[open]>summary:before{transform:rotate(90deg);}
.pseg .psn{font-size:11.5px;font-weight:600;}
.pseg .pss{font-size:10.5px;color:var(--muted);margin-left:auto;}
.pseg.edited>summary .psn:after{content:" · 已改";color:#f0b46a;font-size:11px;font-weight:400;}
.pseg.ours>summary .psn:after{content:" · 插件加的";color:#7db6ff;font-size:11px;font-weight:400;}
.psegpre{margin:0;padding:2px 10px 10px;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.6;
  max-height:min(46vh,460px);overflow:auto;color:var(--text);}
.pseg .psta{margin:2px 10px 0;width:calc(100% - 20px);}
.psegf{padding:8px 10px 10px;display:flex;justify-content:flex-end;}
.psegempty{padding:10px;color:var(--muted);font-size:12px;}
.pp-prev .pm-note,.pp-prev .pm-warning{margin:0 -12px;padding:6px 12px;border-top:1px solid var(--line);}
.pp-prev .pm-toolbar{margin:0 -12px;padding:6px 12px;border-top:1px solid var(--line);}
.dpre.tall{max-height:min(62vh,620px);min-height:200px;margin:0 -12px;border:0;border-radius:0;padding:10px 12px;font-size:12px;line-height:1.75;}
.pp-prev.big{position:fixed;inset:112px 12px 12px;height:auto;max-height:none;z-index:9999;margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);}
.pp-prev.big .dpre.tall{max-height:none;flex:1 1 auto;min-height:0;}
.pp-prev.big .psegbox{max-height:26vh;}
@media (max-width:1180px){.pp-pane{grid-template-columns:1fr;}.pp-right{position:static;}}

/* Shared prompt layout editor（v4.10 紧凑版）：一行一个模块，正文默认折叠。 */
.pm-editor{min-width:0;}
.pm-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin:0 0 6px;}
.pm-toolbar label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;}
.pm-toolbar .dipt{height:26px;font-size:12px;min-width:0;}
.pm-toolbar .pm-state{flex:1 1 auto;min-width:0;padding:0;text-align:right;font-size:11px;line-height:1.4;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pm-toolbar .dmini{margin-left:0;height:26px;}
.pm-secondary{justify-content:flex-start;margin:6px 0 2px;}
.pm-modules{display:flex;flex-direction:column;gap:5px;margin:4px 0 8px;}
.pm-module{min-width:0;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--soft);overflow:hidden;}
.pm-module:has(.pm-enabled input:not(:checked)){opacity:.6;}
.pm-module-head{display:flex;align-items:center;gap:5px;padding:3px 5px 2px 7px;margin:0;}
.pm-idx{flex:none;min-width:14px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}
.pm-enabled{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;}
.pm-enabled input{width:13px;height:13px;margin:0;accent-color:var(--accent);}
.pm-label{flex:1 1 auto;min-width:60px;height:25px;border:1px solid transparent;background:transparent;color:var(--text);
  padding:0 6px;font-size:12.5px;font-weight:600;border-radius:6px;font-family:inherit;}
.pm-label:hover{border-color:var(--line);background:var(--card);}
.pm-label:focus{outline:none;border-color:var(--accent);background:var(--card);}
.pm-chars{flex:none;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.pm-move{flex:none;width:74px;display:flex;gap:2px;margin-left:0;justify-content:flex-end;}
.pm-ico{width:21px;height:21px;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;
  color:var(--muted);font-size:12px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.pm-ico:hover{border-color:var(--line);background:var(--card);color:var(--accent);}
.pm-ico:disabled{opacity:.3;cursor:not-allowed;}
.pm-meta{display:flex;align-items:center;gap:6px;padding:0 7px 3px 26px;font-size:11px;color:var(--muted);}
.pm-src{height:21px;font-size:11.5px;min-width:0;max-width:260px;border-radius:6px;padding:0 3px;}
.pm-src-note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pm-body{margin:0 6px 4px 26px;}
.pm-body>summary{display:flex;align-items:center;gap:6px;padding:1px 0;font-size:11px;color:var(--muted);cursor:pointer;list-style:none;}
.pm-body>summary::-webkit-details-marker{display:none;}
.pm-body>summary:before{content:"\25B8";font-size:10px;transition:transform .15s;}
.pm-body[open]>summary:before{transform:rotate(90deg);}
.pm-body .darea{margin:2px 0 0;font-size:12px;line-height:1.6;min-height:74px;}
.pm-foot{display:flex;justify-content:flex-end;gap:6px;padding:0 7px 6px 26px;}
.pm-foot .dmini{margin-left:0;}
.pm-add{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;}
.pm-add select{flex:1 1 auto;min-width:0;height:26px;font-size:12px;}
.pm-add .dmini{margin-left:0;height:26px;}
.pm-source-label{display:flex;flex-direction:column;gap:6px;font-size:12px;margin:8px 0;}
.pm-note{font-size:11px;line-height:1.55;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;}
.pm-state{font-size:11.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);}
.pm-warning{font-size:11px;line-height:1.55;color:var(--accent);white-space:pre-wrap;overflow-wrap:anywhere;}
.pm-warning:empty{display:none;}
.pm-content{box-sizing:border-box;width:100%;}
.pm-content[readonly]{opacity:.8;}
.pm-reference{margin-top:6px;}
.pm-reference>.pm-note,.pm-reference>.pm-warning,.pm-native-reference>.pm-note{padding:6px 10px;}
.pm-reference-text{display:block;box-sizing:border-box;width:calc(100% - 20px);margin:4px 10px 10px;font-family:monospace;font-size:12px;}
.pm-reference-meta{font-size:11px;max-height:200px;}
.pm-reference-item,.pm-native-reference{margin:6px 10px;}
.pm-system{box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;min-height:160px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;}
.pm-editor button:disabled{opacity:.5;cursor:not-allowed;}
/* v4.10 二轮：暗色下原生复选框会发白，给盒内这几处单独用暗色控件；参数行标签不折行、数字框收窄；
   右栏限高后可自己滚，页签两等分不横铺。 */
html[data-theme="dark"] .pm-enabled input,html[data-theme="dark"] .dtool input{color-scheme:dark;}
.pp-tabs{grid-template-columns:auto auto auto;width:max-content;max-width:100%;}
.pp-tab{padding:0 10px;}
.pp-left .dlb{flex:0 0 108px;white-space:nowrap;}
.pp-left .drow .num{width:96px;min-width:0;flex:none;}
.pp-left .drow .dunit{margin-left:6px;}
.pm-src{max-width:190px;}
.pm-convert{margin-left:auto;flex:none;}
.pm-convert .dmini{margin-left:0;height:22px;padding:0 8px;font-size:11px;}
.pp-right{max-height:calc(100vh - 26px);overflow:auto;}
.pp-right .dpre.tall{max-height:min(46vh,430px);}
.pp-prev .psegbox{max-height:22vh;}
.panel.pp-panel{overflow:visible;}
@media (max-width:1180px){.pp-right{max-height:none;overflow:visible;}}
/* v4.10 三轮：整页不滚，左栏、右栏各自滚，页签常驻（高度由 ppLayout 按窗口现算）。 */
.pp{display:flex;flex-direction:column;gap:8px;min-height:420px;}
.pp-tabs{flex:none;}
.pp-pane{flex:1 1 auto;min-height:0;overflow:hidden;}
.pp-left,.pp-right{height:100%;min-height:0;overflow:auto;padding-right:2px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
.pp-right{max-height:none;}
.pp-left::-webkit-scrollbar,.pp-right::-webkit-scrollbar{width:8px;height:8px;}
.pp-left::-webkit-scrollbar-thumb,.pp-right::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.pp-left::-webkit-scrollbar-track,.pp-right::-webkit-scrollbar-track{background:transparent;}
/* v4.10：分段列表是 flex 列，条目会被压扁成一格一格重叠，钉住它们别缩。 */
.psegbox>.pseg{flex:0 0 auto;}
/* v4.10：[hidden] 被 .drow{display:flex} 顶掉过，试跑结果框一进页面就露个空框，这里按隐藏处理。 */
.pp [hidden]{display:none !important;}
.pm-footer{border-top:1px solid var(--line);padding-top:6px;margin-top:6px;}
.pm-footer .pm-note{flex:1 1 auto;min-width:0;}
/* v4.10 四轮：右栏一屏装下——预览框吃掉剩余高度、自己不再滚；左栏编辑工具条吸在栏顶。 */
.pp-right{overflow:hidden;}
.pp-right{z-index:40;}
.pp-right:has(.pp-prev.big),.pp-pane:has(.pp-prev.big){overflow:visible;}
.pp-right>.dcard{flex:1 1 auto;min-height:0;overflow:hidden;}
.pp-prev{height:100%;}
.pp-prev .dpre.tall{flex:1 1 auto;min-height:150px;max-height:none;}
.pp-prev .psegbox{flex:0 0 auto;}
.pp-left .pm-editor>.pm-toolbar{position:sticky;top:0;z-index:3;background:var(--card);
  padding:5px 0;margin:-2px 0 6px;border-bottom:1px solid var(--line);}
@media (max-width:640px){.pm-module-head{flex-wrap:wrap;}.pm-meta{padding-left:8px;}.pm-body{padding-left:8px;}}
/* m01209：三个页签、模板卡片页、动态尾段分隔条、身份只读标记；顺手把整页再收紧一点。 */
.pp-tab{padding:0 12px;height:30px;}
.pp-tab .pp-sub{margin-left:6px;font-size:10.5px;color:var(--muted);font-weight:400;}
.pp-tab.on .pp-sub{color:inherit;opacity:.85;}
.pp-pane-wide{display:block;overflow:auto;}
#pp-tpl{max-width:none;}
.ptpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:8px 0;}
.ptpl-card{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:8px 9px;min-width:0;}
.ptpl-card.editing{grid-column:1/-1;background:var(--card);}
.ptpl-h{display:flex;align-items:baseline;gap:6px;margin:0 0 5px;}
.ptpl-h b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ptpl-n{margin-left:auto;font-size:11px;color:var(--muted);flex:none;}
.ptpl-body{margin:0 0 6px;max-height:108px;overflow:auto;font-size:11.5px;line-height:1.5;color:var(--muted);
  white-space:pre-wrap;word-break:break-word;font-family:inherit;}
.ptpl-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ptpl-time{margin-right:auto;font-size:11px;color:var(--muted);}
.ptpl-acts .dmini{margin-left:0;height:22px;padding:0 8px;font-size:11px;}
.ptpl-field{display:block;margin:0 0 6px;}
.ptpl-field>span{display:block;font-size:11.5px;color:var(--muted);margin:0 0 3px;}
.ptpl-field .dipt,.ptpl-field .darea{width:100%;}
.pm-dynamic{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px dashed var(--line);border-radius:9px;
  background:transparent;font-size:11.5px;color:var(--muted);}
.pm-dyn-tag{flex:none;font-weight:600;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;}
.pm-dyn-note{flex:1 1 auto;min-width:0;line-height:1.5;}
.pm-dynamic .pm-enabled{margin:0;flex:none;font-size:11px;}
.pm-lock{flex:none;min-width:48px;text-align:center;font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:0 6px;margin-left:0;}
.pm-locknote{font-size:11px;color:var(--muted);}
.pm-hint{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.5;}
.pm-module-head{gap:4px;}
.pm-meta{padding-bottom:4px;}
.pm-label{height:24px;}
.pm-body>.darea{margin-top:2px;}
  /* 用户 m02159：工具打勾清单、锁定段、动态尾段的右侧说明 */
  .pm-tools{margin:0 6px 5px 26px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 6px 5px;}
  .pm-tools-head{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .pm-tools-sum{margin-left:auto;color:var(--text);font-size:11px;}
  .pm-tool{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px;font-size:12px;line-height:1.35;cursor:pointer;}
  .pm-tool:hover{background:var(--soft);}
  .pm-tool.on{background:var(--soft);}
  .pm-tool input{flex:none;margin:0;}
  .pm-tool-name{flex:none;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;}
  .pm-tool-desc{flex:1 1 auto;min-width:0;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pm-module-head .pm-lock{flex:none;margin-left:1px;}
  .pm-module.pm-locked .pm-label{color:var(--muted);}
  .pm-dynamic .pm-dyn-note{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px;}
  .pm-dynamic .pm-dyn-tip{flex:none;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px;line-height:15px;cursor:help;}
  .pm-dynamic .pm-enabled{margin:0 0 0 auto;flex:none;font-size:11px;}
  /* 用户 m02159 图4：底部工具条压成一行左「新增」右「快捷」，说明收成一行小字 */
  .pm-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;}
  .pm-foot .pm-add{flex:1 1 200px;min-width:0;}
  .pm-foot .pm-add select{flex:1 1 auto;min-width:0;}
  .pm-quick{display:flex;gap:4px;flex:none;}
  .pm-quick .dmini{margin:0;height:24px;font-size:11.5px;}
  .pm-foot .dmini{white-space:nowrap;flex:none;}
  .pm-tip{font-size:11.5px;color:var(--soft);line-height:1.5;margin-top:5px;}
  /* 用户 m02993 图1：实时窗口 / 动态段用颜色分开——一个是「位置」，一个是真注入的动态模板。 */
  /* 用户 m04617 图5：这几块的彩色左条以前是 border-left，占 3px 宽，会把标题挤得比别的行右移 2px；
     改成内阴影，颜色照旧、宽度不占，所有行的名字才在同一条竖线上。 */
  .pm-module.pm-realtime{box-shadow:inset 3px 0 0 #4f7cff;background:linear-gradient(90deg,rgba(79,124,255,.07),rgba(79,124,255,0) 62%);}
  .pm-module.pm-dynamic-mod{box-shadow:inset 3px 0 0 #a06bff;background:linear-gradient(90deg,rgba(160,107,255,.09),rgba(160,107,255,0) 62%);}
  .pm-module.pm-realtime .pm-idx,.pm-module.pm-dynamic-mod .pm-idx{font-weight:600;}
  .pm-cta{border-color:#4f7cff !important;color:#5b86ff !important;font-weight:600;}
  .pm-cta:hover{background:rgba(79,124,255,.16);}
  .pm-foot .pm-add select{margin:0;}
  .pm-foot .pm-tip{padding-left:1px;}
  /* 用户 m02993 图7：决策模型 / 备用模型并排，标签收在上面一行，右侧不再空一大片。 */
  .drows.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;}
  .drows.pair .dpair{min-width:0;}
  /* 用户 m02993 图7：决策模型 / 备用模型并排，标签收在上面一行，右侧不再空一大片。 */
  .drows.pair .dcap{font-size:12.5px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:4px;
    margin:1px 0 2px;padding-left:7px;}
  .drows.pair .dipt{width:100%;min-width:0;}
  /* 用户 m02993 图2：工具清单折叠成一条「正文」那样的小条。 */
  .pm-tools-fold{margin:0 6px 4px 26px;}
  .pm-tools-fold>.pm-sum{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:2px 6px;border-radius:6px;background:rgba(127,127,127,.10);color:var(--muted);cursor:pointer;font-size:11.5px;list-style:none;}
  .pm-tools-fold>.pm-sum::-webkit-details-marker{display:none;}

<script>

  // v3.08 重排（用户 m38915）：原来 4 个页签里「触发与配额」20 项、「窗口与记录」17 项，

    // v3.11（用户 m39492）：①「被 @ 必定回复」并入「总开关」一栏——两个都是

    // v3.17（用户 m40932）：重试不再单独占一整块——并进左列，排在身份下面。

    { p: "basic", t: "身份", split: 2, col: "left",

    // 用户 m10749 第 2 条：配额整组从「限额设置」页搬到基础设置右下角，紧跟「唤醒」组。
    // 两个开关开一个、另一个变灰（值保留，见 paintQuotaMutex），不再互相关掉。

    { p: "trigger", t: "普通模式", split: 3, mode: "normal", sub: 1,

  // Switching panes/scope keeps canonical drafts in PP_STATES, never serializes them to storage.
  function ppSetPane(name){
    ppPane = name === "reply" ? "reply" : (name === "templates" ? "templates" : "decision");
    Array.prototype.forEach.call(document.querySelectorAll("#settings .pp-tab"),function(b){ b.classList.toggle("on",b.getAttribute("data-pp") === ppPane); });
    Array.prototype.forEach.call(document.querySelectorAll("#settings .pp-pane"),function(p){ p.hidden = p.getAttribute("data-pane") !== ppPane; });

  // v4.10：提示词页外层 .panel 带着 overflow:hidden，会把右栏的 position:sticky 一起废掉（右栏不再吸顶）。
  // 只给这一页的 panel 打标记，让它单独改成 overflow:visible，别动全局那条规则。
  function ppMarkPanel(){
    var n = document.querySelector(".pp");
    var panel = n && n.closest ? n.closest(".panel") : null;
    if(panel) panel.classList.add("pp-panel");
  }
  // v4.10：整页不滚，改成左栏、右栏各自滚（页签常驻），高度按窗口现算，省得右栏跟内容一起跑掉。
  function ppLayout(){
    ppMarkPanel();
    var pp = document.querySelector(".pp"), tabs = document.querySelector(".pp-tabs");
    if(!pp || !tabs) return;
    var top = tabs.getBoundingClientRect().top;
    if(top < 60){ window.scrollTo(0,0); top = tabs.getBoundingClientRect().top; }
    var h = Math.round(window.innerHeight - Math.max(top, 0) - 14);
    pp.style.height = Math.max(420, h) + "px";
  }
  function ppAutoPreview(){
    if(curPage !== "prompt") return;
    ppLayout();
    if(ppPane === "templates"){ ppTplLoad(); ppTplRender(); return; }
    var s = ppState(ppPane);
    ppRenderEditor(s); ppPaintPreview(s);
    return s.loaded ? ppPreview(s) : ppLoad(s,false);
  }

  function dcTest(){
    var box = document.getElementById("dec-test-box");
    var out = document.getElementById("dec-test-out");
    if(!box || !out) return;
    var sid = dScopeSidForDecision();
    box.hidden = false;
    out.textContent = "跑一次决策…（超时就按失败算，别关页面）";
    post(API + "/decision-test" + (sid ? "?sid=" + encodeURIComponent(sid) : ""))
      .then(function(d){
        var r = (d && d.result) || {};
        if(!d || !d.ok){ out.textContent = "试跑失败：" + ((d && d.error) || "接口没回数据"); return; }
        var lines = [];
        lines.push("结论：" + (r.failed ? "失败（按「决策失败时」的设置处理）" : (r.reply ? "判定要回" : "判定不回")));
        if(r.reason) lines.push("理由：" + r.reason);
        // m01209 图3：决策只判断回不回，不再顺带指定要说什么。
        lines.push("模型：" + (r.model || "（未记录）") + (r.via === "fallback" ? "（备用）" : "") +
                   " · 尝试 " + (r.attempts || 1) + " 次 · 用时 " + (r.elapsed || 0) + " 秒");
        if(r.tools_used && r.tools_used.length) lines.push("用了工具：" + r.tools_used.join("、"));
        if(r.error) lines.push("错误：" + r.error);
        if(r.raw) lines.push("", "原始返回：", String(r.raw).slice(0, 1200));
        out.textContent = lines.join("\n");
      })
      .catch(function(err){ out.textContent = "试跑失败：" + (err && err.message ? err.message : err); });

  var ppPane = "decision";

  function bindDecisionPage(){
    var box = document.getElementById("settings");
    if(!box || box.__promptBound) return;
    box.__promptBound = true;
    function editorFor(t){ return t && t.closest ? t.closest("[data-pp-editor]") : null; }
    function inputChanged(e){
      var t = e.target;
      if(t && t.getAttribute && t.getAttribute("data-tpl-field") && PP_TPL.editing){
        PP_TPL.editing[t.getAttribute("data-tpl-field")] = t.value;
        return;
      }
      var root = editorFor(t);
      if(!root || !t.getAttribute) return;
      var toolName = t.getAttribute("data-pm-tool");
      if(toolName){
        var tst = ppState(root.getAttribute("data-pp-editor"));
        ppToggleTool(tst, toolName, !!t.checked);
        return;
      }
      var field = t.getAttribute("data-pm-field");
      if(field !== "label" && field !== "content" && field !== "text") return;
      var st = ppState(root.getAttribute("data-pp-editor")), at = Number(t.getAttribute("data-pm-index"));
      if(field === "content" && t.getAttribute("data-pm-promote")){
        var mod = st.layout && st.layout.modules ? st.layout.modules[at] : null;
        if(mod && mod.type !== "text" && mod.type !== "custom"){ ppPromote(st, at, t.value); return; }
      }
      ppUpdateField(st,field,at,t.value);
    }
    box.addEventListener("input",inputChanged);
    box.addEventListener("change",function(e){
      var t = e.target, root = editorFor(t);
      if(root && t.getAttribute){
        var field = t.getAttribute("data-pm-field");
        if(field === "mode" || field === "type" || field === "enabled"){
          var stPM = ppState(root.getAttribute("data-pp-editor"));
          ppUpdateField(stPM,field,Number(t.getAttribute("data-pm-index")),field === "enabled" ? t.checked : t.value);
          // v4.34（用户 m13976 第 1/3 条）：勾「启用」以前只改草稿，不点右下角保存
          // 就等于没开 —— 决策页那个「系统动态段」正是这么勾了却没生效的：开关一眼
          // 就能看出变化，勾完直接存。
          if(field === "enabled") ppSave(stPM,false);
        }
        return; // Module fields have no data-k and never enter generic auto-save.
      }
      var key = t && t.getAttribute ? t.getAttribute("data-k") : "";
      if(key === "decision_persona" || key === "decision_tools"){
        var refSid = String(scopeSid || "");
        PP_REF_DIRTY[refSid] = (PP_REF_DIRTY[refSid] || 0) + 1;
        var s = ppState(ppPane);
        if(s.loaded){ s.notice = "人格/工具待普通设置自动保存，引用随后刷新。"; ppPaintStatus(s); }
      }
      if(!t || !t.classList || !t.classList.contains("dtchk")) return;
      var hid = document.getElementById("dec-tools");
      if(!hid) return;
      hid.value = JSON.stringify(dPickedNow());
      hid.dispatchEvent(new Event("change",{bubbles:true}));
    });
    box.addEventListener("click",async function(e){
      var t = e.target;
      if(!t) return;
      var tab = t.closest ? t.closest("[data-pp]") : null;
      if(tab){ ppSetPane(tab.getAttribute("data-pp")); e.preventDefault(); return; }
      var tplBtn = t.closest ? t.closest("[data-tpl]") : null;
      if(tplBtn){
        var tplAct = tplBtn.getAttribute("data-tpl"), tplId = tplBtn.getAttribute("data-tpl-id") || "";
        e.preventDefault();
        if(tplAct === "new"){ PP_TPL.editing = {id:"", name:"", content:""}; PP_TPL.notice = ""; ppTplRender(); }
        else if(tplAct === "edit"){
          var hit = PP_TPL.items.filter(function(x){ return String(x.id) === String(tplId); })[0];
          if(hit){ PP_TPL.editing = {id:String(hit.id), name:String(hit.name || ""), content:String(hit.content || "")}; ppTplRender(); }
        }
        else if(tplAct === "cancel"){ PP_TPL.editing = null; ppTplRender(); }
        else if(tplAct === "save"){ ppTplSave(); }
        else if(tplAct === "del"){ ppTplDelete(tplId); }
        else if(tplAct === "reload"){ PP_TPL.loaded = false; PP_TPL.loading = null; PP_TPL.notice = ""; ppTplLoad(); }
        return;
      }
      // v4.10：右栏标题带上的「复制 / 放大」，以及模块正文折叠状态的记忆（折叠状态存在 s.open，重渲染后不丢）。
      var copyBtn = t.closest ? t.closest("[data-pp-copy]") : null;
      if(copyBtn){ ppCopy(copyBtn.getAttribute("data-pp-copy"), copyBtn); e.preventDefault(); return; }
      var expandBtn = t.closest ? t.closest("[data-pp-expand]") : null;
      if(expandBtn){
        var exKind = expandBtn.getAttribute("data-pp-expand");
        var exPane = document.querySelector(".pp-prev[data-pp-prev='" + exKind + "']");
        if(exPane){ expandBtn.textContent = exPane.classList.toggle("big") ? "还原" : "放大"; }
        e.preventDefault(); return;
      }
      var sum = t.closest ? t.closest("summary") : null;
      if(sum && sum.classList && sum.classList.contains("pm-sum")){
        var sumDet = sum.parentNode, sumEd = editorFor(sum);
        if(sumDet && sumEd){
          var sumKind = sumEd.getAttribute("data-pp-editor"), sumIx = Number(sumDet.getAttribute("data-pm-open"));
          // 点 summary 时浏览器还没翻转 open，等一拍再读。
          setTimeout(function(){ if(!isNaN(sumIx)) ppState(sumKind).open[sumIx] = !!sumDet.open; },0);
        }
      }
      if(t.id === "dec-test"){
        var ds = ppState("decision");
        if(ds.loaded && !ds.dirty && !ds.saving) dcTest();
        e.preventDefault(); return;
      }
      // 用户 m13212 图1：「系统段 / 动态段」两个标签，点哪个就把藏着那个 select 的值换过去。
      var zoneBtn = t.closest ? t.closest("[data-pm-zone-pick]") : null;
      if(zoneBtn && !zoneBtn.disabled){
        var zRoot = editorFor(zoneBtn), zVal = zoneBtn.getAttribute("data-pm-zone-pick") === "dynamic" ? "dynamic" : "system";
        if(zRoot){
          var zBtns = zRoot.querySelectorAll("[data-pm-zone-pick]");
          Array.prototype.forEach.call(zBtns,function(b){ b.classList.toggle("on", b === zoneBtn); });
          var zSel = zRoot.querySelector("select[data-pm-zone]");
          if(zSel) zSel.value = zVal;
          var zState = ppState(zRoot.getAttribute("data-pp-editor"));
          if(zState) zState.zonePick = zVal;
        }
        e.preventDefault(); return;
      }
      var button = t.closest ? t.closest("[data-pm-action]") : null;
      if(!button || button.disabled) return;
      e.preventDefault();
      var s = ppState(button.getAttribute("data-pm-kind")), action = button.getAttribute("data-pm-action");
      if(action === "save"){ ppSave(s,false); return; }
      if(action === "reload"){
        if(s.dirty && !(await mdConfirm("重新读取会放弃这份未保存草稿。请先复制需要保留的改动，确定继续？",{danger:true,ok:"放弃草稿并读取"}))) return;
        ppLoad(s,true); return;
      }
      if(action === "defaults"){
        if(!s.loaded || s.saving || !s.defaultLayout) return;
        if(!(await mdConfirm("把当前草稿换成服务端默认模板？这一步不会保存；当前改动会被替换。",{danger:true,ok:"载入默认模板"}))) return;
        s.layout = ppClone(s.defaultLayout); ppChanged(s,true); return;
      }
      if(action === "inherit"){
        if(!(await mdConfirm((s.sid ? "删除当前会话的提示词覆盖，恢复跟随全局？" : "删除全局提示词覆盖，恢复自动默认？") + "当前草稿会被替换，失败时保留草稿。",{danger:true,ok:"恢复并保存"}))) return;
        ppSave(s,true); return;
      }
      var root = editorFor(button), add = root ? root.querySelector("[data-pm-add]") : null;
      var zone = root ? root.querySelector("[data-pm-zone]") : null;
      ppModuleAction(s,action,Number(button.getAttribute("data-pm-index")),add ? add.value : undefined,
        zone ? zone.value : "");
    });
    window.addEventListener("resize",function(){ if(curPage === "prompt") ppLayout(); });
  }

  function pairUnitOf(numKey){

  function rowLineHtml(g){
    var onKey = String((g.keys || [])[0] || "");
    var numKey = PAIR_NUM[onKey] || "";
    var f = (schemaCache && schemaCache[onKey]) || {};
    var nf = numKey ? ((schemaCache && schemaCache[numKey]) || {}) : null;
    var on = !!(configCache && configCache[onKey]);

    // 作用域下拉先直出（v3.09）：它跟表单无关，每次进页面都要填。不直出的话
    // 首帧只有一个空框，等 /context-sessions 回来才出现「全局设置」——用户说的
    // 「切到设置页下拉框闪一下」就是这个。宽度已在 CSS 固定，选项多了也不抖。
    var sc = cacheGet("scopes");
    if(sc && sc.list && sc.list.length){
      aliasCache = sc.aliases || aliasCache;
      sessCache = sc.list;
      renderScopeOptions(sc.list);
    }
    if(scopeSid) return;
    var c = cacheGet("set");
    if(!c || !c.schema || !Object.keys(c.schema).length) return;
    schemaCache = c.schema;
    configCache = c.config || {};
    boundsCache = c.bounds || {};
    renderSettings();
    dcRefresh();
    // 这里不再把说明改成「刷新中…」：宽度一变，右边的按钮就像被推了一下
    //（用户 m07864 第 1 条）。首帧用的就是上次记下的那句，接口回来再校正数字。
  }

  // 只显示当前页的组；输入框全都在 DOM 里，切页不影响自动保存（值一直在表单里）
  // v3.51（用户 m07385 第 2 条）：淡入动画只在「人点页签」时播。以前每次 renderTabs 都播，
  // 而进页面会连渲染两次（缓存一次 + 拉回配置一次），于是看到内容闪两下。
  function applyPage(animate){
    var shown = [];
    Array.prototype.forEach.call(document.querySelectorAll("#settings .setgrp[data-page]"), function(el){
      var on = el.getAttribute("data-page") === curPage;
      el.style.display = on ? "" : "none";
      if(on) shown.push(el);
    });
    // v3.67（用户 m20117 第 7 条）：价目页跟「对哪个群生效」无关，卡片条在那页收起来。
    var cd = document.getElementById("set-cards");
    if(cd) cd.style.display = (curPage === "pricing") ? "none" : "";
    // v3.26（用户 m46693 ①）：换页内容淡入。
    // v3.52（用户 m07864 第 5 条）：删掉 ``void shown[0].offsetWidth``。这行是「强制同步
    // 重排整页」——切页时浏览器必须把刚显示出来的几百行全部量一遍，正是点页签会顿一下
    // 的来源；而元素从 display:none 变成可见时 CSS 动画本来就会重播，这行纯属多余。
    if(animate && shown.length){
      shown.forEach(function(el){ el.classList.remove("pgin"); });
      shown.forEach(function(el){ el.classList.add("pgin"); });
    }else{
      shown.forEach(function(el){ el.classList.remove("pgin"); });
    }
    if(curPage === "prompt") ppAutoPreview();
  }

  function renderTabs(){
    var box = document.getElementById("set-tabs");
    if(!box) return;
    var has = {};
    Array.prototype.forEach.call(document.querySelectorAll("#settings .setgrp[data-page]"), function(el){
      has[el.getAttribute("data-page")] = 1;
    });
    var list = PAGES.filter(function(p){ return has[p.id]; });
    if(!list.length){ box.innerHTML = ""; return; }
    if(!list.some(function(p){ return p.id === curPage; })) curPage = list[0].id;
    box.innerHTML = list.map(function(p){
      return "<button data-page='" + p.id + "'" + (p.id === curPage ? " class='on'" : "") + ">" + esc(p.t) + "</button>";
    }).join("");
    applyPage(false);
  }

  function collectSettings(){
    var out = {};
    Object.keys(schemaCache).forEach(function(k){
      var f = schemaCache[k] || {};
      var t = f.type || "string";
      var node = document.querySelector("#settings [data-k='" + k.replace(/'/g, "\\'") + "']");
      if(!node) return;
      // 单群模式下输入框空着 = 跟随全局。这里必须显式提交 null：直接 return 的话
      // 后端 merge=1 会把旧覆盖并回来，清空某项永远清不掉，界面还提示「已保存」
      // （审查 bug）。null 在后端表示「把这个覆盖项删掉」。
      // v3.70（用户 m21533 第 2 条）：私聊特例项（触发概率 100%）只在界面上显示默认值，
      // 没手动改过就不提交——不往 overrides 里写，会话卡才还是「全局配置」。
      if(scopeSid && DM_SPECIAL[k] && dmDefaultsCache[k] != null &&
         node.getAttribute("data-dmdef") === "1" &&
         !Object.prototype.hasOwnProperty.call(overrideCache, k)){
        var dnv = String(node.value == null ? "" : node.value).trim();
        if(dnv === String(dmDefaultsCache[k])) return;
      }
      if(scopeSid && t !== "switch" && t !== "bool" && t !== "boolean" &&
         (node.value == null || String(node.value).trim() === "")){ out[k] = null; return; }
      if(t === "switch" || t === "boolean" || t === "bool") out[k] = !!node.checked;
      else if(t === "integer") out[k] = parseInt(node.value, 10) || 0;
      else if(t === "float" || t === "number") out[k] = parseFloat(node.value) || 0;
      else if(t === "multi_select" || t === "list" || t === "array"){
        var arr = [];
        node.querySelectorAll(".chip").forEach(function(c){
          arr.push(c.textContent.replace(/×$/, "").trim());
        });
        out[k] = arr;
      } else out[k] = node.value;
    });
    // v3.09：表单里已经不再显示 enabled 与 takeover_default_chat，但配置里它们还在。
    // 提交时不能少这两项——PUT /config 收到一份缺键的对象等于把它们清掉，
    // enabled 会回落到默认 true，用户刚在首页关掉的插件又被打开。
    // 所以没渲染出来的键一律原样带上上次读到的值。
    Object.keys(schemaCache).forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(out, k)) return;
      if(!configCache || !Object.prototype.hasOwnProperty.call(configCache, k)) return;
      out[k] = configCache[k];
    });
    // 合并后的语义：停不停内置 default-chat 跟着「接管群聊触发判定」走。
    // 单独留一个开关只会产生「自己决策但不禁用 default-chat」的双回复坏状态。
    if(Object.prototype.hasOwnProperty.call(out, "decision_enabled")){
      out.takeover_default_chat = !!out.decision_enabled;
    }
    // v3.13（用户 m39983）：window_enabled 恒为开。后端 _LOCKED_ON 已经忽略任何关闭意图，
    // 这里再补一次，免得旧配置里残留的 false 被原样提交上去、日志里看着像关掉了。
    if(Object.prototype.hasOwnProperty.call(out, "window_enabled")) out.window_enabled = true;
    // v3.67（用户 m20117 第 2 条）：消息日志 / 会话统计的保留天数有硬下限 56 天（自适应阈值要长期历史）。
    // 填 0 / 30 一律按 56 存，输入框也顺手改成 56——别让页面留着一个后端不接受的数。
    ["decisions_keep_days", "stats_keep_days"].forEach(function(k){
      if(!Object.prototype.hasOwnProperty.call(out, k)) return;
      var n = parseInt(out[k], 10);
      if(!isFinite(n) || n < 56){
        out[k] = 56;
        var el = document.querySelector("#settings [data-k='" + k + "']");
        if(el) el.value = "56";
      }
    });
    return out;
  }

  // 配置体检：把互相冲突的组合直接摆在表单上面，只提示不改值

  // 用户 m08902 第 1 条：「休息时段·必回」默认是开的，线上却是关的。
  // 根因是 /config 只下发「存过」的键：新加的开关配置里还没有，页面上就渲染成没勾；
  // 此后随便改任何一项，collectSettings 都会把页面上所有开关的勾选状态整份提交，
  // 于是它被写成 false。这里先按 schema 补上默认值，让渲染和提交看到同一个值。
  function fillSchemaDefaults(cfg){
    var out = {};
    Object.keys(cfg || {}).forEach(function(k){ out[k] = cfg[k]; });
    Object.keys(schemaCache || {}).forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(out, k)) return;
      var f = schemaCache[k] || {};
      if(!Object.prototype.hasOwnProperty.call(f, "default")) return;
      var dv = f["default"];
      try { dv = JSON.parse(JSON.stringify(dv)); } catch(e){}
      out[k] = dv;
    });
    return out;
  }

        configCache = fillSchemaDefaults(ov.effective || {});

    dcRefresh();

    }).catch(function(e){

  function loadScopes(){
    var p1 = get(API + "/context-sessions").catch(function(){ return {}; });
    var p2 = get(API + "/overview").catch(function(){ return {}; });
    Promise.all([p1, p2]).then(function(res){
      var d = res[0] || {}, ov = res[1] || {};
      aliasCache = d.aliases || {};
      var list = [];
      (d.items || []).forEach(function(x){ if(x && x.sid) list.push(x.sid); });
      (ov.sessions || []).forEach(function(s){ if(s && s.sid && list.indexOf(s.sid) < 0) list.push(s.sid); });
      sessCache = list;
      cachePut("scopes", {list: list, aliases: aliasCache});
      renderScopeOptions(list);
    });
  }

  // 卡片上的名字：有别名就只写别名（群里都这么叫），没有就写「群 1145141974 / 私聊 123」。
  function scopeCardName(sid){
    if(aliasCache[sid]) return aliasCache[sid];
    return sidLabel(sid);
  }
  // v3.68（用户 m20632 第 1 条）：名片那块删掉时把取色函数一起带走了，作用范围卡片还在用它——补回来。
  var CACHE_AV_COLORS = ["#8b5cf6", "#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#06b6d4"];
  function cacheAvatarColor(sid){
    var s = String(sid || ""), h = 0;
    for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) % 9973; }
    return CACHE_AV_COLORS[h % CACHE_AV_COLORS.length];
  }
  // 卡片头像：跟缓存名片同一套取号规则（gm 走群头像、dm 走 QQ 头像），取不到号就只显示首字。
  function scopeAvatarHtml(sid){
    var ch = (scopeCardName(sid) || "?").slice(0, 1) || "?";
    var m = /(?:^|[_:])(gm|dm)[:_]?(\d+)$/.exec(String(sid || ""));
    var img = "";
    if(m){
      var url = (m[1] === "gm")
        ? "https://p.qlogo.cn/gh/" + m[2] + "/" + m[2] + "/100"
        : "https://q1.qlogo.cn/g?b=qq&nk=" + m[2] + "&s=100";
      img = "<img src='" + url + "' referrerpolicy='no-referrer' loading='lazy' alt=''" +
            " onerror='this.remove()'>";
    }
    return "<span class='sc-av' style='background:" + cacheAvatarColor(sid) + "'>" + esc(ch) + img + "</span>";
  }
  // 作用范围卡片条（v3.67 用户 m20117 第 6 条，替掉原来的下拉框）：
  // 最左一张「全局」（默认选中），后面每张一个会话；选中谁就编辑谁的设置。
  function renderScopeOptions(list){
    var box = document.getElementById("set-cards");
    if(Array.isArray(list)) sessCache = list.slice();
    var all = Array.isArray(sessCache) ? sessCache.slice() : [];
    // 当前正在改的会话即使不在列表里（刚建、或者列表还没拉回来），也得有一张卡，不然高亮会跳回全局
    if(scopeSid && all.indexOf(scopeSid) < 0) all.push(scopeSid);
    if(!box) return;
    var html = "<button type='button' class='scard all" + (scopeSid ? "" : " on") +
      "' data-sid='' title='" + esc("全局设置：所有会话的默认值") + "'>" +
      "<span class='sc-globe' aria-hidden='true'>◎</span><span class='sc-nm'>全局</span></button>";
    html += all.map(function(sid){
      return "<button type='button' class='scard" + (sid === scopeSid ? " on" : "") +
        "' data-sid='" + esc(sid) + "' title='" + esc(scopeCardName(sid) + "（" + sid + "）") + "'>" +
        scopeAvatarHtml(sid) + "<span class='sc-nm'>" + esc(scopeCardName(sid)) + "</span></button>";
    }).join("");
    box.innerHTML = html;
  }

  // v3.11（用户 m39492）：改完就存，不再手动点「保存并生效」。
  // 防抖 700ms 把连续调整（连续加外号、拖动数字）合并成一次提交——
  // 每提交一次都会热重载插件，逐项提交会把插件反复重启。
  var saveTimer = null, saving = false, saveAgain = false;
  function scheduleSave(){
    var msg = document.getElementById("set-msg");
    if(msg) msg.textContent = "修改中…";
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveTimer = null; saveSettings(); }, 700);
  }

  // v3.71（用户 m23596 第 4 条）：模式开关这种「改一下就离开」的操作不能走 700ms 防抖——
  // 用户拨完曲线开关马上点回首页，防抖还没到点页面就走了，PUT 根本没发出去，
  // 回来一看开关又弹回原样（就是这个 bug）。所以这类离散动作立刻保存。
  function saveNow(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    saveSettings();
  }

  // v3.71（用户 m23596 第 4 条）：离开页面前把还没提交的那次保存补发出去。
  // keepalive 让请求在页面跳转/关闭之后继续跑完；补发成功就不拦用户离开。
  // 补的是 PUT /config（全局）或 POST /overrides（单群覆盖），reload 交给首页那边的待办标记。
  function flushPendingSave(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    if(!dirty) return true;
    // 补发是 keepalive 的异步请求，下面拿不到结果；失败时把 dirty 恢复回来，
    // 页面若还在（bfcache 回退 / 跳转被拦）还能再存一次，别显示成「已保存」。
    var onFail = function(msg){
      dirty = true;
      try{ var m = document.getElementById("set-msg"); if(m) m.textContent = msg; }catch(x){}
    };
    var onResp = function(r){
      if(r && !r.ok) onFail("补发保存失败 HTTP " + r.status);
    };
    try{
      if(scopeSid){
        var all = collectSettings(), vals = {};
        scopeKeys.forEach(function(k){ if(Object.prototype.hasOwnProperty.call(all, k)) vals[k] = all[k]; });
        fetch(API + "/overrides?sid=" + encodeURIComponent(scopeSid) + "&merge=1&values=" +
              encodeURIComponent(JSON.stringify(vals)),
              {method: "POST", credentials: "same-origin", keepalive: true})
          .then(onResp).catch(function(){ onFail("补发保存失败，网络断了"); });
      } else {
        fetch(CORE + "/config", {
          method: "PUT", credentials: "same-origin", keepalive: true,
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ config: collectSettings() })
        }).then(onResp).catch(function(){ onFail("补发保存失败，网络断了"); });
        // 配置落盘了但插件还没热重载：留个标记，首页打开时补一次 reload。
        try{ localStorage.setItem("mdp_need_reload", "1"); }catch(x){}
      }
      dirty = false;
      return true;
    }catch(e){
      return false;
    }
  }

  // v3.93（用户 m07570 图8）：本页恢复默认。
  // 键的范围 = 这一页 SET_GROUPS 里声明的 keys + 页面上真实渲染出来的 data-k，
  // 两边并集才不会漏掉 custom 块里的（曲线 time_bands、配额、提示词页那一堆）。
  function pageKeyList(){
    var keys = {}, pageId = curPage;
    Array.prototype.forEach.call(
      document.querySelectorAll("#settings [data-page='" + pageId + "'] [data-k]"),
      function(el){
        var k = el.getAttribute("data-k");
        if(k) keys[k] = 1;
      });
    SET_GROUPS.forEach(function(g){
      if((g.p || "basic") !== pageId) return;
      (g.keys || []).forEach(function(k){ keys[k] = 1; });
    });
    return Object.keys(keys);
  }
  function pageTitle(pageId){
    var t = pageId;
    PAGES.forEach(function(p){ if(p.id === pageId) t = p.t; });
    return t;
  }
  function resetPageDefaults(){
    if(!schemaCache || !configCache) return 0;
    var list = pageKeyList(), done = 0, miss = 0;
    list.forEach(function(k){
      var f = schemaCache[k];
      if(!f || f.default === undefined || f.default === null){ miss += 1; return; }
      // LOCKED（window_enabled）这类恒开项不跟着默认值走，免得点一下把它关掉
      if(LOCKED[k]) return;
      try{ configCache[k] = JSON.parse(JSON.stringify(f.default)); }
      catch(e){ configCache[k] = f.default; }

    var qs = API + "/overrides?sid=" + encodeURIComponent(sid) + (merge ? "&merge=1" : "") +

    var kv = {}; kv[k] = num;

      var ai = (chipA && chipA.getAttribute) ? chipA.getAttribute("data-ai") : null;
      if(ai == null) return;
      var idxA = parseInt(ai, 10);
      var lstA = adminList();
      if(isFinite(idxA) && idxA >= 0 && idxA < lstA.length){ lstA.splice(idxA, 1); adminSync(lstA); }
      return;
    }
  });
  document.getElementById("hidden-list").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-show]") : null;
    if(!b) return;
    post(API + "/session-show?sid=" + encodeURIComponent(b.getAttribute("data-show")))
      .then(function(){ loadHidden(); })
      .catch(function(err){ mdAlert("恢复失败：" + err.message); });
  });

  document.getElementById("btn-reset").onclick = resetOverrides;
  // v3.93（用户 m07570 图8）：恢复默认只作用当前页，先问一声再动。
  document.getElementById("btn-pagedefault").onclick = async function(){
    var nm = pageTitle(curPage);
    var ok = await mdConfirm("把「" + nm + "」这一页的设置项全部恢复默认值？（只重置这一页，别的页不动）",
                             {danger: true, ok: "恢复"});
    if(!ok) return;
    var n = resetPageDefaults();
    var msg = document.getElementById("set-msg");
    if(msg) msg.textContent = n ? ("已把「" + nm + "」" + n + " 项恢复默认") : "这一页没有可恢复的默认值";
  };
  // v3.67（用户 m20117 第 6 条）：点顶部卡片 = 换作用范围（原来那个下拉框的 onchange 就是这段）。
  document.getElementById("set-cards").addEventListener("click", async function(e){
    var b = (e.target && e.target.closest) ? e.target.closest(".scard") : null;
    if(!b) return;
    var sid = b.getAttribute("data-sid") || "";
    if(sid === (scopeSid || "")) return;
    // 改了没保存就切走 = 静默丢改动，得先问一声（审查 bug）
    if(dirty && !(await mdConfirm("有改动还没存完，切走就丢了。继续吗？"))) return;
    scopeSid = sid;
    cacheScopeSid = sid;       // 缓存记录页跟着看同一个作用范围
    dirty = false;
    document.getElementById("set-msg").textContent = "";
    renderScopeOptions();      // 先把高亮挪过去，别等接口回来才动
    loadSettings();
  });
  // v3.71（用户 m23596 第 4 条）：原来这里一律弹「确定离开？」——用户点确认后，
  // 防抖里那次保存就跟着页面一起没了，回来看到开关弹回去。现在先补发（keepalive），
  // 补发成功就放行；真发不出去才拦。
  window.addEventListener("pagehide", function(){ flushPendingSave(); });
  window.addEventListener("beforeunload", function(e){
    var ordinarySaved = flushPendingSave();
    if(!ppHasDrafts() && ordinarySaved) return;
    e.preventDefault();
    e.returnValue = "";
  });
  // v3.69（用户 m21003 第 1 条）：和首页对称，撤掉「打开中…」＋变淡＋40ms 延迟，直接跳。
  document.getElementById("btn-home").onclick = async function(){
    if(ppHasDrafts() && !(await mdConfirm("还有未保存的提示词草稿。离开将丢失草稿，确定继续？",{danger:true,ok:"离开并放弃草稿"}))) return;
    flushPendingSave();   // v3.71：先把还没提交的改动补发出去，再跳
    try{ localStorage.setItem("mdp_page", "home"); }catch(x){}
    location.href = "/page/plugin/" + encodeURIComponent(PLUGIN_ID) + "/decision-log/";
  };

  window.addEventListener("message", function(e){
    var d = e.data;
    if(!d || d.channel !== CHANNEL) return;
    // 只认外层窗口发来的消息（审查报告）：原来只比对 channel 字串，同源页面里
    // 任何窗口都能改主题。e.source 判父窗口在反代/sandbox 下也稳。
    if(e.source && e.source !== parent) return;
    if(d.kind === "context" && d.context){
      var th = d.context.isDark ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", th);
      try{ localStorage.setItem("mdp_theme", th); }catch(x){}
    }
  });
  try { parent.postMessage({channel: CHANNEL, kind: "ready"}, "*"); } catch(err) {}

  try {
    var qs = new URLSearchParams(location.search);
    scopeSid = qs.get("sid") || "";
  } catch(err) { scopeSid = ""; }
  paintFromCache();
  loadScopes();
  loadSettings();
  loadHidden();
  // v3.91（用户 m05749）：提示词页的人格 / 工具 / 模型清单与两个按钮
  bindDecisionPage();
  loadDecisionOptions();
})();
</script>
</body>
</html>
