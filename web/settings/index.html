<script defer src="js/lib-3.js"></script>
<script defer src="js/lib-4.js"></script>

<script>
/* 首帧引导（v3.08）
   ① 主题：先从父页面或上次缓存取主题，深色模式下不白闪；
   ② 外壳标题占位：KiraAI 外壳是单页应用，菜单接口返回前标题先显示「插件页面」，这里立刻纠正；
   ③ booting 期间关掉所有过渡，首帧元素不再从初始态滑到目标态。 */
(function(){
  var d = document, e = d.documentElement;
  e.className += " booting";
  // 记下「当前停在设置页」，刷新外壳时首页脚本据此跳回来（v3.12，用户 m39759 ①）
  try{ localStorage.setItem("mdp_page", "settings"); }catch(x){}
  function pickTheme(){
    try{
      var p = window.parent;
      if(p && p !== window && p.document && p.document.documentElement){
        var t = p.document.documentElement.getAttribute("data-theme");
        if(t === "dark" || t === "light") return t;
      }
    }catch(x){}
    try{ var c = localStorage.getItem("mdp_theme"); if(c === "dark" || c === "light") return c; }catch(x){}
    return "";
  }
  var th = pickTheme();
  if(th) e.setAttribute("data-theme", th);
  function release(){ e.classList.remove("booting"); }
  window.__releaseBoot = release;
  setTimeout(release, 1500);
  try{
    var p = window.parent;
    if(p && p !== window && p.document){
      var fix = function(){
        try{
          var h = p.document.querySelector("header.app-header h2");
          if(h && h.textContent.trim() === "插件页面") h.textContent = "设置";
        }catch(x){}
      };
      fix();
      var t0 = Date.now();
      (function loop(){ fix(); if(Date.now() - t0 < 2000) requestAnimationFrame(loop); })();
    }
  }catch(x){}
})();
</script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e3e9f3;--text:#1f2937;--muted:#6b7280;--accent:#3b82f6;--reload:#7c3aed;--reload-soft:rgba(124,58,237,.10);--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--soft:rgba(127,127,127,.08);}
html[data-theme="dark"]{--bg:#0f172a;--card:#16213a;--line:#26344f;--text:#e5edff;--muted:#93a4c4;--accent:#60a5fa;--reload:#a78bfa;--reload-soft:rgba(167,139,250,.16);--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:rgba(255,255,255,.06);}
/* 2026-11-18（J，用户 m12620）：强调色的淡底，给提示词页的「恢复默认」按钮用（原来只有 --reload-soft 这一种淡底）。 */
:root{--accent-soft:rgba(59,130,246,.10);--accent-soft2:rgba(59,130,246,.20);}
html[data-theme="dark"]{--accent-soft:rgba(96,165,250,.16);--accent-soft2:rgba(96,165,250,.28);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
/* v3.67（用户 m20117 第 6 条）：整页收一点边距，一屏能多看两行。 */
/* 用户 m19542 第 3 条：跟首页对齐——首页 .wrap 是 18px 22px 40px，
   原来这里 14/20 会让「首页 / 设置」两个胶囊切换时左移 2px、上移 4px。 */
/* 用户 m12008：上面那条只改了注释、值还是 14/14/32，切页时整页左移 8px、上移 4px，
   看着像抖一下。现在真的跟首页一致。 */
.wrap{padding:18px 22px 40px;max-width:none;margin:0;}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
/* header 里的控件统一 26px 高，整条 header 正好 32px —— 和首页一样高，切页不跳（用户 m33994 图5） */
header > button,header > select{height:26px;padding:0 12px;line-height:1;border-radius:8px;font-size:13px;}
header > select{padding:0 6px;}
h1{font-size:20px;margin:0;font-weight:600;}
/* 顶部导航和首页同一套：切换页面时 header 高度不变（用户 m33994 图5） */
.navseg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:11px;background:var(--soft);border:1px solid var(--line);height:32px;}
.navbtn{height:26px;padding:0 15px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;line-height:1;transition:background .15s,color .15s;}
.navbtn:hover{border:0;color:var(--text);}
/* 用户 m19542 第 4 条：选中的按钮统一换成实心蓝底白字，跟首页「美化 / 对照 / 原文」一致 */
.navbtn.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.10);}
/* 用户 m19731：设置页也能直接重载——「重载」并进导航胶囊当第三段，紫色 + 刷新图标，
   中间一条竖线说明它是动作不是页面。 */
.navseg .navsep{width:1px;height:16px;background:var(--line);margin:0 3px;flex:none;}
.navbtn.nav-reload{display:inline-flex;align-items:center;gap:5px;padding:0 12px;color:var(--reload);background:var(--reload-soft);font-weight:600;}
.navbtn.nav-reload svg{width:13px;height:13px;display:block;flex:none;}
.navbtn.nav-reload:hover{color:#fff;background:var(--reload);}
.navbtn.nav-reload:disabled{opacity:.55;cursor:default;color:var(--reload);background:var(--reload-soft);}
.grow{flex:1;}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;}
button:hover{border-color:var(--accent);color:var(--accent);}
button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
button.mini{padding:2px 8px;font-size:12px;border-radius:6px;}
.panel{border-radius:12px;overflow:hidden;}
.hint{color:var(--muted);font-size:12px;}
/* 用户 m07864 第 1 条：头部这句说明一换长度，上半部分就像被推了一下。
   定宽 + 等宽数字，且默认先写上次的文案（sessionStorage），首帧不再「加载中…」跳长句。 */
/* v3.68（用户 m20632 第 7 条）：去掉最小宽度和右对齐——这行紧跟页签胶囊，别再被推到右边 */
#set-sub{display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.saved{color:var(--ok);font-size:12px;}
.empty{padding:36px;text-align:center;color:var(--muted);}
/* 用户 m29293：所有输入框统一用页面底色（--bg），不再混用 --card / --soft / --bg 三种。 */
select,input[type=text],input[type=number],input[type=time]{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);}
/* 用户 m00153：时间框在深色主题下别再是白底白字，连带原生钟表图标一起跟随主题。 */
html[data-theme="dark"] input[type=time]{color-scheme:dark;}
input[type=number]{width:var(--ipt-w);} /* v3.49：兜底宽度也走同一套变量，见下面 .ipt 那段 */
/* v3.43（用户本轮第 3 条）：设置页的数字框收成一套尺寸 —— 宽 / 高 / 字号只在这里各写一次，
   不再有三列 108px、参数行 78px、价目 96px 三套数（图 8 里同一列的数字框宽窄不一）。
   百分号也挪进框里：.ipt 是个定位容器，框内右侧留出 21px，% 绝对定位在留白里，
   不再是框外另挂一个 <b>%</b>（那种写法 % 会跟着 gap 飘开，看着像漏出来的字）。 */
:root{--ipt-w:96px;--ipt-h:32px;--ipt-fs:13.5px;--ipt-pad:4px 10px;}
/* v3.49（用户 m06348 第 7 条）：选择器从「.ctl > .ipt」放宽成「.ctl .ipt」——成对行
   （抖动 / 静默兜底 / 休息时段兜底）的数字框套在 <span class='nspan'> 里，隔了一层就匹配
   不到这套规则，掉到全局 input[type=number]{width:120px} 上变成 120×34，跟别处 96×32 差一截。
   改成后代选择器后，页面上所有数字框不管嵌几层都是同一套 --ipt-w / --ipt-h。 */
.setrow .ctl .ipt{position:relative;display:inline-flex;align-items:center;flex:0 0 auto;
  width:var(--ipt-w);min-width:0;}
.setrow .ctl .ipt > input[type=number]{width:100%;min-width:0;height:var(--ipt-h);
  padding:var(--ipt-pad);font-size:var(--ipt-fs);text-align:right;}
/* 用户 m03495：数字框宽度改成自适应——内容只有一两位时收窄，别把左边的名字挤成省略号；
   最窄不小于内容（field-sizing: content 让框按内容撑开），最宽仍是 --ipt-w。
   不支持的浏览器走上面那套定宽，行为跟以前一样。 */
@supports (field-sizing: content){
  .setrow .ctl .ipt{width:auto;max-width:var(--ipt-w);}
  .setrow .ctl .ipt > input[type=number]{width:auto;max-width:100%;min-width:56px;field-sizing:content;}
}
.setrow .ctl .ipt.has-pct > input[type=number]{padding-right:21px;}
.setrow .ctl .ipt > .pct{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1;}
/* v3.50（用户 m06761 第 4 条）：单位（秒 / 分钟 / 次）也搬进框里——原来它挂在框外，
   窄列里会被挤到下一行、框和字之间还跟着 gap 飘。跟 % 同一套做法：框内右侧留白，
   单位绝对定位在留白里。两个字（分钟）要留宽一点，用 .uw2 单独给。 */
.setrow .ctl .ipt.has-unit > input[type=number]{padding-right:24px;}
.setrow .ctl .ipt.has-unit.uw2 > input[type=number]{padding-right:36px;}
.setrow .ctl .ipt > .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--muted);font-size:12px;font-weight:600;line-height:1;}
/* 数字框自带的上下箭头会盖住框里的 %；设置项都是键进去的，箭头收掉 */
.setrow .ctl .ipt > input[type=number]::-webkit-inner-spin-button,
.setrow .ctl .ipt > input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px;padding-bottom:4px;}
.tabs button{padding:5px 15px;border-radius:8px;font-size:13px;}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
/* 用户 m10201：页签按钮拿到焦点时，浏览器会画一圈黑色焦点环（黑边）——刷新恢复焦点、
   键盘 Tab 过来都会出现，鼠标点不会。页签本身有蓝色选中态，这里干脆不画焦点环。 */
.tabs button:focus,.tabs button:focus-visible{outline:none;}
/* 用户 m01874：模型没配的红点。页签上一个小圆点，具体那一行标签变红并带点。 */
.mdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);vertical-align:middle;flex:0 0 auto;}
.tabs button .mdot{margin-left:6px;}
.pp-tab .mdot{margin-left:2px;}
.drow.mdneed > .dlb{color:var(--bad);}
.drow.mdneed > .dlb::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);}
.drow.mdneed > .dipt{border-color:var(--bad);}
/* v3.26（用户 m46693 ①）：切页签的两处顿挫
   ① 各页高度差很大（831~1324px），切到短页时滚动条突然消失、整页横向挪 15px；
      给 html 预留滚动条槽位，位置就不再跳。
   ② 页签吸顶，滚到页面下半部也能直接换页；换页内容淡入 120ms，不再「啪」一下换掉。 */
html{scrollbar-gutter:stable;}
.tabs{position:sticky;top:0;z-index:30;background:var(--bg);margin:0 -22px 2px;padding:8px 22px 4px;}
/* 用户 m12008：窄屏跟首页同一档——首页 ≤1000px 时 .wrap 是 10px 10px 26px，
   页签栏的负边距要跟着走，否则会往左溢出。 */
@media (max-width:1000px){.tabs{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px;}}
@keyframes mdPageIn{from{opacity:.35;}to{opacity:1;}}
.setgrp.pgin{animation:mdPageIn .12s ease-out both;}
html.booting .setgrp.pgin{animation:none;}
/* 页内模态（v3.26，用户 m46693 ②）：外壳 iframe 的 sandbox 没有 allow-modals，
   原生 confirm/alert 被浏览器忽略（confirm 恒 false），确认类操作永远不生效。 */
.mask{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.46);display:flex;align-items:center;justify-content:center;padding:20px;}
.dlg{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.32);}
.dlg h3{margin:0 0 8px;font-size:14px;}
.dlg p{margin:0;font-size:13px;line-height:1.8;color:var(--text);}
.dlg .dlg-input{width:100%;box-sizing:border-box;height:34px;margin-top:10px;padding:0 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;outline:none;}
.dlg .dlg-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.dlg-btns button{padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:13px;}
.dlg-btns button.pri,.dlg-btns button:hover{border-color:var(--accent);color:var(--accent);}
.dlg-btns button.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
.dlg textarea{width:100%;box-sizing:border-box;min-height:158px;margin-top:10px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;line-height:1.75;
  font-family:inherit;resize:vertical;outline:none;}
.dlg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}
.phbtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--soft);
  color:var(--text);font-size:12.5px;cursor:pointer;white-space:nowrap;}
.phbtn:hover{border-color:var(--accent);color:var(--accent);}
/* 设置项：两列紧凑排布（v3.08）。一页 20 项时一列要滚很久，
   改成一屏左右两列，名称与控件同一行、说明压到下一行最多两行。 */
.setgrp{margin-bottom:16px;}
.setgrp h3{font-size:13.5px;margin:0 0 8px;padding:8px 14px;background:var(--soft);border-radius:9px;color:var(--muted);font-weight:600;}
.setgrp .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;}
/* v3.13（用户 m39983）：单列组——主要开关、身份、缓存记录这类整幅宽的块。4 个开关排在
   同一列右侧、从上往下，不再左右两列各两个（眼睛要来回扫，看着也不齐）。 */
.setgrp[data-solo="1"] .rows{grid-template-columns:1fr;}
/* v3.13：锁定项（后端强制开启、页面不许改的键）——控件禁用，名称后跟「已锁定」 */
.setrow.locked{background:var(--soft);}
.setrow.locked .nm{color:var(--muted);}
.setrow.locked .lk{margin-left:8px;padding:1px 7px;border-radius:6px;background:var(--line);color:var(--muted);font-size:11.5px;font-weight:500;}
.setrow.locked .ctl{opacity:.65;}
@media (max-width:1150px){.setgrp .rows{grid-template-columns:1fr;}}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);}
.setrow.wide{grid-template-columns:1fr;row-gap:7px;grid-column:1/-1;}
.setrow:last-child{border-bottom:none;}
/* v3.92（用户 m00697 第 20 条）：所有页面的设置行鼠标移上去都浮一层浅底——
   原来只有基础设置页有这条，别的页移上去毫无反馈，看不出鼠标停在哪一行。 */
.setrow:hover{background:var(--soft);}
html[data-theme="dark"] .setrow:hover{background:rgba(255,255,255,.055);}
/* 用户 m02105：分区最后一行也画着一条灰线，紧挨着下面那个分区标题，看着像多出一道分割。
   .rows 末尾有时还挂着隐藏 input，:last-child 抓不到，所以再按 .setrow 自己补一条。 */
.setgrp .sub .rows > .setrow:last-of-type,
.setgrp .sub .rows > .setrow:nth-last-child(1 of .setrow){border-bottom:none;}
/* v3.11：紧凑分组（身份区）——行距收一半，说明只留一行，全文在 title 里
   v3.12：紧凑组的右内边距必须和普通组一样（12→14），否则同一列里
   紧凑组的开关比普通组偏右 2px，四条开关列不成一条线（用户 m39759 ③）
   v3.41（用户本轮第 7 条）：说明一律排在名称右侧，原来「说明压到第二行」的 .hh 随渲染分支一起删掉。 */
.setgrp[data-compact="1"] .setrow{padding:7px 14px;}
.setrow .nm{font-size:14px;line-height:1.36;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.setrow .kh{display:none;}
.setrow .ctl{justify-self:end;display:flex;align-items:center;gap:8px;min-width:0;}
.setrow.wide .ctl{justify-self:stretch;}
/* 用户 2026-11-06：转发消息处理是左右格式的分段按钮，说明跟着选中项走。 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
/* 用户 m15110：分段按钮只有最左最右的外侧是圆角（靠容器 9px + overflow:hidden 裁出来），
   内部一律直角——以前每个按钮各自吃全局 button 的 8px 圆角，看着像一排药丸。 */
.segbtn{border:0;border-radius:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:6px 10px;cursor:pointer;white-space:nowrap;line-height:1.2;}
.segbtn+.segbtn{border-left:1px solid var(--line);}
.segbtn:hover{color:var(--text);}
.segbtn.on{background:var(--accent);color:#fff;font-weight:600;}
/* v3.10：设置项控件整体放大一号，两列排布下不再显得空 */
.setrow select,.setrow input[type=text]{font-size:14px;padding:7px 11px;min-width:120px;}
.setrow select{min-width:150px;}
/* v3.12：控件列固定 200px，所有行的控件右边缘对齐成一条竖线（用户 m39759 ③）。
   以前第二列是 auto：开关行只有 82px、输入框行 200px，右边看着参差不齐。 */
.setrow{grid-template-columns:minmax(0,1fr) 200px;}
.setrow .ctl{width:100%;justify-content:flex-end;}
.setrow .ctl > input[type=text],.setrow .ctl > select{width:100%;min-width:0;}
/* v3.12：填昵称、外号的两处控件单独美化（用户 m39759 ⑤）：页面底色 + 圆角，
   悬停浮起来一点，聚焦时描边发光，跟首页卡片的质感统一。 */
.setrow .ctl > input[type=text]{border-radius:10px;background:var(--bg);border-color:transparent;padding:8px 12px;transition:background .15s,border-color .15s,box-shadow .15s;}
.setrow .ctl > input[type=text]:hover{background:var(--card);border-color:var(--line);}
.setrow .ctl > input[type=text]:focus{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}

/* v3.10：滑动开关。原来用原生 checkbox + 「开/关」文字，和首页的大开关风格不一致。
   这里保留真实 input 供 collectSettings 读取，视觉换成轨道+圆点，勾选态交给 :checked。 */
/* v3.92（用户 m00697 第 10 条）：开关改成首页那种「字写在轨道里」的胶囊——
   轨道里直接写状态（开启 / 关闭、接管 / 关闭），白色滑块滑到对应一侧。
   真实 input 仍留在标签里（透明铺满整块），collectSettings 照旧读 checked。 */
.sw2{position:relative;display:inline-flex;align-items:center;flex:none;cursor:pointer;user-select:none;}
.sw2 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
.sw2 .tr{position:relative;display:block;width:58px;height:24px;border-radius:999px;background:var(--line);transition:background .18s;flex:none;}
.sw2 .tr:after{content:attr(data-off);position:absolute;top:2px;left:2px;width:34px;height:20px;border-radius:999px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;color:#1f2937;letter-spacing:.02em;transition:transform .18s;}
.sw2 input:checked ~ .tr{background:var(--accent);}
.sw2 input:checked ~ .tr:after{content:attr(data-on);transform:translateX(20px);}
.sw2 input:focus-visible ~ .tr{outline:2px solid var(--accent);outline-offset:2px;}
html.booting .sw2 .tr,html.booting .sw2 .tr:after{transition:none;}
/* v3.92（用户 m00697 第 15 条）：唤醒那几行是「关闭 / 触发 / 必回」三档，
   做成一条轨道里三段、白色滑块跟着走的分段开关（跟首页折叠 / 展开同一套语言）。 */
.sw3{position:relative;display:inline-flex;align-items:center;flex:none;cursor:pointer;user-select:none;
  height:24px;padding:2px;border-radius:999px;background:var(--line);}
.sw3 input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
.sw3 .thumb{position:absolute;top:2px;left:2px;width:34px;height:20px;border-radius:999px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s;}
.sw3 b{position:relative;z-index:1;width:34px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;transition:color .18s;}
.sw3[data-v="trigger"] .thumb{transform:translateX(34px);}
.sw3[data-v="always"] .thumb{transform:translateX(68px);}
.sw3[data-v="off"] b[data-v="off"]{color:#1f2937;}
/* 用户 m01445：触发 / 必回 选中时用蓝底白字（跟「接管」胶囊同一套），关闭仍是白底深字。 */
.sw3[data-v="trigger"] .thumb,.sw3[data-v="always"] .thumb{background:var(--accent);}
.sw3[data-v="trigger"] b[data-v="trigger"],.sw3[data-v="always"] b[data-v="always"]{color:#fff;}
/* 用户 m01445：没开决策模式（advanced_enabled）时「必回」不生效——灰掉且点不动。 */
.sw3.no-must b[data-v="always"]{color:var(--muted);opacity:.45;}
.sw3.no-must[data-v="always"] .thumb{background:#c7ccd4;}
.sw3.no-must[data-v="always"] b[data-v="always"]{color:#fff;opacity:.85;}
html.booting *,html.booting *::before,html.booting *::after{transition:none!important;}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
/* 列表类设置（外号/唤醒词）撑满整行，否则输入框缩在左边、右边一大片空 */
.setrow.wide .chips{width:100%;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:8px;border:1px solid var(--line);background:var(--soft);font-size:13.5px;}
.chip b{cursor:pointer;color:var(--muted);font-weight:400;}
.chip b:hover{color:var(--bad);}
#check-bar{margin-bottom:12px;}
/* v3.73（用户 m24918 澄清第 1 条）：只留一行，文字靠左；要的是行内垂直居中，不是水平居中。 */
#check-bar .chk{position:relative;display:flex;align-items:center;justify-content:flex-start;padding:8px 12px;border-radius:8px;
  font-size:12.5px;line-height:1.65;margin-bottom:8px;border:1px solid;}
#check-bar .chk .lvl{position:absolute;left:10px;top:50%;transform:translateY(-50%);flex:none;font-weight:600;font-size:11px;padding:1px 6px;border-radius:5px;
  background:currentColor;}
#check-bar .chk .lvl i{color:#fff;font-style:normal;}
#check-bar .chk.error{background:rgba(239,68,68,.09);border-color:rgba(239,68,68,.35);color:var(--bad);}
#check-bar .chk.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.38);color:var(--warn);}
#check-bar .chk .txt{flex:1 1 auto;text-align:left;padding:0 12px 0 54px;color:var(--text);}
.chip-in{min-width:160px;flex:1;border:1px dashed var(--line);border-radius:8px;background:transparent;padding:4px 11px;font-size:13.5px;}
.chip-in:focus{outline:none;border-color:var(--accent);border-style:solid;}
/* v3.12：外号 / 唤醒词这组 chips 与输入框一起美化（用户 m39759 ⑤）：
   胶囊改实底带阴影，输入框从虚线框换成软底圆角，聚焦时描边发光。 */
.chips{gap:8px;padding:2px 0;}
.chip{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s;}
.chip:hover{border-color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.10);}
.chip b{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s,color .15s;}
.chip b:hover{background:rgba(239,68,68,.14);}
.chip-in{border:1px solid transparent;border-radius:10px;background:var(--soft);padding:6px 12px;transition:background .15s,border-color .15s,box-shadow .15s;}
.chip-in:hover{background:var(--card);border-color:var(--line);}
.chip-in:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16);}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);white-space:nowrap;}
.tbl{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;}
/* 用户 m12008：原来这里 ≤860px 才收到 12px，首页是 ≤1000px 收到 10px，
   861~1000px 这一段两边差 12px。现在跟首页同一断点、同一数值。 */
@media (max-width:1000px){.wrap{padding:10px 10px 26px;}}
/* v3.14：单群模式下「不在白名单里的全局项」用 .ro 置灰，与 v3.13 的锁定项 .locked
   （控件禁用 + 「已锁定」标签）分开。以前两者共用 .locked，这两条写在后面把 v3.13 的样式
   整个盖掉，实验页那行显示成 42% 透明 + 错写成「（全局项）」。 */
.setrow.ro{opacity:.42;pointer-events:none;}
.setrow.ro .nm::after{content:'（全局项）';font-size:11px;color:var(--muted);margin-left:6px;}
/* 独立配置页（用户 m02580）：本群真正写过的项用淡橙底标出来，一眼看出哪些没跟随全局。
   locked 行是灰底不可改的全局项，别再叠色。 */
.setrow.own:not(.locked){background:rgba(245,158,11,.10);box-shadow:inset 2px 0 0 rgba(245,158,11,.5);}
/* v3.67（用户 m20117 第 6 条）：作用范围改成顶部常驻卡片条——最左「全局」，后面每个群 / 私聊
   一张长方形卡（头像 + 名字），从左往右排，放不下就横向滚（滚动条藏起来）。
   点谁就只改谁的设置，原来那个下拉框和缓存页里那个下拉框都撤掉了。 */
.scards{display:flex;align-items:center;gap:6px;min-width:0;margin:0 0 10px;
  overflow-x:auto;overflow-y:hidden;padding:2px 0;scrollbar-width:none;-ms-overflow-style:none;}
.scards::-webkit-scrollbar{display:none;width:0;height:0;}
.scard{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 5px;
  border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-size:12.5px;font-family:inherit;cursor:pointer;line-height:1;
  transition:border-color .15s,background .15s,color .15s;}
.scard:hover{border-color:var(--accent);color:var(--text);}
/* v3.69（用户 m21003 第 3 条）：选中时不要再改 font-weight——一变成 600 字就变宽，
   整排卡片跟着挤一下，看着像抖。改成只换底色和描边，宽度永远不动。 */
.scard.on{border-color:var(--accent);background:rgba(59,130,246,.10);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent);}
html[data-theme="dark"] .scard.on{background:rgba(96,165,250,.16);}
.scard .sc-av{position:relative;flex:0 0 auto;width:20px;height:20px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:600;line-height:1;}
.scard .sc-av img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;}
.scard .sc-globe{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--soft);color:var(--muted);font-size:12px;line-height:1;}
/* 名字按最长宽固定住：不同长度名字也能对齐，且切换选中时不变宽。 */
.scard .sc-nm{max-width:104px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 2026-11-20（J）：群组一多，卡片条后面的就看不见了。
   ① 滚轮上下 = 左右滚（向后滚往右、向前滚往左），滚动条本身仍然藏起来；
   ② 「全局」右边一个折叠按钮，折叠后群组只留头像，全局那张保留文字。 */
.sc-fold{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:22px;height:30px;padding:0;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-family:inherit;line-height:1;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s;}
.sc-fold:hover{border-color:var(--accent);color:var(--text);}
.sc-fold.on{border-color:var(--accent);background:rgba(59,130,246,.10);color:var(--text);}
html[data-theme="dark"] .sc-fold.on{background:rgba(96,165,250,.16);}
.sc-fold svg{width:13px;height:13px;display:block;}
.scards.fold .scard{height:34px;}
/* 用户 m10685：折叠后只剩头像，30px 的圈太小认不出是谁——整排抬到 34px，头像 30px。 */
.scards.fold .scard:not(.all){padding:0;gap:0;width:34px;justify-content:center;border-radius:50%;
  border-color:transparent;background:transparent;box-shadow:none;}
.scards.fold .scard:not(.all) .sc-av{width:30px;height:30px;font-size:13px;}
.scards.fold .sc-fold{height:34px;}
.scards.fold .scard:not(.all):hover{border-color:transparent;background:transparent;}
.scards.fold .scard:not(.all):hover .sc-av{opacity:.82;}
.scards.fold .scard:not(.all).on .sc-av{box-shadow:0 0 0 2px var(--accent);}
.scards.fold .scard:not(.all) .sc-nm{display:none;}

/* v3.14（用户 m40145）：基础页左右两半——左半只填昵称、外号（外号用「+」添加），
   右半放 4 个开关。说明文字从「名称下方」挪到「名称右侧」，一项一行。 */
.setgrp[data-split="2"] .split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;align-items:start;}
.setgrp[data-split="3"] .split2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:20px;align-items:start;}
@media (max-width:1150px){.setgrp[data-split] .split2{grid-template-columns:1fr;row-gap:14px;}}
.setgrp[data-split] .col .rows{grid-template-columns:1fr;}
/* v3.15：三列时每列约 430px，行内控件收窄，说明用省略号兜住 */
/* v3.42（用户 m03616 第 3 条）：第三列不再写死 96px —— 改成按内容宽，行高统一 38px、
   控件统一 32px 高。开关行和数字框行的右边缘仍然对齐成一条竖线，也不会有的行下面空一截。 */
.setgrp[data-split="3"] .setrow.inline{grid-template-columns:auto minmax(0,1fr) auto;column-gap:3px;padding:2px 12px;min-height:38px;align-items:center;}
.setgrp[data-split="3"] .setrow.inline .ctl > input[type=text],
.setgrp[data-split="3"] .setrow.inline .ctl > select{width:108px;min-width:0;height:var(--ipt-h);padding:4px 10px;font-size:var(--ipt-fs);}
/* v3.17（用户 m40932）：一列里可以放两组（基础页左列 = 身份 + 重试）。
   组与组之间拉开距离，看起来仍是同一栏的两个小节。
   用户 m17928：中间那条细线去掉——只留间距，不再画分隔线。 */
.setgrp[data-split] .col .sub + .sub{margin-top:10px;padding-top:8px;}
.setgrp[data-split] .col .sub[data-compact="1"] .setrow{padding:7px 14px;}
/* v3.43：数字框不再按分栏改宽度（原来两列 200px、三列 108px、参数行 78px 三套数），
   统一尺寸见文件上面 :root 里的 --ipt-w / .ipt 那一段。 */

/* v3.18（用户 m41210 + m41338）：基础页左栏收紧，同时把两栏做成卡片。
   收紧：组标题 38→27px、行内边距 9→5px、输入框 40→32px、外号行 54→38px、同栏两组分隔 18/16→10/10。
   美化：两列各自是一张圆角卡片（与触发页三列卡片同一套语言），小节标题前一条主题色竖条、
   标题右侧接一条渐隐细线，行悬停浮出浅底，组间用虚线分开，输入框悬停变白描边。 */
.setgrp[data-page="basic"][data-split="2"] .split2{gap:22px;align-items:stretch;}
.setgrp[data-page="basic"][data-split="2"] .col{display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:11px 14px 12px;box-shadow:0 1px 2px rgba(16, 24, 40, .04);}
.setgrp[data-page="basic"][data-split="2"] .col h3{display:flex;align-items:center;gap:8px;font-size:12.5px;
  font-weight:600;padding:0 0 8px;margin:0 0 4px;border-radius:0;background:transparent;
  border-bottom:1px solid var(--line);color:var(--text);letter-spacing:.2px;}
.setgrp[data-page="basic"][data-split="2"] .col h3::before{content:"";flex:0 0 auto;width:3px;height:12px;
  border-radius:2px;background:var(--accent);opacity:.6;}
.setgrp[data-page="basic"][data-split="2"] .col h3::after{content:"";flex:1 1 auto;height:1px;
  background:linear-gradient(90deg,var(--line),transparent);}
.setgrp[data-page="basic"][data-split="2"] .setrow{padding:4px 8px;border-radius:8px;
  border-bottom-color:rgba(16, 24, 40, .07);}
.setgrp[data-page="basic"][data-split="2"] .setrow:hover{background:var(--soft);}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline{padding:2px 8px;column-gap:3px;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl > input[type=text]{height:32px;padding:4px 11px;}
/* v3.45（用户 m05552 第 4 条）：基础页控件统一——右列固定 200px，
   文本框与下拉框占满这一列、数字框统一 96px，三者同为 32px 高、右边缘对齐；
   数字框不做满宽（满宽后一位数的值会孤零零贴在框的最右边，看着像没填）。 */
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl{width:100%;}
/* v3.49（用户 m06348 第 7 条）：这里原来还把数字框压成 96×30（比别的页矮 2px，框里上下露白），
   现在基础页跟其它页共用同一套 .ipt（96×32），不再单独写宽高。 */
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl > input[type=text],
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl > select{width:100%;height:32px;box-sizing:border-box;}
/* 行高统一到 34px，左右两列的每一行在同一条水平线上（右列开关行也照样居中） */
/* 用户 m18041：行高统一到 36px（原来 34 只是下限，32px 输入框 + 4px 内边距实际撑到 41）。 */
.setgrp[data-page="basic"][data-split="2"] .setrow.inline{min-height:38px;align-items:center;}
/* v3.61（用户 m17581 第 11 条）：基础页控件列统一贴右。
   之前 .ctl 一会被 :294 拉满、一会又被 .setrow.inline .ctl{width:auto} 拉回 auto，
   同一列里昵称框 183、外号胶囊 103、数字框 96 三种宽度，右列「唤醒」那三行的开关
   又因为行里只有两个格子、控件落到第 2 格，右边缘比别的行短 12px。
   现在：控件列按内容宽度贴右，文本框/下拉固定 200，胶囊与开关按自身宽度右对齐，
   数字框仍 96（贴右）；成对行（唤醒 / 配额）的 .ctl.pair 显式放到第 3 格。
   用户 m04763：原来控件列写死 200px，开关只占 58px、数字框只占 56px，
   多出来的 140px 全从描述列里扣，描述明明还有地方却被挤成两行；
   改成按内容宽度后描述列多出 100–140px，基础页所有描述都回到单行。 */
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl{width:auto;min-width:0;justify-self:end;justify-content:flex-end;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl > input[type=text],
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl > select{width:200px;height:32px;box-sizing:border-box;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl.list{max-width:200px;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl.list .chips{justify-content:flex-end;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl.pair{grid-column:3;grid-row:1;}
/* v3.73（用户 m24640 第 2 条）：基础页控件列再往右顶到行边。原来 .ctl 右边还压着行内 8px 内边距，
   昵称框右边缘离卡片内边缘差一截、看着没贴右；这里整列一起挪（不是只挪一行），同列仍然完全对齐。
   昵称行再显式写一条，避免以后行 class 变动时掉回 auto 宽度。 */
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .ctl{margin-right:-8px;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline[data-row="bot_name"] .ctl{width:auto;min-width:0;}
.setgrp[data-page="basic"][data-split="2"] .setrow.inline .nm{font-size:13px;line-height:1.45;}
.setgrp[data-page="basic"][data-split="2"] .chips{padding:0;}
.setgrp[data-page="basic"][data-split="2"] .chip{padding:2px 10px;}
.setgrp[data-page="basic"][data-split="2"] .col .sub + .sub{margin-top:8px;padding-top:6px;}
.setgrp[data-page="basic"][data-split="2"] .sub .rows [data-row]:last-child{border-bottom:none;}
.setgrp[data-page="basic"][data-split="2"] .col > .sub{flex:0 0 auto;min-width:0;display:flex;flex-direction:column;}
/* 用户 m05828 第 5 条：右列现在是两块（主要开关 + 唤醒），不再整列铺满。
   以前只有一个四开关组，用 flex:1 + space-evenly 把开关摊开；现在同一个规则会把
   只有一行的「主要开关」撑成半屏高、那一行悬在中间，上下各留一大块白。改成按内容排。 */
.setgrp[data-page="basic"][data-split="2"] .col[data-col="right"] > .sub{flex:0 0 auto;}
.setgrp[data-page="basic"][data-split="2"] .col[data-col="right"] .rows{display:block;}

  .dipt.wide{min-width:300px;max-width:440px;}
  /* 用户 m02992：数字框以前被全局 input[type=number] 的 background:var(--card) 抢走，
     跟旁边的下拉（var(--bg)）不是一个色，深色主题下看着发白；这里补回来。 */
  input.dipt{background:var(--bg);}
  .dipt.num{width:88px;min-width:0;text-align:right;}
  .darea{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg,#fff);color:var(--text);padding:8px 10px;font-size:13px;line-height:1.65;font-family:inherit;resize:vertical;box-sizing:border-box;}
  .dtip{font-size:11.5px;color:var(--muted);line-height:1.55;}
  .dunit{font-size:12px;color:var(--muted);margin-left:-4px;}
.dnote{font-size:12px;color:var(--muted);}
.pp-left .dnote{font-size:11.5px;}
  .pm-rtpick{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .pm-rtpick select{max-width:260px;}
  /* 用户 m09506：模块头一行放「读取 + 群组 + 刷新」时，别把「读取」和「刷新」挤成竖排。 */
  .pm-rtpick > label{white-space:nowrap;flex:0 0 auto;}
  .pm-rtpick > button{white-space:nowrap;flex:0 0 auto;}
  .pm-rtinfo{white-space:nowrap;}
  /* 用户 m08755：JEV 卡别只做一列——左边选模型、右边填接口，两列并排。
     用户 m09981：不再用「生效中 / 未使用」和点卡片选路，徽标与选中态一并撤掉。 */
  /* 用户 m03412：JEV 卡没有模型行，上边距 4px 让它比另外两张低 4px，这里去掉。 */
  .jev-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;}
  @media (max-width:1100px){.jev-cols{grid-template-columns:1fr;}}
  .jev-col{border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;min-width:0;position:relative;}
  .jev-col-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px;}
  .jev-datarow{display:flex;gap:6px;align-items:center;min-width:0;}
  .jev-datarow .dipt{flex:1 1 auto;min-width:0;}
  .jev-col .drow{padding:4px 0;gap:6px;}
  /* 用户 m02469：标签列收窄，输入框整体往左靠、右边自适应拉长。
     用户 m02950：再收到 56px，控件起点落在标签文字刚结束的位置（红竖线处）。 */
  .jev-col .drow > .dlb{flex:0 0 56px;}
  /* 用户 m09611：决策 / 回复的设置也套成 JEV 那种两列卡片；这两页的标签更长，标签列给 112px。 */
  .jev-col.dcol .drow > .dlb{flex:0 0 112px;}
  /* 用户 m15201：标签列以前固定 112px，可标签只有 50–84px 宽，中间空出一截、控件被推远。
     改成两列网格：标签列按这一列最长的标签自适应，控件紧贴标签、吃满剩下的宽度。 */
  .jev-col.dcol .drows{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:8px;row-gap:8px;align-items:center;}
  .jev-col.dcol .drow{display:contents;}
  .jev-col.dcol .drow.pair2{display:flex;flex-wrap:wrap;grid-column:1/-1;gap:10px;align-items:center;}
  /* 用户 m16307 图1：pair2 那行的标签列要跟网格第一列一样宽，开关才跟上面的下拉左边缘对齐。
     第一列是 max-content（决策卡最长标签 5 字、回复卡 4 字，两张卡宽度不一样），所以由 ppSyncPairLabel() 量出来写进 --dlbw。 */
  .jev-col.dcol .drow.pair2 > .p2{gap:8px;}
  .jev-col.dcol .drow.pair2 > .p2:first-child .dlb{flex:0 0 auto;min-width:var(--dlbw,5em);}
  .jev-col.dcol .drow > .dlb{flex:0 0 auto;min-width:0;}
  /* 用户 m02969：展开后不再套左右两张小卡——去掉边框/内边距，一张卡里左右两列，标签列等宽 84px，左右对称。 */
  /* 用户 m03412：两列间距从 16px 收到 8px，右列起点 273 才跟模型行第三列 273 重合。 */
  .jev-cols.flat-cols{column-gap:8px;}
  .jev-col.flat{border:0;padding:0;background:none;}
  .jev-col.flat.dcol .drows{grid-template-columns:76px minmax(0,1fr);}
  .jev-col.flat.dcol .drow > .dlb{white-space:nowrap;}
  /* 用户 m03627：失败切换那行有开关药丸（31px），普通行只有 27px，左右两列各算各的行高，
     第二三行就差 4px；让两列共用同一套行（subgrid），窄的时候失败切换折成两行，右边第一行也跟着变高。 */
  .jev-cols.flat-cols:has(.jev-col.dcol){grid-template-rows:repeat(3,auto);}
  .jev-col.flat.dcol{display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:subgrid;grid-row:1/4;column-gap:8px;row-gap:8px;align-items:center;}
  .jev-col.flat.dcol > .drows{display:contents;}
  /* 用户 m04084：宽卡片下右列第一行原来在 31px 整行里居中（左列 pair2 有 4px 下内边距），标签比「失败切换」低 2px；
     这一行也留 4px 下内边距，内容盒跟左边一样是 27px，标签和输入框都在这条线上居中。 */
  .jev-col.flat.dcol:last-child > .drows > .drow:first-child{
    display:grid;grid-template-columns:subgrid;grid-column:1/-1;column-gap:8px;align-items:center;padding-bottom:4px;}
  /* 用户 m03907：窄卡片下「失败切换 + 切换模型」折成两行，右列第一行原来在整行里居中、浮在两行中间；
     卡片窄到会折行时让它贴顶，跟「失败切换」那一行对齐（容器查询量的是内容盒，496 = 折行点 244×2+8）。 */
  /* 用户 m13066：JEV 卡也要当容器，否则它里面的 @container (min-width:821px) 找不到容器、30 分钟框收不窄。 */
  #dec-card,#rep-card,#jev-card{container-type:inline-size;}
  @container (max-width:496px){
    /* 用户 m04084：只贴顶还不够——右列第一行标签比「失败切换」高 2px、输入框比药丸高 3px。
       把这一行做成 24px 高（药丸高度）的子网格：标签居中、输入框贴顶，标签和框的上沿都跟左边齐。 */
    .jev-col.flat.dcol:last-child > .drows > .drow:first-child{
      display:grid;grid-template-columns:subgrid;grid-template-rows:24px;grid-column:1/-1;
      column-gap:8px;align-items:center;align-self:start;height:24px;padding:0;}
    .jev-col.flat.dcol:last-child > .drows > .drow:first-child > .ipt{align-self:start;}
  }
  /* 用户 m04321：窄卡片下「失败切换 + 切换模型」要挤在一行——标签列收到 76px（改名后最长标签 75px），
     这一行两个标签都按文字宽度、第二格吃掉剩下的宽度；输入框压到 72px 也不裁字，再窄就折行。 */
  @container (max-width:820px){
    .jev-col.flat.dcol .drow.pair2{gap:8px;}
    .jev-col.flat.dcol .drow.pair2 > .p2:first-child .dlb{min-width:0;}
    .jev-col.flat.dcol .drow.pair2 > .p2:last-child{flex:1 1 120px;}
    .jev-col.flat.dcol .drow.pair2 > .p2:last-child .dlb{flex:0 0 auto;}
  }
  /* 用户 m13066：宽卡片下「30 分钟」那个框跟着列宽拉满（决策卡 1920 下 203.8px、JEV 卡 227.8px），
     数字和单位隔着一大截；这里给它固定宽度，够 4 位数 + 单位就行，窄卡片仍由上面那条容器查询吃掉剩余宽度。
     JEV 卡的左列是 .jev-col.flat（没有 .dcol），所以选择器只写到 .flat，三张卡一起收窄。 */
  @container (min-width:821px){
    .jev-col.flat .drow.pair2 > .p2:last-child{flex:0 0 auto;}
    .jev-col.flat .drow.pair2 > .p2:last-child .ipt.has-unit{flex:0 0 auto;width:110px;}
  }
  /* 用户 m03412：JEV 每行有 4px 上内边距，第一行再叠 4px 就比决策卡低 8px，首行去掉上内边距。 */
  .jev-col .drows > .drow:first-child{padding-top:0;}
  /* 用户 m01978 第 1/2 条：两项并一行——每格「短标签 + 控件」，控件自己撑开。 */
  /* 用户 m15201：窗口窄到一格放不下「标签 + 框 + 单位」时（实测 1256 宽下每格只有 118px，「分钟」被挤成竖排），
     两格自动落成一格；宽屏仍是并排两格。
     用户 m15691：第一格按内容宽度（开关后面不再留一截空白），第二格吃掉剩下的宽度，输入框跟着变长。 */
  .jev-col .drow.pair2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .jev-col .drow.pair2 > .p2:first-child{flex:0 0 auto;}
  .jev-col .drow.pair2 > .p2:last-child{flex:1 1 190px;min-width:0;}
  .jev-col .drow.pair2 > .p2{display:flex;align-items:center;gap:6px;min-width:0;}
  .jev-col .drow.pair2 .dlb{flex:0 0 56px;gap:4px;white-space:nowrap;}
  .jev-col .drow.pair2 .dipt{min-width:0;flex:1 1 auto;width:auto;}
  .jev-col .drow.pair2 .sw2{flex:0 0 auto;}
  /* 用户 m02469：这两个数字框以前撑满整格，太长；现在跟标签列对齐、单位还留在框里。 */
  .jev-col .drow.pair2 .ipt.has-unit{flex:1 1 auto;min-width:0;}
  /* 用户 m02691：上面几行的下拉以前是内容宽度（237），右边留一截空白；现在撑满整列，
     这样「300 秒」那个框的右边缘正好和「未选择模型」下拉的右边缘对齐。 */
  .jev-col .drow > .dipt{flex:1 1 auto;min-width:0;}
  /* 用户 m01978 第 1 条：单位（次 / 秒）搬进框里，跟基础设置页 .ipt.has-unit 一套做法。 */
  .jev-col .ipt.has-unit{position:relative;display:inline-flex;align-items:center;flex:1 1 auto;min-width:0;}
  .jev-col .ipt.has-unit > input{width:100%;min-width:0;padding-right:24px;}
  .jev-col .ipt.has-unit.uw2 > input{padding-right:36px;}
  /* 用户 m09611：token 这种长单位（5 个字母）36px 留白不够，数字会贴上去，单独再放宽一档。 */
  .jev-col .ipt.has-unit.uw3 > input{padding-right:48px;}
  .jev-col .ipt.has-unit > .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    pointer-events:none;color:var(--muted);font-size:12px;font-weight:600;line-height:1;}
  .jev-col .ipt.has-unit > input::-webkit-inner-spin-button,
  .jev-col .ipt.has-unit > input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  /* 用户 m01978 第 3 条：这一行的标签就是接口页的名字，点一下改名。 */
  .jev-pgname{display:inline-flex;align-items:center;gap:3px;cursor:pointer;border-bottom:1px dashed var(--line);}
  .jev-pgname svg{width:9px;height:9px;flex:0 0 auto;opacity:.55;}
  .jev-pgname:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .jev-pgname:hover svg{opacity:1;}
  .jev-api-body .dlb .jev-pgname{max-width:100%;gap:2px;}
  .jev-pgnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .jev-col .drow.stack{display:block;}
  .jev-col .drow.stack > .dlb{display:block;margin:0 0 2px;}
  .jev-col .drow.stack .dipt{width:100%;box-sizing:border-box;}
  .jev-col .drow.stack .jev-datarow .dipt{width:auto;flex:1 1 auto;}
  /* 用户 m16307 图2：不确定段从「两个下拉 + ~」改成一根长条——每 5% 一格刻度，
     25%~75% 那段高亮，中间显示「25%~75%」。拖动逻辑在 jevSliderPaint / jevSliderCommit。 */
  .jev-slider{position:relative;display:flex;align-items:center;flex:1 1 auto;min-width:0;height:30px;
    box-sizing:border-box;}
  .jev-slider-track{position:relative;flex:1 1 auto;min-width:0;height:22px;border-radius:7px;background:var(--line);
    --kw:11px;--kr:11px;}
  .jev-slider-clip{position:absolute;inset:0;border-radius:7px;overflow:hidden;pointer-events:none;}
  .jev-slider-fill{position:absolute;top:0;bottom:0;background:var(--accent);}
  .jev-slider-ticks{position:absolute;inset:0;pointer-events:none;color:var(--text);opacity:.22;
    background:repeating-linear-gradient(to right,currentColor 0 1px,transparent 1px 5%);}
  .jev-slider-knob{position:absolute;top:50%;transform:translateY(-50%);width:var(--kw);height:calc(var(--kr) * 2);
    padding:0;border:2px solid var(--accent);background:#fff;box-sizing:border-box;
    cursor:grab;touch-action:none;z-index:2;}
  .jev-slider-knob[data-h='lo']{margin-left:calc(var(--kw) * -1);border-radius:var(--kr) 0 0 var(--kr);}
  .jev-slider-knob[data-h='hi']{border-radius:0 var(--kr) var(--kr) 0;}
  .jev-slider-knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .jev-slider-knob.dragging{cursor:grabbing;}
  .jev-slider-tag{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;
    font-size:11px;line-height:1;padding:3px 7px;border-radius:6px;white-space:nowrap;
    background:var(--card);border:1px solid var(--line);color:var(--text);}
  .jev-col .drow.stack .jev-datarow .dbtn{flex:0 0 auto;}
  .jev-keyrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px;}
  .jev-keyrow .dbtn{white-space:nowrap;}
  .jev-keystate{font-size:11.5px;color:var(--muted);}
  .jev-keyline{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .jev-keyline input[type=password]{flex:1 1 150px;min-width:0;}
  .jev-keyline .dbtn{flex:0 0 auto;}
  .jev-keyline .jev-keystate{flex:0 1 auto;white-space:nowrap;}
  .jev-keyline #jev-key-note{flex:1 1 100%;}
  .jev-keyline #jev-key-note:empty{display:none;}
  .jev-col input[type=password]{font:inherit;height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg,#fff);color:var(--text);width:100%;box-sizing:border-box;font-size:13px;}
  .jev-col .drow.stack .jev-keyline input[type=password]{width:auto;}
  /* 用户 m02691：页签从左边竖条搬走，右卡的表单就能和左卡一样贴着卡片左边。
     用户 m02835：页签再挪到右卡左下角，和右下角的「已保存」同一行。 */
  .jev-api{display:block;}
  .jev-api-tabs{display:flex;justify-content:flex-start;padding:0;}
  .jev-api-tabs .jev-tabs{display:flex;flex-direction:row;gap:4px;margin:0;}
  .jev-api-tabs .jev-tab{width:26px;min-width:26px;height:24px;padding:0;}
  .jev-api-body .drow{gap:6px;align-items:center;}
  .jev-col .jev-api-body .drow > .dlb{flex:0 0 66px;min-width:0;gap:4px;white-space:nowrap;}
  .jev-api-body .dipt{min-width:0;flex:1 1 auto;width:auto;}
  .jev-api-body .jev-keyline{flex:1 1 auto;min-width:0;}
  .jev-api-body .jev-keyline input[type=password]{flex:1 1 50px;min-width:0;}
  .jev-api-body .jev-keyline .dbtn{padding:0 8px;font-size:12px;}
  .jev-api-body .jev-keyline .jev-keystate{font-size:11px;}
  .jev-api-body .jev-datarow{flex:1 1 auto;min-width:0;}
  .jev-api-body .jev-datarow .dbtn{padding:0 8px;font-size:12px;flex:0 0 auto;white-space:nowrap;}
  .jev-api-body{padding-bottom:0;}
  .jev-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 0;font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap;}
  .jev-foot-end{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .jev-tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px;}
  .jev-tab{min-width:26px;height:24px;padding:0 7px;font-size:12px;border-radius:6px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer;}
  .jev-tab:hover{border-color:var(--accent);color:var(--accent);}
  .jev-tab.on{border-color:var(--accent);color:#fff;background:var(--accent);font-weight:600;}
  .jev-tab-add{border-style:dashed;font-weight:600;}
  .jev-ep{font-size:11px;color:var(--muted);margin:1px 0 0;word-break:break-all;line-height:1.4;}
  .jev-combo{position:relative;}
  .jev-modellist{position:absolute;left:0;right:0;top:100%;z-index:40;max-height:220px;overflow:auto;
    background:var(--card,#fff);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.14);margin-top:2px;}
  /* 用户 m01978 第 6 条：模型清单的滚动条做成内侧细条，跟提示词页右栏一样。 */
  .jev-modellist{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .jev-modellist::-webkit-scrollbar{width:8px;height:8px;}
  .jev-modellist::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;
    border:2px solid transparent;background-clip:padding-box;}
  .jev-modellist::-webkit-scrollbar-track{background:transparent;}
  .jev-modellist div{padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jev-modellist div:hover{background:rgba(127,127,127,.14);}
  .jev-empty{padding:6px 9px;font-size:12px;color:var(--muted);}
  .jev-count{display:block;margin-top:2px;font-size:11.5px;line-height:1.4;color:var(--muted);}
  /* 用户 m02159 图5：决策模型卡中间六个数字排两列，右侧不再空一大片。 */
  .drows.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  /* 用户 m04343 第 8 条：模型下拉挪到标题右边后列宽被撑破，这里把每格按住，别越界。 */
  .drows.cols2>*{min-width:0;}
  .drows.cols2 .dipt{max-width:100%;}
  .drows.cols2 .drow{padding:4px 0;gap:6px;}
  .drows.cols2 .dlb{flex:0 0 112px;min-width:0;}
  .drows.cols2 .dipt{min-width:0;flex:1 1 auto;}
  .dmini{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}
  .dmini:hover{color:var(--accent);border-color:var(--accent);}
  .dtools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 14px;}
  .dtool{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--text);padding:4px 2px;cursor:pointer;}
  .dtool .dtn{display:flex;flex-direction:column;gap:1px;line-height:1.45;}
  .dtool .dtn b{font-weight:600;}
  .dtool .dtn i{font-style:normal;color:var(--muted);font-size:11.5px;}
  /* 工具说明原来会把长描述折成三四行，撑高卡片还游出边框；压成一行省略，全文留在 title。 */
  .dtool .dtn{min-width:0;overflow:hidden;}
  .dtool .dtn i{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dempty{font-size:12px;color:var(--muted);padding:6px 2px;}

  /* 用户 m19842：不做折叠了，只把所选区间里一次都没调用过的模型藏起来（tr.pidle）。 */

  /* 饼卡的卡头是绝对定位、卡身是普通块：卡身带 pchart-anim 的 transform 时会自成层叠上下文盖住卡头，按钮点不动——卡头抬一层。 */
  /* 用户 m09125：柱图的区间按钮不再贴右上角，跟标题、日期范围排在同一行（居中）。 */
  /* 用户 m09408：区间按钮挪进卡头后，弹层还挂在卡头右边缘——让按钮自己当定位祖先，弹层跟着按钮居中往下开。 */
  .pchart-range{position:relative;margin-left:0;height:26px;z-index:2;}
  .pchart-range button{height:20px;padding:0 9px;font-size:11.5px;}

  .pchart-pie .pchart-range{position:absolute;left:6px;right:auto;top:4px;transform:none;height:20px;padding:1px;border-radius:8px;}
  .pchart-pie .pchart-range button{height:16px;padding:0 6px;font-size:11px;border-radius:6px;}

  /* 用户 m07372：饼卡在页面底部时弹层往下开会被视口切掉，放不下就翻到卡片上面。 */

  .pinlab-out{fill:var(--text);}

/* v3.92（用户 m06951 第 5~7 条）：提示词页——左设置、右预览，右栏吸顶。

   两个 54px 蓝块 → 一条 34px 的胶囊条，标题与副标题同行。 */
.pp-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 2px;}
.pp-tabs{grid-template-columns:auto auto;justify-content:flex-start;gap:2px;width:max-content;max-width:100%;

.pp-prev{display:flex;flex-direction:column;overflow:hidden;}

.pp-prev-div{display:flex;align-items:center;gap:8px;margin:8px 0;padding:5px 10px;border:1px solid var(--accent);
  border-radius:8px;background:rgba(59,130,246,.10);}

/* 用户 m03562：上下两个预览框各带一个右上角标签，底色分开——上面是 system，下面是动态注入。

.pp-prev-box{position:relative;display:flex;flex-direction:column;min-height:0;margin:0 -12px;}

/* 用户 m14864：1024–1180 这段宽度下左右两栏已经叠成一列（见下面 .pp-pane 的 1180 断点），
   但「整页不滚、左右各自滚」的定高布局还在，两栏各被压到一百多像素高，预览卡里的系统提示词
   盒子被挤成 0 高、正文溢出盖到下面的动态段上，看起来像两版提示词叠在一起。

@media (max-width:1180px){
  .pp-right{max-height:none;overflow:visible;}

  .pp-right>.dcard{flex:none!important;overflow:visible!important;}

  .pp-prev .psegbox{max-height:none!important;}

.pp-left-head{flex:none;padding:0 12px;}
.pp-left-body{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.pp-left-body>.dcard{background:transparent;border:0;border-radius:0;padding:0;margin:0;}
/* 用户 m18454：提示词第一次读回来之前，编辑器只有一行「读取中」，下面的设置卡会顶到最上面，
   等正文到了再被挤下去，看着像闪一下。加载态先占满整栏高度，设置卡一开始就在折叠线以下。 */
.pp-left-body>.pm-editor.pm-loading{min-height:calc(100% + 12px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;}
/* 「重新读取」是 .dmini，自带 margin-left:auto 会被推到右边，加载态里要跟上面那行字对齐。 */
.pp-left-body>.pm-editor.pm-loading .dmini{margin-left:0;}
/* 用户 m18016：新增模块卡和下面设置之间那根线去掉，三页一起变紧凑（原来 border-top + 上下各 10px）。 */
.pp-right{max-height:none;}
/* 用户 m02469：左栏那根上下滑动杆以前贴着栏边——而且 scrollbar-width:thin 会让 Chromium
   忽略 ::-webkit-scrollbar，等于没做。这里去掉 scrollbar-width，改用 webkit 伪元素：
   轨道 12px、滑块四周留 4px 透明边，看起来就缩在栏内侧，跟模型清单那根一致。 */
.pp-left-body::-webkit-scrollbar{width:12px;height:12px;}
.pp-left-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;
  border:4px solid transparent;background-clip:padding-box;}
.pp-left-body::-webkit-scrollbar-track{background:transparent;}
.pp-right::-webkit-scrollbar{width:8px;height:8px;}
.pp-right::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.pp-right::-webkit-scrollbar-track{background:transparent;}
/* 用户 m03082：右侧预览里真正在滚的是里面的 pre（.pp-right 自己不滚），所以上面那套伪元素
   一直没派上用场，浏览器给的是系统白条。这里给 .dpre 补同一根细滑块，两栏的杆子才算一致。 */
.dpre::-webkit-scrollbar{width:12px;height:12px;}
.dpre::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:4px solid transparent;background-clip:padding-box;}
.dpre::-webkit-scrollbar-track{background:transparent;}
.dpre::-webkit-scrollbar-corner{background:transparent;}
/* v4.10：分段列表是 flex 列，条目会被压扁成一格一格重叠，钉住它们别缩。 */
.psegbox>.pseg{flex:0 0 auto;}
/* v4.10：[hidden] 被 .drow{display:flex} 顶掉过，试跑结果框一进页面就露个空框，这里按隐藏处理。 */
.pp [hidden]{display:none !important;}
.pm-footer{border-top:1px solid var(--line);padding-top:6px;margin-top:6px;}
.pm-footer .pm-note{flex:1 1 auto;min-width:0;}
/* v4.10 四轮：右栏一屏装下——预览框吃掉剩余高度、自己不再滚；左栏编辑工具条吸在栏顶。 */
.pp-right{overflow:hidden;}
.pp-right{z-index:40;}
.pp-right:has(.pp-prev.big),.pp-pane:has(.pp-prev.big){overflow:visible;}
.pp-right>.dcard{flex:1 1 auto;min-height:0;overflow:hidden;}
.pp-prev{height:100%;}
.pp-prev .dpre.tall{flex:1 1 auto;min-height:150px;max-height:none;}
/* 用户 m16904 图1：点「测试」后结果框一出现，系统提示词那块被挤到 103px，
   里面的 pre 有 min-height:150px，撑出盒子盖住「实时窗口」分隔条和动态注入框。
   这里给 sys 块兜住最小高度，结果框自己缩、自己滚。 */
.pp-prev-box.sys{flex:1 1 0;min-height:150px;}
/* 放大看的时候 sys 块本来就不设下限，这里只把基准也改成 0，别把结果框挤没。 */
.pp-prev.big .pp-prev-box.sys{flex:1 1 0;min-height:150px;}
/* 点开试跑结果时，动态注入那块让一让，别把结果框挤成一条。 */
.pp-prev:has(.pp-test:not([hidden])) .pm-dyn{max-height:180px;}
/* 用户 m16904 第 2、3 条：试跑结果改成「一行信息胶囊 + 分段块」。 */
.pp-test{flex:0 1 auto;min-height:0;overflow:auto;margin:0 -12px;padding:8px 12px 10px;border-top:1px solid var(--line);}
.pp-test h4{margin:0 0 7px;font-size:12.5px;font-weight:600;}
.pp-test-meta{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px;}
.pp-test-chip{display:inline-flex;align-items:baseline;gap:5px;max-width:100%;padding:2px 8px;border:1px solid var(--line);border-radius:7px;background:rgba(127,127,127,.06);font-size:11px;line-height:16px;color:var(--muted);}
.pp-test-chip b{font-weight:600;color:var(--text);}
.pp-test-chip i{font-style:normal;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pp-test-sec{margin:0 0 8px;}
.pp-test-sec:last-child{margin-bottom:0;}
.pp-test-sech{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:11px;font-weight:600;color:var(--muted);}
.pp-test-sech:before{content:"";flex:none;width:3px;height:11px;border-radius:2px;background:var(--accent);opacity:.75;}
.pp-test-sect{margin:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(127,127,127,.05);font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;}
.pp-test-sec.bad .pp-test-sech:before{background:var(--bad);}
.pp-test-sec.bad .pp-test-sect{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.07);}
.pp-test-sec.ok .pp-test-sech:before{background:var(--ok);}
.pp-test-sec.ok .pp-test-sect{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06);}
.pp-test-empty{color:var(--muted);font-size:11.5px;line-height:1.6;}
/* 用户 m17185：回复那一段按气泡显示，标签正常 / 不合规各挂一个角标。 */
.pp-test-badge{margin-left:auto;flex:none;font-size:10.5px;font-weight:600;line-height:15px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
.pp-test-badge.ok{color:var(--ok);border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.08);}
.pp-test-badge.bad{color:var(--bad);border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.08);}
.pp-test-bub{margin:0 0 6px;padding:7px 10px;border:1px solid rgba(16,185,129,.4);border-radius:8px;background:rgba(16,185,129,.06);font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;}
.pp-test-bub:last-child{margin-bottom:0;}
/* 用户 m17185：上面两个预览框各加一个折叠按钮，默认展开，折起来只留一行标签。 */
.pp-prev-cap{display:inline-flex;align-items:center;gap:2px;pointer-events:auto;}
.pp-cap-tg{flex:none;width:15px;height:15px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:10px;line-height:15px;text-align:center;cursor:pointer;}
.pp-cap-tg:hover{background:rgba(127,127,127,.2);color:var(--text);}
.pp-prev-box.folded{min-height:28px;}
.pp-prev-box.folded>.dpre{display:none;}
.pp-prev .pp-prev-box.sys.folded{flex:0 0 auto;min-height:28px;}
.pp-prev .psegbox{flex:0 0 auto;}
.pp-prev .pm-dyn{flex:0 0 auto;}
/* v4.85（用户 m10425 第 2 条）：左边工具条那排改成和右边「提示词预览」一样的卡头——
   一样的内边距、一样的标题字号、一样的下边框，两栏不再一个像表单、一个像卡头。
   m07137：再把高度、底色、按钮样式也对齐：控件 22px、底色跟卡片一致、按钮无边框。 */
.pp-left .pp-left-head .pm-toolbar{position:sticky;top:0;z-index:3;background:var(--bg);
  margin:0 -12px;padding:4px 12px;border-bottom:1px solid var(--line);}
  .pp-left .pp-left-head .pm-toolbar .dipt{height:26px;font-size:12px;}
  /* 用户 m1337：这排按钮和字都再大一点（22px/11px → 26px/12px），上下留白同时收窄（8px → 4px）。 */
  .pp-left .pp-left-head .pm-toolbar .pm-state{font-size:12px;}
  .pp-left .pp-left-head .pm-toolbar .dmini{height:26px;padding:0 9px;font-size:12px;
  border-color:transparent;background:transparent;}
.pp-left .pp-left-head .pm-toolbar .dmini:hover{border-color:var(--line);background:var(--card);color:var(--accent);}
/* 2026-11-18（J，用户 m12620）：提示词各页的「恢复默认」是这一页唯一能把正文换回默认稿的入口，
   以前跟「保存此提示词」一样是透明小按钮，容易看漏；给它上强调色描边 + 淡底，一眼能找到。 */
.pp-left .pp-left-head .pm-toolbar .dmini[data-pm-action="inherit"]{
  border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}
.pp-left .pp-left-head .pm-toolbar .dmini[data-pm-action="inherit"]:hover{
  border-color:var(--accent);background:var(--accent-soft2);color:var(--accent);}
@media (max-width:640px){.pm-module-head{flex-wrap:wrap;}.pm-meta{padding-left:8px;}.pm-body{padding-left:8px;}}
/* m01209：三个页签、模板卡片页、动态尾段分隔条、身份只读标记；顺手把整页再收紧一点。 */
.pp-tab{padding:0 12px;height:30px;}
.pp-tab .pp-sub{margin-left:6px;font-size:10.5px;color:var(--muted);font-weight:400;}
.pp-tab.on .pp-sub{color:inherit;opacity:.85;}
.pp-pane-wide{display:flex;flex-direction:column;align-items:stretch;overflow:hidden;}
#pp-tpl{max-width:none;display:flex;flex-direction:column;min-height:0;flex:1 1 auto;}
/* v4.84（用户 m09179 第 7 条）：自定义页不再分「改过的默认模板 / 另存的模板」两种，
   只按来源分三竖列（决策 / JEV / 回复）；模板库那套新建 / 编辑 / 删除的界面整块撤掉。 */
.ptpl-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 0;flex:1 1 auto;min-height:0;}
.ptpl-col{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 9px;
  display:flex;flex-direction:column;min-height:0;}
.ptpl-colh{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:600;margin:0 0 7px;
  padding-bottom:5px;border-bottom:1px solid var(--line);flex:none;}
.ptpl-colh .dhead-x{margin-left:auto;font-weight:400;}
/* 用户 m18121：自定义页先只摆标题小卡，点开谁就在这一列下面展开编辑框，编辑框尽量铺到页面底部。 */
.ptpl-list{flex:0 0 auto;max-height:45%;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;}
.ptpl-mini{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;font-family:inherit;
  border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:6px 9px;cursor:pointer;
  color:var(--text);transition:border-color .12s,background .12s;}
.ptpl-mini:hover{border-color:var(--accent);}
.ptpl-mini.on{border-color:var(--accent);background:rgba(59,130,246,.10);color:var(--text);}
.ptpl-mini b{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.ptpl-mini .ptpl-n{margin-left:auto;}
.ptpl-detail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:8px;}
.ptpl-detail .ptpl-card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:0;overflow:hidden;}
.ptpl-detail .ptpl-self{flex:1 1 auto;min-height:0;resize:none;}
.ptpl-empty{font-size:11.5px;color:var(--muted);line-height:1.6;}
/* 用户 m18347：自定义页顶上那段说明精简成一句半，并且居中。 */
/* 用户 m18421：这行说明原来跟着 .pm-note 用 11px，比列标题还小，放大到 12.5px（跟页签同号）。 */
.ptpl-note{text-align:center;max-width:960px;margin:0 auto;font-size:12.5px;line-height:1.6;}
@media (max-width:900px){
  .pp-pane-wide{display:block;overflow:auto;}
  #pp-tpl{display:block;}
  .ptpl-cols{grid-template-columns:1fr;flex:none;}
  .ptpl-col{display:block;}
  .ptpl-list{max-height:none;overflow:visible;}
  .ptpl-detail{display:block;}
  .ptpl-detail .ptpl-self{min-height:150px;resize:vertical;}
  /* 用户 m18454：窄屏是整页滚动，百分比高度算不出来，加载态给个固定占位，别让设置卡先顶上来。 */
  .pp-left-body>.pm-editor.pm-loading{min-height:520px;}
}
.ptpl-card{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:8px 9px;min-width:0;}
/* 2026-11-08：自定义页三张卡原来太矮（正文框只露 4 行），把正文框拉高一点。 */
.ptpl-self{min-height:150px;}
.ptpl-n{margin-left:auto;font-size:11px;color:var(--muted);flex:none;}
.ptpl-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ptpl-acts .dmini{margin-left:0;height:22px;padding:0 8px;font-size:11px;}
.pm-dynamic{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px dashed var(--line);border-radius:9px;
  background:transparent;font-size:11.5px;color:var(--muted);}
.pm-dyn-tag{flex:none;font-weight:600;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;}
.pm-dyn-note{flex:1 1 auto;min-width:0;line-height:1.5;}
.pm-dynamic .pm-enabled{margin:0;flex:none;font-size:11px;}
.pm-lock{flex:none;min-width:48px;text-align:center;font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:0 6px;margin-left:0;}
.pm-locknote{font-size:11px;color:var(--muted);}
.pm-hint{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.5;}
.pm-module-head{gap:4px;}
.pm-meta{padding-bottom:4px;}
.pm-label{height:24px;}
.pm-body>.darea{margin-top:2px;}
  /* 用户 m02159：工具打勾清单、锁定段、动态尾段的右侧说明 */
  .pm-tools{margin:0 6px 5px 26px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 6px 5px;}
  .pm-tools-head{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .pm-tools-sum{margin-left:auto;color:var(--text);font-size:11px;}
  .pm-tool{display:flex;align-items:flex-start;gap:6px;padding:2px 4px;border-radius:6px;font-size:12px;line-height:1.35;cursor:pointer;}
  .pm-tool:hover{background:var(--soft);}
  .pm-tool.on{background:var(--soft);}
  .pm-tool input{flex:none;margin:1px 0 0;}
  .pm-tool-name{flex:none;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;}
  /* 用户 m2450：身份 / 人格 / 工具 / 记忆 / 时间这几段是插件自己填的，卡片里只显示占位符。 */
  .pm-token{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;color:var(--accent);background:rgba(59,130,246,.10);border-radius:5px;padding:0 5px;white-space:nowrap;vertical-align:baseline;}
  html[data-theme="dark"] .pm-token{background:rgba(96,165,250,.16);}

  /* 用户 m02105：工具说明以前一行省略号截断，1920 下也有三条看不全——改成整段折行。 */
  .pm-tool-desc{flex:1 1 auto;min-width:0;color:var(--muted);font-size:11px;line-height:1.45;white-space:normal;overflow:visible;text-overflow:clip;}
  .pm-module-head .pm-lock{flex:none;margin-left:1px;}
  .pm-module.pm-locked .pm-label{color:var(--muted);}
  .pm-dynamic .pm-dyn-note{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px;}
  .pm-dynamic .pm-dyn-tip{flex:none;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px;line-height:15px;cursor:help;}
  .pm-dynamic .pm-enabled{margin:0 0 0 auto;flex:none;font-size:11px;}
  /* 用户 m02159 图4：底部工具条压成一行左「新增」右「快捷」，说明收成一行小字 */
  .pm-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;}
  .pm-foot .pm-add{flex:1 1 200px;min-width:0;}
  .pm-foot .pm-add select{flex:1 1 auto;min-width:0;}
  .pm-foot .dmini{white-space:nowrap;flex:none;}
  .pm-tip{font-size:11.5px;color:var(--soft);line-height:1.5;margin-top:5px;}
  /* 用户 m02993 图1：实时窗口 / 动态段用颜色分开——一个是「位置」，一个是真注入的动态模板。 */
  /* 用户 m04617 图5：这几块的彩色左条以前是 border-left，占 3px 宽，会把标题挤得比别的行右移 2px；
     改成内阴影，颜色照旧、宽度不占，所有行的名字才在同一条竖线上。 */
  .pm-module.pm-realtime{box-shadow:inset 3px 0 0 #4f7cff;background:linear-gradient(90deg,rgba(79,124,255,.07),rgba(79,124,255,0) 62%);}
  .pm-module.pm-dynamic-mod{box-shadow:inset 3px 0 0 #a06bff;background:linear-gradient(90deg,rgba(160,107,255,.09),rgba(160,107,255,0) 62%);}
  .pm-module.pm-realtime .pm-idx,.pm-module.pm-dynamic-mod .pm-idx{font-weight:600;}
  .pm-cta{border-color:#4f7cff !important;color:#5b86ff !important;font-weight:600;}
  .pm-cta:hover{background:rgba(79,124,255,.16);}
  .pm-foot .pm-add select{margin:0;}
  .pm-foot .pm-tip{padding-left:1px;}
  /* 用户 m02993 图7：决策模型 / 备用模型并排，标签收在上面一行，右侧不再空一大片。 */
  .drows.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;}
  .drows.pair .dpair{min-width:0;}
  /* 用户 m02993 图7：决策模型 / 备用模型并排，标签收在上面一行，右侧不再空一大片。 */
  .drows.pair .dcap{font-size:12.5px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:4px;
    margin:1px 0 2px;padding-left:7px;}
  .drows.pair .dipt{width:100%;min-width:0;}
  /* 用户 m02993 图2：工具清单折叠成一条「正文」那样的小条。 */
  .pm-tools-fold{margin:0 6px 4px 26px;}
  .pm-tools-fold>.pm-sum{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:2px 6px;border-radius:6px;background:rgba(127,127,127,.10);color:var(--muted);cursor:pointer;font-size:11.5px;list-style:none;}
  .pm-tools-fold>.pm-sum::-webkit-details-marker{display:none;}
  .pm-tools-fold>.pm-sum::before{content:"\25B8";display:inline-block;transition:transform .12s;font-size:10px;}
  .pm-tools-fold[open]>.pm-sum::before{transform:rotate(90deg);}
  .pm-tools-fold>.pm-sum>span:first-child{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pm-tools-fold .pm-tools-sum{flex:none;}
  .pm-tools-fold .pm-tools{margin:3px 0 0;padding:0;}
  .pm-tools-fold .pm-tools-head{display:none;}
  .pm-meta .pm-src-fixed{flex:none;height:21px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;
    font-size:11.5px;color:#9db6ff;background:rgba(79,124,255,.14);border:1px solid rgba(79,124,255,.35);}
  .pm-dynamic-mod .pm-meta .pm-src-fixed{color:#c8a6ff;background:rgba(160,107,255,.14);border-color:rgba(160,107,255,.35);}
  /* 用户 m03879：不会变的段标题只读、描述跟在标题右边；位置标签只标注入点，排在「N 字」左边。 */
  /* 用户 m04617 图5：只读标题（人格 / 工具 / 身份…）左边缘比可编辑输入框少 7px（输入框自带内边距 + 边框），

  @media (max-width:1023px){

    .chips .adform input{flex:1 1 120px;width:auto;min-width:0;}
    /* 数据行（JEV / 决策模型 / 提示词左栏）：同样上下堆叠 */
    .drow{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;}
    .drow>.dlb{flex:0 0 auto!important;width:auto!important;white-space:normal!important;}
    .drow>.dipt,.drow>.darea,.drow>.num{width:100%!important;min-width:0!important;max-width:100%!important;}
    .dipt.wide{min-width:0!important;max-width:100%!important;}
    .jev-slider{width:100%!important;}
    .jev-datarow{flex-wrap:wrap;}
    .jev-datarow>.dipt{flex:1 1 100%;}
    .drows.cols2{grid-template-columns:1fr!important;}
    /* 时段图表头：说明文字独占一行，别被「曲线 / 隐藏划分」挤成一条缝 */
    .bd-head{flex-wrap:wrap;row-gap:6px;}
    .bd-head .bd-hint{flex:1 1 100%;}
    .dtools,.pp-left .dtools{grid-template-columns:1fr!important;}
    .pp-left .dlb{flex:0 0 auto!important;white-space:normal!important;}
    .pp-left .drow>.num{width:100%!important;}
    .pp-left .dipt.wide{min-width:0!important;}
    /* 缓存表：6 列在手机上会把「缓存类型」挤成一列字，改成一行一张卡，列名用 ::before 补 */
    .cachebox .cmain-l{overflow-x:visible;}
    .cachebox .ctable{min-width:0;display:block;}
    .cachebox .ctable thead{display:none;}
    .cachebox .ctable tbody{display:block;}
    .cachebox .ctable tr{display:block;margin:8px 0;padding:8px 10px;
      border:1px solid var(--line);border-radius:10px;background:var(--card);}
    .cachebox .ctable td,
    .cachebox .ctable td.num,
    .cachebox .ctable td.cset,
    .cachebox .ctable td.cact{display:flex;align-items:baseline;gap:8px;padding:3px 0;
      border:0;text-align:left;white-space:normal;overflow-wrap:anywhere;}
    /* 卡片边框挂在首尾格上（桌面版），手机上整行已经是一张卡，这里要清掉 */
    .cachebox .ctable tbody td:first-child,
    .cachebox .ctable tbody td:last-child{border:0;border-radius:0;}
    .cachebox .ctable td::before{flex:0 0 72px;color:var(--muted);font-size:11px;
      font-weight:400;line-height:1.55;}
    .cachebox .ctable td:nth-child(2)::before{content:"数量";}
    .cachebox .ctable td:nth-child(3)::before{content:"占用";}
    .cachebox .ctable td:nth-child(4)::before{content:"群聊上限";}
    .cachebox .ctable td:nth-child(5)::before{content:"私聊上限";}
    .cachebox .ctable td:nth-child(6)::before{content:"保留天数";}
    .cachebox .ctable td:nth-child(7)::before{content:"操作";}
    .cachebox .ctable td.cname{display:block;padding-bottom:5px;}
    .cachebox .ctable td.cname::before{content:none;}
    .cachebox .ctable td.cname .cnote{font-size:11px;line-height:1.55;margin-top:2px;}
    .cachebox .ctable td.cact{flex-wrap:wrap;}
    .cachebox .ctable td[colspan]::before{content:none;}
    .cachebox .ctable .cpair{justify-content:flex-start;}
  }
</style>
</head>

    <!-- 2026-11-18（J，用户 m12610）：说明不再挂在 title 上（用户不看悬浮），点按钮时在确认框里说清楚。 -->
