<!DOCTYPE html>

<meta charset="utf-8" />

<link rel="icon" href="data:," />
<title>多样决策</title>
<script defer src="js/lib-1.js"></script>
<script defer src="js/lib-2.js"></script>
<script defer src="js/lib-3.js"></script>
<script defer src="js/lib-4.js"></script>
<script defer src="js/app.js"></script>
<script>
/* 首帧引导（v3.06）
   ① 按上次缓存先把「启用」开关摆到正确位置，避免刷新时播放一次「自动重开」的滑动动画；
   ② KiraAI 外壳是单页应用，菜单接口返回前标题先显示占位「插件页面」，插件页一加载就纠正，
      接口越慢收益越大（实测慢接口下可提前约 2 秒）。 */
(function(){
  var d = document, e = d.documentElement;
  e.className += " booting";
  try{ if(localStorage.getItem("mdp_plugin_enabled") === "1") e.className += " plugin-on"; }catch(x){}
  // 记住上次停在哪个页（v3.12）：外壳刷新会重建 iframe、src 回到 decision-log，
  // 于是在设置页一刷新就被弹回首页（用户 m39759 ①）。发现上次停在设置页就直接跳过去。
  // 放在最前面：此时 body 还没解析，replace 不会闪一帧首页。
  (function(){
    try{
      if(localStorage.getItem("mdp_page") === "settings"){
        var m = location.pathname.match(/\/page\/plugin\/([^\/]+)\//);
        if(m){ location.replace("/page/plugin/" + m[1] + "/settings/"); return; }
      }
      localStorage.setItem("mdp_page", "home");
    }catch(x){}
  })();
  // 主题也从首帧就定下来，深色模式下刷新不再先白一下（v3.08）
  (function(){
    var t = "";
    try{
      var p = window.parent;
      if(p && p !== window && p.document && p.document.documentElement){
        var v = p.document.documentElement.getAttribute("data-theme");
        if(v === "dark" || v === "light") t = v;
      }
    }catch(x){}
    if(!t){ try{ var c = localStorage.getItem("mdp_theme"); if(c === "dark" || c === "light") t = c; }catch(x){} }
    if(t) e.setAttribute("data-theme", t);
  })();
  function release(){ e.classList.remove("booting"); }
  window.__releaseBoot = release;
  setTimeout(release, 1500);
  try{
    var p = window.parent;
    if(p && p !== window && p.document){
      var fix = function(){
        try{
          var h = p.document.querySelector("header.app-header h2");
          if(h && h.textContent.trim() === "插件页面") h.textContent = "多样决策";
        }catch(x){}
      };
      fix();
      var t0 = Date.now();
      (function loop(){ fix(); if(Date.now() - t0 < 2000) requestAnimationFrame(loop); })();
    }
  }catch(x){}
})();
</script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e3e9f3;--text:#1f2937;--muted:#6b7280;--accent:#3b82f6;--reload:#7c3aed;--reload-soft:rgba(124,58,237,.10);--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--soft:rgba(127,127,127,.08);}
html[data-theme="dark"]{--bg:#0f172a;--card:#16213a;--line:#26344f;--text:#e5edff;--muted:#93a4c4;--accent:#60a5fa;--reload:#a78bfa;--reload-soft:rgba(167,139,250,.16);--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:rgba(255,255,255,.06);}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
/* 不再限制 1500px：宽屏下撑满内容区，否则两侧留一大圈空白 */
.wrap{padding:18px 22px 40px;max-width:none;margin:0;}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.navseg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:11px;background:var(--soft);border:1px solid var(--line);height:32px;}
.navbtn{height:26px;padding:0 15px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;line-height:1;transition:background .15s,color .15s;}
.navbtn:hover{color:var(--text);}
/* 用户 m19542 第 4 条：选中的按钮统一换成实心蓝底白字，跟「美化 / 对照 / 原文」那组一致 */
.navbtn.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.10);}
/* 用户 m01874：模型没配时「设置」按钮右上角亮个红点 */
.navbtn{position:relative;}
.navbtn .mdot{position:absolute;top:3px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--bad);}
h1{font-size:20px;margin:0;font-weight:600;}
.sub{color:var(--muted);font-size:12px;}
/* 用户 m07864 第 1 条：刷新时这句长度一变，右边的热重载按钮就像被推了一下。
   定宽 + 等宽数字，占位文案「更新于 --:--:--」跟真时间几乎一样宽。 */
#subtitle{display:inline-block;min-width:104px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0 5px;}
  .stack span{display:block;height:100%;}
  .lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .lg .k{display:flex;align-items:center;gap:5px;}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;}
  .s0{background:var(--accent);}
  .s1{background:#8b5cf6;}
  .s2{background:#10b981;}
  .s3{background:#94a3b8;}
  .sysbox{margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:6px 9px;}
  .sysbox summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none;}
  .sysbox summary:hover{color:var(--accent);}
  .sysbox pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:11.5px;line-height:1.55;max-height:36vh;overflow:auto;}
  .seqh{font-size:12.5px;font-weight:600;margin:12px 0 5px;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
/* v4.10（用户 m17328 第 2 条）：历史消息里哪几条真能命中缓存，在这条线上分开 */
.coldline{margin:10px 0 6px;padding:5px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;color:var(--warn);background:rgba(245,158,11,.10);border:1px dashed rgba(245,158,11,.42);}
html[data-theme="dark"] .coldline{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.38);}
/* v4.14（用户 m19095）：前缀之后那一段里，本轮输入用蓝调，跟「冷」区分开 */
.coldline.in{color:var(--info,#3b82f6);background:rgba(59,130,246,.09);border-color:rgba(59,130,246,.38);}
html[data-theme="dark"] .coldline.in{color:#93c5fd;background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.40);}
  .seqh .mini{font-size:11px;font-weight:400;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;}
  .seqh .mini:hover{border-color:var(--accent);color:var(--accent);}
  .mc-bd .segh{display:flex;gap:6px;margin-bottom:5px;}
  .seqh .dim{font-weight:400;color:var(--muted);}
  .msg.pend{opacity:.85;border-left:2px solid var(--accent);}
  .msg.pend .role{color:var(--accent);}
  .msg.summary{border-left:2px solid #8b5cf6;background:var(--soft);border-radius:0 8px 8px 0;}
  .msg.summary .role{color:#8b5cf6;display:flex;align-items:center;gap:8px;}
  .msg.summary .mono{color:var(--muted);}
  .msg.summary .mini{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer;font-weight:400;}
  .msg.summary .mini:hover{border-color:var(--bad);color:var(--bad);}
  .tail-note{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--soft);border:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.6;}
  .trace-hd{margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px;font-weight:600;}
  .tk{font-weight:400;font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);
    border-radius:999px;padding:1px 8px;}
  .tstep{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden;}
  .tstep .th{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:6px 10px;background:var(--soft);
    font-size:12px;font-weight:600;border-bottom:1px solid var(--line);}
  .tstep .tb{padding:8px 10px;}
  .lbl{font-size:11px;color:var(--muted);margin:7px 0 3px;letter-spacing:.02em;}
  .lbl:first-child{margin-top:0;}
  .think{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:var(--muted);
    background:var(--soft);border-left:2px solid #8b5cf6;border-radius:0 6px 6px 0;padding:6px 9px;
    max-height:22vh;overflow:auto;}
  .call{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--soft);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:4px 0;word-break:break-all;line-height:1.55;}
  .call b{color:var(--accent);}
  .res{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;border:1px dashed var(--line);
    border-radius:6px;padding:5px 8px;margin:4px 0;white-space:pre-wrap;word-break:break-word;
    max-height:24vh;overflow:auto;color:var(--muted);line-height:1.55;}
  .out{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;}
  /* 输出跟「思考」用同一个块（用户 m33573 图1：同一段轨迹里一个紫块一个绿卡，两个长相），
     只把左边条和字色换掉，字号/行高/内边距/圆角全部一致 */
  .think.out-blk{border-left-color:#10b981;color:var(--text);max-height:32vh;}
  /* 长内容只随页面滚动，轨迹和系统文本不再各套一层内滚动。 */
  .think,.think.out-blk,.res,.sysbox pre{max-height:none;overflow:visible;}
.grow{flex:1;}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;}
button:hover{border-color:var(--accent);color:var(--accent);}
button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
button.mini{padding:2px 8px;font-size:12px;border-radius:6px;}
/* 用户 m19731：「重载」并进导航胶囊当第三段，用紫色跟「页面切换」的蓝色区分开，
   前面加刷新图标，中间一条竖线说明它是动作不是页面。 */
.navseg .navsep{width:1px;height:16px;background:var(--line);margin:0 3px;flex:none;}
.navbtn.nav-reload{display:inline-flex;align-items:center;gap:5px;padding:0 12px;color:var(--reload);background:var(--reload-soft);font-weight:600;}
.navbtn.nav-reload svg{width:13px;height:13px;display:block;flex:none;}
.navbtn.nav-reload:hover{color:#fff;background:var(--reload);}
.navbtn.nav-reload:disabled{opacity:.55;cursor:default;color:var(--reload);background:var(--reload-soft);}
button.icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border-radius:7px;color:var(--muted);flex:none;}
button.icon svg{width:15px;height:15px;display:block;}
button.icon:hover{color:var(--accent);border-color:var(--accent);background:rgba(59,130,246,.10);}
button.icon.danger{color:var(--bad);}
button.icon.danger:hover{color:#fff;background:var(--bad);border-color:var(--bad);}
/* 滑动开关：左关右开 */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;color:var(--muted);}
.sw .tr{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:.18s;flex:none;}
.sw .tr:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.18s;}
.sw.on .tr{background:var(--accent);}
.sw.on .tr:after{transform:translateX(18px);}
/* 折叠柱子开关（用户 m02038 第 1 条）：比通用开关大一号，白色圆改成椭圆，
   椭圆里直接写「展开 / 折叠」，就不用再在外面写「折叠柱子」四个字了。 */
.sw.sw-fold .tr{width:58px;height:24px;}
.sw.sw-fold .tr:after{width:34px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#1f2937;letter-spacing:.02em;content:"展开";}
.sw.sw-fold.on .tr:after{content:"折叠";transform:translateX(20px);}
/* 用户 m19542 第 1 条：启用 / 自动刷新 也做成折叠柱子那种「字写在轨道里」的开关，
   轨道里直接写当前状态：关闭 / 启动、静止 / 刷新（用户 m19715：打开时显示的是状态，不是动作）。 */
.sw.sw-state .tr{width:58px;height:24px;}
.sw.sw-state .tr:after{width:34px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#1f2937;letter-spacing:.02em;}
.sw.sw-state.on .tr:after{transform:translateX(20px);}
#sw-plugin .tr:after{content:"关闭";}
html.plugin-on #sw-plugin .tr:after{content:"启动";}
#sw-auto .tr:after{content:"静止";}
#sw-auto.on .tr:after{content:"刷新";}
.sw.on{color:var(--text);}
.sw.busy{opacity:.5;pointer-events:none;}
/* 首帧引导：booting 期间禁用过渡，缓存态直接落位，刷新不再播放「自动重开」动画 */
html.booting .sw .tr,html.booting .sw .tr:after{transition:none;}
html.plugin-on #sw-plugin{color:var(--text);}
html.plugin-on #sw-plugin .tr{background:var(--accent);}
html.plugin-on #sw-plugin .tr:after{transform:translateX(20px);}
/* 会话状态点：绿=真实运行，红=运行异常，黄=排队，灰=等待或手动关闭 */
.st{display:inline-flex;align-items:center;gap:5px;flex:none;margin-left:2px;}
.st:empty{display:none;}
.st .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.st .dot.ok{background:#2fb344;box-shadow:0 0 0 2px rgba(47,179,68,.18);}
.st .dot.bad{background:#e5484d;box-shadow:0 0 0 2px rgba(229,72,77,.18);}
.st .dot.wait{background:#f5a524;}
.st b{font-weight:500;font-size:12px;}
.st b.ok{color:#2fb344;}
.st b.bad{color:#e5484d;}
.st b.wait{color:#b37b12;}
.st .dot.idle{background:var(--muted);opacity:.5;}
.st .idle{font-size:12px;color:var(--muted);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.card .k{color:var(--muted);font-size:11.5px;}
/* 用户 m11651：统计卡整体字号降一档（22→20），单位统一走 <small>（见 lib-1.js）。 */
.card .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
.card .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px;}
/* 用户 m11651：¥ 是前缀不是后缀，margin-left 会把它推离数字，单独给一条。 */
.card .v small.pre{margin-left:0;margin-right:2px;}
/* 用户 m12784：命中率写成「48%命中」，百分号是数字的一部分，不能留 3px 间距。 */
.card .v small.pct{margin-left:0;}
/* v4.68（用户 m02807）：回复 / 决策两格的主值行是三段「30次 / 17秒 / 命中87%」，
   22px 装不下，压到 17px；斜杠用淡色小一号，别抢数字的注意力。
   用户 m14836 图3：17px 跟旁边几张卡的 22px 差得太明显，提到 21px（226px 卡宽下实测 213px，
   还留 13px 余量）；斜杠再收一点，窄屏折行时也不会顶到边。 */
.card .v .vm{font-size:19px;font-weight:600;letter-spacing:0;}
.card .v .vsep{color:var(--muted);font-weight:400;font-size:13px;margin:0 4px;}
.card .metric-sep{font-size:16px;font-weight:400;color:var(--muted);margin:0 9px;}
/* 副行一律不折行（用户 m02080 图2）：原来插件数据那行会掉到第二行，卡片被撑高、右边还剩一大片空 */
.card .sub{font-size:11px;line-height:15px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
/* v4.84（用户 m09179 第 1 条）→ v4.86（用户 m11062）：插件数据卡试过「右侧七行小清单」，
   卡片被顶得比旁边六张高、字号还得压小；现在回到和其他卡一样的「标题 / 主值 / 副行」三行，
   副行只列最大的两类 + 其余合计，多的类目不再硬塞。 */
  /* 群聊/私聊那一行必须整行不折（用户 m42220）；放不下时靠下面这条缩小字距兜底 */
  .card .sub .nowrap{white-space:nowrap;display:inline-block;letter-spacing:-.2px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
/* 请求页：标题行那张卡和下面的表格贴成一块，中间不留缝（用户 m30252 图1） */
#ctx-window.linked{margin-bottom:0 !important;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none;}
#ctx-rounds.linked{border-top-left-radius:0;border-top-right-radius:0;border-top:none;margin-top:0;}
#ctx-rounds.linked .tbl table thead th:first-child{padding-left:14px;}
.tbl{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);white-space:nowrap;}
/* 用户 m13767：窗口条数那格里的「N 条」和后面的标签要锁在一行，别让标签掉到第二行。
   用户 m11430：但窄屏下这格只有 56px，锁死一行会直接压到隔壁的 token 数上（「39 条 · 图 12」盖住「8.3k」）。
   所以只在宽屏锁一行，窄屏允许折成两行。 */
@media (min-width:1701px){ .wn{white-space:nowrap;} .tprob{white-space:nowrap;} }
/* 用户 m11651：窄屏放不下时「20 条 · 图2」会断在「图」和数字中间（「· 图」/「2」），
   把后半段整体锁住，只允许在「条」后面断，变成「20 条」/「· 图2」。 */
#ctx-rounds .wn .dim{white-space:nowrap;}
/* 窄屏折行时「概率」两个字别被拆开（默认 CJK 任意两字之间都能断，会断成「17.6% 概」/「率」）。 */
.tprob{word-break:keep-all;}
.tag.cut{background:rgba(6,182,212,.14);color:#0e7490;border-color:rgba(6,182,212,.45);}
html[data-theme="dark"] .tag.cut{background:rgba(6,182,212,.22);color:#67e8f9;}
.tag.ok{color:var(--ok);border-color:var(--ok);}
.tag.bad{color:var(--bad);border-color:var(--bad);}
.tag.warn{color:var(--warn);border-color:var(--warn);}
.empty{padding:36px;text-align:center;color:var(--muted);}
/* v3.15（用户 m40335）：窗口被重置、还没等到新消息时的居中提示 */
.waitbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:72px 20px;text-align:center;}
.waitbox .wbi{width:34px;height:34px;border-radius:50%;border:1px dashed var(--line);

.mgrp > .mc:hover{background:rgba(0,0,0,.035);}

.mgrp-hd{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:8px;align-items:center;padding:6px 10px 1px;}

.mgrp-hd .gh-av.skip-av{background:var(--soft);color:var(--muted);font-size:13px;}

/* 用户 m06193：用户黑名单——名字后面 hover 出「拉黑」；拉黑后整组默认折叠，组头留「已拉黑 + 展开」 */
.mgrp-hd .gh-blk{display:none;height:20px;padding:0 8px;border-radius:999px;font-size:11px;line-height:18px;
  border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer;flex:0 0 auto;}
.mgrp-hd:hover .gh-blk{display:inline-block;}
.mgrp-hd .gh-blk:hover{border-color:var(--bad);color:var(--bad);}
.mgrp-hd .gh-blk.on{display:inline-block;border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.12);
  color:#b45309;cursor:default;}
html[data-theme="dark"] .mgrp-hd .gh-blk.on{color:#fbbf24;}
.mgrp-hd .gh-exp{height:20px;padding:0 8px;border-radius:999px;font-size:11px;line-height:18px;
  border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer;flex:0 0 auto;}
.mgrp-hd .gh-exp:hover{border-color:var(--accent);color:var(--accent);}
.mgrp.blk:not(.open) > .mc{display:none;}
.mgrp > .mc.user,.mgrp > .mc.assistant,.mgrp > .mc.system{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:8px;align-items:start;padding:2px 10px 3px;}
.mgrp > .mc.user > .mc-hd,.mgrp > .mc.assistant > .mc-hd,.mgrp > .mc.system > .mc-hd{grid-column:1;padding:0;background:transparent;border:0;min-height:0;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.mgrp > .mc.user > .mc-hd .k:not(.you),.mgrp > .mc.assistant > .mc-hd .k:not(.you){padding:0;background:none;border:0;font-size:11px;color:var(--muted);}
.mgrp > .mc.user > .mc-bd,.mgrp > .mc.assistant > .mc-bd,.mgrp > .mc.system > .mc-bd{grid-column:2;padding:0;}
/* v3.60（用户 m17581 第 7 条）：组内工具卡（「tool search 5 条结果 …」那一条和它下面的结果列表）
   自己不占 46px 时间列，于是标题与结果比正文靠左 52px。给它补上与时间列等宽的缩进（46 + 8 间距），
   卡片内边距也归零，标题与结果就都从正文那一列开始。 */
.mgrp > .mc.tool{margin-left:64px;}
.mgrp > .mc.tool > .mc-hd{padding:3px 0 1px;}
.mgrp > .mc.tool > .mc-bd{padding:0 0 5px;}
/* v3.60（用户 m17581 第 5 条）：只有工具调用、没有正文的 assistant 卡片，左列时间原来比「调用 …」
   那行高 5px——正文首行是 22px 的文本行，这里的首行是 20px 的调用行且带 3px 上边距。 */
.mgrp > .mc.callonly > .mc-hd{position:relative;top:3px;}
.mgrp > .mc.callonly > .mc-bd > .tcall-wrap:first-child{margin-top:0;}
/* 左列时间：整块 22px 垂直居中，和正文首行同高；日期为空时不占行（v2.85） */
.mgrp > .mc .mts{display:flex;flex-direction:column;justify-content:center;align-self:start;height:22px;line-height:11px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}
.mgrp > .mc .mts .d{font-size:9.5px;line-height:11px;opacity:.72;letter-spacing:-.2px;}
.mgrp > .mc .mts .t{line-height:11px;}
.mc-bd .mixnote{margin-top:3px;font-size:10px;line-height:14px;color:var(--muted);opacity:.85;}
/* 用户 m13250 第 1 条：机器人卡片（.botcard）不再单独一套网格——它本来就带 .mc.user，
   直接吃上面那条「左列 46px 时间 / 右列正文」，和 user 消息长得一模一样。
   组内只剩左列时间，徽章与 @ 谁挪进正文，见 botCardHtml。 */
.tbl td .est{color:var(--muted);}
/* v3.62（用户 m18059 第 1 条）：步数胶囊原来贴在格子最右边，离「入 / 出」隔着一大段留白。
   现在数字单独一层绝对居中（tokw），胶囊挂在数字右侧 5px 处，数字仍是纯居中、单步多步位置一致。 */
.tbl td.tokc{position:relative;}
.tbl td.tokc .tokw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;}
.tbl td.tokc .stp{position:absolute;left:100%;top:50%;margin-left:4px;transform:translateY(-50%);padding:1px 6px;border-radius:999px;
  background:var(--soft);color:var(--muted);font-size:10.5px;line-height:14px;white-space:nowrap;font-weight:400;}
/* 按步标注用的小标签（命中预估 / 缓存命中前的「1步」），比数字淡一档 */
.tbl td .slbl{color:var(--muted);font-size:10.5px;margin-right:1px;}
.gh-note{font-size:10.5px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seqh .mini{order:-1;}
  .seqh .tk{font-size:11px;font-weight:400;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;}
.tbl td .sub{margin-top:2px;font-size:10px;line-height:13px;color:var(--muted);white-space:nowrap;}
.mdbox{font-size:12.5px;line-height:1.62;}
.mdh{font-size:12.5px;font-weight:600;margin:10px 0 4px;color:var(--fg);}
.mdh:first-child{margin-top:0;}
.mdp{margin:0 0 6px;white-space:pre-wrap;word-break:break-word;}
.mdli{margin:0 0 3px;padding-left:12px;position:relative;white-space:pre-wrap;word-break:break-word;}
.mdli:before{content:"\00b7";position:absolute;left:2px;color:var(--muted);}
/* 用户 m26166：源码里空行隔开的块，美化后也空一行（一个行高 ≈ 20px） */
.mdbox .mdgap{margin-top:20px;}
.mdbox b{font-weight:600;color:var(--fg);}
.mdbox code.ic{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.06);}
/* 字数紧贴正文末尾的小气泡（用户 m31639） */
.chb{display:inline-block;margin-left:6px;padding:0 5px;border-radius:8px;background:rgba(0,0,0,.06);font-size:10px;line-height:15px;color:var(--muted);vertical-align:1px;white-space:nowrap;}
.chb + .chb{margin-left:4px;}
/* 折叠按钮已写字数时，仅隐藏紧邻的重复字数；展开/自动取消折叠后恢复。 */
.mono.clip + .more[data-label$=" 字）"] + .chb.count,.mono.clip .chb.count{display:none;}
.chb:first-child{margin-left:0;}
/* 待发状态（待发/刚发出/计入/连发/太短）也做成气泡，跟字数气泡一个长相（用户 m32370） */
.chb.tag{background:rgba(59,130,246,.13);color:#1d4ed8;}
.chb.tag.pendtag{background:var(--soft);color:var(--muted);}
.chb.tag.skiptag{background:var(--soft);color:var(--muted);}
/* 用户 m32048 第 1 条：明细页单独列一行「未进入上下文 N 条」，虚线小标签，
   跟正文区分开——这些消息收到了但没发给模型，①②③ 里都找不到它们。 */
.hint.skipnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px;}
.hint.skipnote b{font-weight:600;color:var(--muted);}
.hint.skipnote .skiphit{padding:1px 7px;border:1px dashed var(--muted);border-radius:6px;

  text-overflow:ellipsis;white-space:nowrap;}
.chb.tag.mk.ok{background:rgba(16,185,129,.14);color:#047857;}
.chb.tag.mk.no{background:rgba(0,0,0,.06);color:var(--muted);}
/* 用户 m05993 第 2 条：「过滤」要跟别的 no 标（连发/太短/休息…）区分开，用琥珀色高亮。 */
.chb.tag.mk.flt{background:rgba(245,158,11,.16);color:#b45309;}
html[data-theme="dark"] .chb{background:rgba(255,255,255,.10);}
html[data-theme="dark"] .chb.tag{background:rgba(59,130,246,.22);color:#93c5fd;}
html[data-theme="dark"] .chb.tag.pendtag{background:var(--soft);color:var(--muted);}
html[data-theme="dark"] .chb.tag.skiptag{background:var(--soft);color:var(--muted);}
html[data-theme="dark"] .chb.tag.mk.ok{background:rgba(16,185,129,.22);color:#6ee7b7;}
html[data-theme="dark"] .chb.tag.mk.flt{background:rgba(245,158,11,.22);color:#fbbf24;}
html[data-theme="dark"] .mgrp.user{background:rgba(59,130,246,.18);}
html[data-theme="dark"] .mgrp.assistant{background:rgba(16,185,129,.18);}
html[data-theme="dark"] .mgrp.tool{background:rgba(245,158,11,.14);}
html[data-theme="dark"] .mgrp.system,html[data-theme="dark"] .mgrp.summary{background:rgba(139,92,246,.18);}
html[data-theme="dark"] .mgrp > .mc + .mc{border-top-color:rgba(255,255,255,.10);}
html[data-theme="dark"] .mgrp > .mc .mc-hd .k{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.10);}
html[data-theme="dark"] .mgrp-hd .gh-nm{color:var(--fg);}
/* v4.32：决策注记只高亮名字，仍是普通 assistant 消息。 */
.mgrp-hd .gh-nm.dec-name{color:#7c3aed;font-weight:700;}
html[data-theme="dark"] .mgrp-hd .gh-nm.dec-name{color:#c4b5fd;}
.mc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);}
.mc-hd .rq{font-weight:700;color:var(--text);font-size:12px;}

.mc-bd .seg{margin-bottom:8px;}

.emoji{display:inline-flex;align-items:center;vertical-align:-7px;margin-right:3px;}

.emoji .em-img{width:26px;height:26px;display:block;}

.emoji.miss .em-img{display:none;}
.emoji.miss .em-txt{display:inline;}

.mc .more{margin-top:6px;font-size:11px;color:var(--accent);cursor:pointer;user-select:none;display:block;width:max-content;margin-left:0;border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--card);}

/* 原文模式 */
.rawhd{display:flex;align-items:center;gap:8px;margin:14px 0 6px;padding:6px 10px;background:var(--soft);border-radius:8px;font-size:12.5px;font-weight:600;}

.rawblk .rl{color:var(--muted);}
.rawblk.full{max-height:none;overflow:visible;}
/* ---- 美化档细节（v2.19） ---- */
.mc{transition:border-color .12s,box-shadow .12s;}
.mc:hover{border-color:var(--muted);}
/* 窗口里悬停一条消息才出现的「拉黑」（v3.36 用户第 13 条）：点了把整条消息塞进
   这个群的「不触发短语」清单，和设置页里那张表是同一份。按钮挂成 .mc 的绝对定位子元素，
   组内卡片的左列只有 46px，塞不进 hd 里。已在清单里的常驻显示「已拉黑」。 */
.mc{position:relative;}
/* 拉黑按钮改挂在头部标签行里（用户 m01011 第 3 条：要跟在「字数」这类小标签后面，
   不是浮在卡片最右边那一个）。组内卡片头部只有一列时间，也照样跟在时间后面。 */
/* 用户 m01522 第 2 条：组内卡片头部只有一列时间（没有标签行），按钮挂 hd 会掉到时间下面、
   离正文好几行。那种卡改挂正文末尾（字数气泡之后），所以选择器不能只认 .mc-hd。 */
/* 用户 m12893：「拉黑」以前是 11px 字 + 16px 行高 + 1px 内边距 + 1px 边框，算下来 20px 高，
   旁边的字数气泡只有 15px，一行里高矮不齐、圆角也不一样（6 对 8），看着像临时贴上去的。
   现在跟 .chb 同一套尺寸：10px 字、13px 行高 + 1px 边框 = 15px、圆角 8px，
   边框画在盒子里不额外撑高，底边跟气泡对齐；底色留空，靠悬停变琥珀色表示可点。 */
.mc .mc-blk{display:none;margin-left:6px;vertical-align:1px;padding:0 6px;border-radius:8px;
  border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:10px;line-height:13px;
  cursor:pointer;user-select:none;white-space:nowrap;}
.mc:hover .mc-blk{display:inline-block;}
.mc .mc-blk:hover{color:#b45309;border-color:#f59e0b;background:rgba(245,158,11,.10);}
.mc .mc-blk.on{display:inline-block;color:#b45309;border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.12);}
html[data-theme="dark"] .mc .mc-blk:hover,html[data-theme="dark"] .mc .mc-blk.on{color:#fbbf24;border-color:rgba(245,158,11,.6);}
/* 用户 m12463：折起来的时候字数气泡跟「展开/收起」排在同一行，展开后气泡回到正文末尾。
   以前气泡在 .mono 里、按钮在 .mono 外面，字数 / 收起 / 拉黑散成两三行。 */
.mc-bd .mc-tail{display:flex;align-items:center;gap:6px;margin-top:6px;}
.mc-bd .mc-tail .chb,.mc-bd .mc-tail .mc-blk{margin-left:0;}
.mc-bd .mc-tail .more{margin-top:0;}
.mc-bd .mono.clip + .mc-tail .chb.count{display:none;}
/* 用户 m12469：字数气泡包在一个 nowrap 的壳里，浏览器不能从中间断行。

   不能占位——以前用 visibility 隐藏，字数后面永远空一块。现在回到 .mc .mc-blk 的
   display:none 与 .mc:hover 的 inline-block，按钮出现时整行重排一次，这是要的。 */
.mc-tags{display:inline-block;white-space:nowrap;vertical-align:1px;}
.mc-hd .k.weak{opacity:.6;font-weight:400;}

html[data-theme="dark"] .k.you{background:rgba(245,158,11,.26);border-color:rgba(245,158,11,.5);color:#fbbf24;}

/* v4.19（用户 m21126 图1）：框架只给被引用消息的 id，本地查不到原话时也要有框 */
.mc-bd .quote .qmiss{font-size:11.5px;color:var(--muted);opacity:.7;word-break:break-all;}
/* 用户 m12814：点引用块跳到被引用的那条消息——当前视图里有就滚过去，没有就去那一轮快照里找 */
.mc-bd .quote[data-qjump]{cursor:pointer;transition:background .12s,border-left-color .12s;}
.mc-bd .quote[data-qjump]:hover{background:var(--soft);border-left-color:var(--accent);}
/* 回查要扫几百份快照，等的时候压暗一点，别让人以为点了没反应 */
.mc-bd .quote[data-qjump].qjump-busy{opacity:.5;}
/* 跳过去之后闪一下，让人看清落在哪一条 */
.mc.mid-flash{animation:midflash 1.5s ease-out;}
@keyframes midflash{0%{box-shadow:0 0 0 2px var(--accent);}70%{box-shadow:0 0 0 2px var(--accent);}100%{box-shadow:0 0 0 2px transparent;}}
/* v4.18（用户 m20749 图2）：引用里的小程序分享框架只留了「[QQ小程序]标题」一行纯文本，
   还原不出原卡，画成和分享卡同一套的小卡，别再让方括号字面量露在引用里 */
.mc-bd .qmini{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;margin-top:1px;
  border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.02);}
.mc-bd .qmini-ic{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(59,130,246,.13);
  color:#1d4ed8;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;}
.mc-bd .qmini-bd{display:flex;flex-direction:column;gap:2px;min-width:0;}
.mc-bd .qmini-t{font-size:12.5px;line-height:1.45;color:var(--text);word-break:break-word;}
.mc-bd .qmini-d{font-size:11px;color:var(--muted);}
.mc-bd .qmini-tag{display:inline-block;padding:0 5px;border-radius:6px;background:rgba(59,130,246,.12);
  color:#1d4ed8;font-size:11px;}
html[data-theme="dark"] .mc-bd .qmini{background:rgba(255,255,255,.04);}
html[data-theme="dark"] .mc-bd .qmini-ic{background:rgba(59,130,246,.22);color:#93c5fd;}
html[data-theme="dark"] .mc-bd .qmini-tag{background:rgba(59,130,246,.22);color:#93c5fd;}
/* v4.22（用户 m21783）：文件消息画成文件卡——图标 + 文件名 + 大小，仿 QQ 那张卡 */
.mc-bd .fcards{display:flex;flex-direction:column;gap:6px;margin-top:5px;}
.mc-bd .fcard{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);max-width:330px;}
.mc-bd .fcard .fico{flex:none;width:30px;height:30px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-size:15px;line-height:1;background:rgba(59,130,246,.12);}
.mc-bd .fcard .fmain{display:flex;flex-direction:column;gap:1px;min-width:0;}
.mc-bd .fcard .fname{font-size:12.5px;line-height:1.4;color:var(--text);word-break:break-all;}
.mc-bd .fcard .fsub{font-size:11px;color:var(--muted);}
html[data-theme="dark"] .mc-bd .fcard .fico{background:rgba(59,130,246,.22);}
.mc-bd .fwd{margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;}
.mc-bd .fwd-hd{padding:4px 9px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft);display:flex;align-items:center;gap:6px;}
.mc-bd .fwd-b{padding:4px 9px 5px;display:flex;flex-direction:column;gap:2px;}
.mc-bd .fwd-it{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:11.5px;line-height:17px;}
.mc-bd .fwd-it .fw-w{color:var(--muted);flex:none;}
.mc-bd .fwd-it .fw-t{color:var(--muted);opacity:.7;font-size:10px;flex:none;}
/* m24522 ④⑥：转发条目里的 [图片]/[表情] 以前原样留一段灰字，卡片里又没图可看，
   看着就是多出来的占位。改成一颗小图标 chip，不占行宽也不再重复写「[图片]」。 */
.fw-pic{display:inline-block;font-size:10.5px;line-height:15px;padding:0 5px;border-radius:6px;
  background:rgba(127,127,127,.16);color:var(--muted);margin:0 2px;vertical-align:1px;}
.mc-bd .fwd-it .fw-c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* v4.48（用户 m25038 第 4 项）：预览行末尾露几张真图，尺寸压到 22px，行高不变 */
.fw-ims{display:inline-flex;gap:2px;margin-left:4px;vertical-align:-7px;}
.mc-bd .fwd-hd .fw-ims{margin-left:auto;vertical-align:middle;}
.fw-ims .fw-im{width:22px;height:22px;object-fit:cover;border-radius:4px;cursor:zoom-in;
  background:rgba(127,127,127,.18);flex:none;}
/* v4.90（用户 m02939 图5）：卡片里「🖼×36」和旁边 3 张缩略图并排，看着像 36 之外还有 3 张。
   补一句「已发 3」说明缩略图就是这 36 张里已经拿到手的那几张。 */
.fw-sent{color:var(--muted);opacity:.75;font-size:10px;margin-left:2px;}
  /* 嵌套转发小卡（用户 m14708 图2）：框架格式化时把内层 Forward 从链里剔掉
     （message_formatter.py:198），那条只剩「时间 昵称:」空尾巴。以前按 QQ 的样子
     给它补 [图片]，结果占掉下一张图的槽位——猪头贴纸跑到第一条下面去了。
     现在画成一张小卡：一行「合并转发 N 条」+ 后端爬到的一行摘要，不再参与图片认领。 */
  .mc-bd .fwd-sub{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;padding:1px 7px;
    border:1px solid var(--line);border-radius:6px;background:var(--soft);font-size:11px;line-height:16px;}
  .mc-bd .fwd-sub .fwb{color:var(--accent);flex:none;}
  .mc-bd .fwd-sub .fwp{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Native no-URL video cards also live in the detached Forward popup. */
:is(.mc-bd,.fwd-pop) .qcard.video{display:flex;flex-direction:column;max-width:420px;min-width:0;
  margin:0 0 7px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);
  overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04);cursor:default;text-decoration:none;}
:is(.mc-bd,.fwd-pop) .qcard.video .qc-row{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;min-width:0;}
:is(.mc-bd,.fwd-pop) .qcard.video .qc-logo{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;flex:none;border-radius:9px;background:var(--soft);border:1px solid var(--line);}
:is(.mc-bd,.fwd-pop) .qcard.video .qc-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
:is(.mc-bd,.fwd-pop) .qcard.video .qc-t{font-size:13px;font-weight:600;line-height:1.45;
  white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
:is(.mc-bd,.fwd-pop) .qcard.video .qc-ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-top:1px solid var(--line);background:var(--soft);padding:5px 11px 6px;}
:is(.mc-bd,.fwd-pop) .qcard.video :is(.video-kind,.video-reason,.video-state){font-size:11px;line-height:16px;color:var(--muted);}
:is(.mc-bd,.fwd-pop) .qcard.video .video-state{margin-left:auto;white-space:nowrap;}
/* Only the video itself is compact; unrelated Forward rows keep their height. */
:is(.mc-bd,.fwd-pop) .qcard.video.video-compact{display:inline-flex;flex-direction:row;align-items:center;gap:5px;
  max-width:100%;padding:1px 6px;margin:0;vertical-align:middle;border-radius:6px;box-shadow:none;}
:is(.mc-bd,.fwd-pop) .qcard.video.video-compact .qc-t{display:block;max-width:180px;min-width:0;
  font-size:11px;line-height:16px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
:is(.mc-bd,.fwd-pop) .qcard.video.video-compact :is(.video-icon,.video-state){flex:none;margin:0;}
:is(.mc-bd,.fwd-pop) .qcard.video.video-compact .video-kind{display:none;}
.mc-bd .at{display:inline-block;white-space:nowrap;padding:0 5px;margin:0 1px;border-radius:8px;background:rgba(59,130,246,.14);color:#1d4ed8;font-weight:600;font-size:.94em;line-height:16px;vertical-align:1px;}
html[data-theme="dark"] .mc-bd .at{background:rgba(59,130,246,.26);color:#93c5fd;}
    /* 分享卡（v3.22 用户 m42531 图4/图5）：左图标、右标题+描述、脚下来源与「打开」，

    /* 抖音分享卡（用户 m16357 图1）：以前整段「7.61 复制打开抖音，看看… # 猫猫 # 布偶猫…
        https://v.douyin.com/xxx/ hbN:/ 11/26 :7pm B@T.LJ」当纯文本铺。这里认出链接就画成一张卡：

    .mc-bd .qcard.dycard .qc-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    /* 位置分享卡（用户 m11820 图1/图2）：左边一块地图示意（纯装饰，不是真实地图截图），
       右边地址 + 「位置分享」。以前只显示 app 名 com.tencent.map 和带前缀的 [位置]地址。 */
    .mc-bd .qcard.loc .qcmap{flex:none;border-radius:10px;display:block;box-shadow:inset 0 0 0 1px rgba(16,24,40,.06);}

    /* 转发里一条都没解出来时（框架只给了 {"type":"forward"}）如实说明，不铺空表格 */
    .mc-bd .fwd-note{padding:1px 0;font-size:11.5px;line-height:1.65;color:var(--muted);white-space:normal;}
/* v3.61（用户 m17581 第 1 条）：合并转发只拿到空壳时的占位——一行灰底提示，别画成空转发卡。 */
.mc-bd .fwd-miss{display:inline-block;padding:0 6px;border-radius:6px;background:var(--soft);
  color:var(--muted);font-size:11.5px;line-height:18px;}
    /* 转发卡默认只露前 3 条、第 3 条留半截，底部渐变盖住；点一下才看全部
       （用户 m01011 第 2 条）。折叠高度由 fitForwardCards() 按实际行高量出来。 */
    .mc-bd .fwd[data-fwd] .fwd-b{overflow:hidden;position:relative;}
    .mc-bd .fwd[data-fwd] .fwd-b::after{content:"";position:absolute;left:0;right:0;bottom:0;
      height:22px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--card));pointer-events:none;}
    /* 用户 m03273：卡里只有预览，图片全在弹层模板里，不再需要按 .open 藏图；
       条目少（.short）时底部渐变也不画，别盖住最后一行文字。 */
    .mc-bd .fwd.short .fwd-b::after{display:none;}
    /* 用户 2026-10-24 图6：卡下面不再写「点击查看内容」，整张卡就是入口 */
    .mc-bd .fwd[data-fwd]{cursor:pointer;}
    .mc-bd .fwd[data-fwd] .fwd-hd{transition:color .15s;}
    .mc-bd .fwd[data-fwd]:hover .fwd-hd{color:var(--accent);}
    /* 转发弹层（用户 m03273）：点「点击查看内容」弹大框看完整条目，图文按原顺序排；
       卡里只留前 3 条预览，图片搬进弹层里跟各自条目走 */
    .fwd-pop{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;}
    .fwd-pop[hidden]{display:none;}
    .fwd-pop .fp-mask{position:absolute;inset:0;background:rgba(0,0,0,.46);}
    .fwd-pop .fp-box{position:relative;display:flex;flex-direction:column;width:min(720px,94vw);
      max-height:min(82vh,760px);background:var(--card);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;box-shadow:0 18px 52px rgba(0,0,0,.3);}
    .fwd-pop .fp-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;font-weight:600;
      border-bottom:1px solid var(--line);background:var(--soft);}
    .fwd-pop .fp-x{margin-left:auto;width:24px;height:24px;line-height:1;border:0;border-radius:6px;
      background:transparent;color:var(--muted);font-size:17px;cursor:pointer;}
    .fwd-pop .fp-x:hover{background:var(--line);color:var(--text);}
    .fwd-pop .fp-bd{overflow:auto;padding:6px 14px 14px;}
    .fwd-pop .fp-it{padding:9px 0;border-bottom:1px dashed var(--line);}
    .fwd-pop .fp-it:last-child{border-bottom:0;}
    .fwd-pop .fp-meta{display:flex;align-items:baseline;gap:6px;font-size:11.5px;line-height:17px;}
    .fwd-pop .fp-meta .fw-w{color:var(--text);font-weight:600;}
    .fwd-pop .fp-meta .fw-t{color:var(--muted);opacity:.75;font-size:10.5px;}
    .fwd-pop .fp-tx{margin-top:2px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;
      word-break:break-word;color:var(--text);}
    .fwd-pop .fwd-sub{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;margin-top:2px;
      padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--soft);
      font-size:11.5px;line-height:18px;white-space:normal;}

    .fwd-pop .fp-it .thumbs{display:flex;flex-wrap:wrap;margin:7px 0 0;gap:8px;}
    /* 用户 m03343 第 1 条：弹层里的图不能按原图尺寸铺开（大图会把框撑破、也关不掉）。
       这里按原比例自适应：限宽 100%、限高 min(240px,40vh)，等比缩小，不裁切。 */
    .fwd-pop .fp-it .thumb{display:block;width:auto;height:auto;max-width:100%;
      border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);cursor:zoom-in;}
    .fwd-pop .fp-it .thumb img{display:block;width:auto;height:auto;max-width:100%;
      max-height:min(240px,40vh);object-fit:contain;}
    /* 弹层不在 .mc-bd 里，占位块要自己给尺寸，不然「已清理」会缩成一条空缝 */
    .fwd-pop .fp-it .thumb.bad{width:104px;height:104px;display:flex;align-items:center;justify-content:center;
      border-style:dashed;color:var(--muted);}
    .fwd-pop .fp-it .thumb.bad::after{content:"图片\A已清理";white-space:pre;font-size:11px;line-height:1.3;text-align:center;}
    body.fwd-pop-open,body.img-pop-open{overflow:hidden;}
    /* 点任意一张图就地看大图（用户 m03343 第 2 条）：不再开新标签页。
       大图按比例缩进视口（94vw / 88vh 封顶），只缩不放，透明底也不铺白。 */
    .img-pop{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;}
    .img-pop[hidden]{display:none;}
    .img-pop .ip-mask{position:absolute;inset:0;background:rgba(0,0,0,.62);}
    .img-pop .ip-box{position:relative;display:flex;align-items:center;justify-content:center;

    /* 用户 m10400：长图在 86vh 里被压扁，看不清。图本身仍按自适应尺寸排版，

    .img-pop .ip-img{display:block;max-width:100%;max-height:86vh;width:auto;height:auto;
      object-fit:contain;border-radius:10px;background:var(--card);box-shadow:0 18px 52px rgba(0,0,0,.45);

    .img-pop.dragging .ip-img{cursor:grabbing;}

    /* 关闭按钮收进图片右上角内侧：深色半透明底 + 白 ×（用户 m03561：悬在外面的白圆点很难看） */
    .img-pop .ip-x{position:absolute;top:10px;right:10px;width:30px;height:30px;padding:0;z-index:3;
      display:flex;align-items:center;justify-content:center;line-height:1;
      border:0;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:19px;font-family:inherit;
      cursor:pointer;opacity:.82;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);

      transition:background .15s ease,opacity .15s ease;}
    .img-pop .ip-x:hover,.img-pop .ip-x:focus-visible{background:rgba(0,0,0,.68);opacity:1;outline:none;}
    .img-pop .ip-note{display:none;padding:18px 22px;border-radius:10px;background:var(--card);
      color:var(--muted);font-size:12.5px;box-shadow:0 18px 52px rgba(0,0,0,.3);}
    /* 底部缩放条（用户 m10400）：缩小 / 当前比例 / 放大，右边是 1:1 与自适应两个还原按钮。
       浮在遮罩上，不占图片位置；点它不触发「点空白关闭」。 */
    .img-pop .ip-bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;
      background:rgba(0,0,0,.58);color:#fff;font-size:12px;line-height:1;z-index:3;

      box-shadow:0 0 0 1px rgba(255,255,255,.14),0 6px 22px rgba(0,0,0,.42);}
    .img-pop .ip-bar[hidden]{display:none;}
    .img-pop .ip-btn{min-width:26px;height:26px;padding:0 9px;border:0;border-radius:999px;

      cursor:pointer;transition:background .15s ease,opacity .15s ease;}
    .img-pop .ip-btn:hover,.img-pop .ip-btn:focus-visible{background:rgba(255,255,255,.28);outline:none;}
    .img-pop .ip-btn[disabled]{opacity:.32;cursor:default;}

    .img-pop .ip-btn-t{font-size:11.5px;letter-spacing:.2px;}

    /* 图片缩略图：点开看原图 */
    .mc-bd .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}

    /* 被引用的那张图（用户 m01522 图1/图5）：画在引用块内部，别再浮到卡片外面 */

       占位块尺寸和缩略图一致，写明是已经清理掉的图。 */
    .mc-bd .thumb.bad{display:flex;align-items:center;justify-content:center;

/* v3.60（用户 m17581 第 6 条）：选中柱的描边（2px + 外扩 1px）原来被容器的 overflow 裁掉——按满高画的柱子
   正好顶到内容区上边缘，左右第一根也贴着边，所以绿柱的框看起来缺一段。上下各留 8px、左右留 4px 给描边；
   内容高度仍是 54（64 − 8 上 − 1 下 − 1 边框），柱子比例一点没变。 */
/* v3.63（用户 m18492 图5）：裁切线原来画在滚动容器里，跟着柱子一起滚走了；滚到头以后滚轮还会把整页滚起来。
   结构拆成 .trend（定位框，overflow 可见，不滚）> .trend-in（真正横向滚的那条）+ .tline（画在 .trend 上，不随滚动）。
   描边留白（上 8、左右 4、下 1）跟着挪进 .trend-in，柱子高度仍是 54，比例没变。 */
.trend{margin:10px 12px 2px;position:relative;height:64px;overflow:visible;border-bottom:1px solid var(--line);}
.trend-in{height:100%;display:flex;align-items:flex-end;gap:3px;padding:8px 4px 1px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;}
.trend-in::-webkit-scrollbar{display:none;width:0;height:0;}
.trend .bar{flex:0 0 auto;width:26px;background:var(--line);border-radius:2px 2px 0 0;transition:background .15s;cursor:pointer;}
.trend .bar:hover{background:var(--muted);}
.trend .bar.ok:hover{background:var(--accent);opacity:.75;}
.trend .bar.ok{background:var(--accent);}
.trend .bar.no{background:#94a3b8;}
.trend .bar.no:hover{background:#64748b;}
.trend .bar.error{background:var(--bad);}
.trend .bar.error:hover{opacity:.75;}
.trend .bar.pending{background:var(--warn);}
.tag.neutral{color:var(--muted);border-color:var(--line);}
/* v3.90（用户 m05623 第 1 条）：裁切快照在「触发」列挂「待发 N」，虚线跟快照里那几条待发的虚线框呼应 */

/* 等待中的重试（用户 m05552 第 1 条）：跟柱状图、竖杠的 wait 同一支暖黄 */
.tag.wait{color:#b45309;border-color:#f5a524;}
/* 回复记录的结果标签跟决策记录同一套：软底胶囊，不再描边、不再带跳转箭头。 */
a.dcon{text-decoration:none;cursor:pointer;}
a.dcon:hover{text-decoration:none;filter:brightness(.97);}
#ctx-rounds .dcon.wait{border-color:rgba(245,165,36,.45);background:rgba(245,165,36,.14);color:#b45309;}
html[data-theme="dark"] #ctx-rounds .dcon.wait{color:#fcd34d;}

/* v3.99（用户 m10577）：决策轮也是一次窗口快照，柱子单独给一个紫色，别混进「未回复」的灰。 */
.trend .bar.dec,.trend .bar.dec:hover{background:#8b5cf6;box-shadow:none;}
.trend .bar.dec.sel{outline-color:#8b5cf6;}
/* v4.13（用户 m18728 第 1 条）：决策轮自己触发了裁切时，橙色要盖住紫色。
   .cut 的规则写在 .dec 前面，同特异性下会被后写的紫盖掉，所以这里单独再写一条。 */
.trend .bar.dec.cut,.trend .bar.dec.cut:hover{background:#f59e0b;}
.trend-lg .tb.dec{background:#8b5cf6;}
.trend .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--bad);opacity:.55;pointer-events:none;}
.trend .tline span{position:absolute;right:0;top:-14px;font-size:10.5px;color:var(--bad);background:var(--panel);padding:0 3px;border-radius:3px;}
.trend-hd{display:flex;align-items:center;gap:6px;margin:8px 12px 0;font-size:12px;color:var(--muted);}
.trend-hd .grow{flex:1;}
.pg{display:inline-flex;align-items:center;gap:4px;}
.pg button{background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:6px;
  padding:2px 8px;font-size:12px;cursor:pointer;line-height:1;font-family:inherit;}
.pg button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.pg button:disabled{opacity:.35;cursor:default;}
.pg .pg-i{font-size:12px;color:var(--muted);min-width:48px;text-align:center;}
@media (max-width:1000px){
  .wrap{padding:12px 12px 30px;}
  .cards{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
  .split{grid-template-columns:1fr;}
  .list{max-height:34vh;}
  th,td{padding:6px 8px;}
}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:99;}
.dlg{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35);}
.dlg h3{margin:0 0 10px;font-size:15px;}
.dlg p{margin:0 0 8px;font-size:12.5px;line-height:1.75;color:var(--muted);}
.dlg p.p2{color:var(--text);}
/* 用户 m13149：带说明块的确认弹窗（拉黑这类）加宽到 680px，说明单独成块、
   一行一条。520px 时第一句 45 个字必然折行，末行只剩几个字，很难看。 */
.dlg.wide{width:min(680px,92vw);}
.dlg.wide p.p2{margin:0 0 10px;font-size:14px;font-weight:600;}
.dlg-note{margin:0 0 4px;padding:10px 13px;border-radius:10px;border-left:3px solid var(--accent);background:var(--soft);font-size:12.5px;line-height:1.9;color:var(--muted);}
.dlg-note>div+div{margin-top:2px;}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.dlg-btns button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:12.5px;}
.dlg-btns button.danger{background:var(--bad);border-color:var(--bad);color:#fff;}

/* ===== v4.87 手机 / 窄屏适配 ==========================================
   桌面端（≥1024px）一个字都不动：下面每一条都只在 max-width:860px 生效，
   而且整块写在 .mask / .dlg 之后，同特异性时压得住上面的规则。
   目标宽度 320 / 360 / 390 / 414 / 430 / 768，任何宽度都不许横向溢出。 */
@media (max-width:1000px){
  /* --- 0. 外壳 --- */
  .wrap{padding:10px 10px 26px;}
  .panel,.card,.hbar,.list{max-width:100%;}

  /* --- 1. 顶栏：页签 / 按钮 / 开关一律 ≥40px，间距 ≥8px --- */
  header{gap:8px;margin-bottom:12px;}
  .navseg{height:44px;padding:2px;border-radius:12px;}
  .navbtn{height:40px;padding:0 14px;font-size:13px;}
  .navbtn.nav-reload{padding:0 11px;font-size:12.5px;}
  .sw{min-height:40px;gap:7px;font-size:12.5px;}
  .sw .tr{width:44px;height:26px;}
  .sw.sw-fold .tr{width:62px;}
  #subtitle{min-width:0;font-size:11.5px;}

  /* --- 2. 健康条 --- */
  .hbar{gap:8px;padding:8px 10px;font-size:12px;}
  .hbar button{min-height:40px;padding:0 12px;font-size:12.5px;}

  /* --- 3. 统计卡：140px 一列——320–430 正好两列，768 平板自动回到 5 列，跟桌面一个观感。
     主值「30次 / 17秒 / 命中87%」三段在 320px 两列里装不下 17px，允许折行 --- */
  .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
  .card{padding:10px 11px;border-radius:11px;}
  .card .k{font-size:11.5px;}
  .card .v{font-size:19px;}
  .card .v .vm{font-size:14.5px;display:inline-flex;flex-wrap:wrap;align-items:baseline;
    column-gap:4px;row-gap:0;max-width:100%;}
  .card .v .vsep{display:none;}
  .card .sub{font-size:10.5px;}

  /* --- 4. 会话列表：限高 30vh 自己滚；悬停才显形的按钮在触摸屏上常显并撑到 40px --- */
  .split{gap:10px;}
  .list{position:static;max-height:30vh;overscroll-behavior:contain;
    box-shadow:inset 0 -14px 12px -12px rgba(0,0,0,.16);}
  .list .it{padding:8px 10px 9px;}
  .list .it .nm-row{gap:6px;}
  .list .it .avw{width:30px;height:30px;}
  .list .it .nm{font-size:15px;}
  .list .it .icon{width:36px;height:36px;opacity:.5;position:relative;}
  .list .it .icon::before{content:"";position:absolute;inset:-2px;border-radius:9px;}
  .list .it .foldb{opacity:.5;margin-left:0;}
  .list .it .swm{width:40px;height:24px;margin-left:0;}
  .list .it .swm::after{width:16px;height:16px;top:4px;left:4px;}
  .list .it .swm.on::after{transform:translateX(16px);}
  /* 24px 的开关视觉尺寸不变，上下各撑 8px 把命中区做到 40px */
  .list .it .swm::before{content:"";position:absolute;left:-2px;right:-2px;top:-8px;bottom:-8px;}
  .list .it .row2{margin-top:5px;}
  .list .it .cfg{margin-top:5px;gap:5px;}
  .list .it .cfg .chip{padding:4px 7px;font-size:12px;line-height:1.5;}
  .list .it .cfg.st{flex-wrap:wrap;gap:5px;margin-top:4px;}

  /* --- 5. 右栏标题行：两组按钮排成一行横向滑动，绝不断字 --- */
  .sec-hd{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;white-space:nowrap;
    gap:8px;padding:8px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
    box-shadow:inset -14px 0 12px -12px rgba(0,0,0,.18);}
  .sec-hd > *{flex:0 0 auto;}
  .sec-hd .grow{display:none;}
  .pane-sw button{min-width:0;min-height:40px;padding:0 10px;font-size:13px;white-space:nowrap;}
  .vsw button{min-height:40px;padding:0 9px;font-size:12.5px;white-space:nowrap;}

  /* --- 6. 走势图标题 / 合计行 / 分页 --- */
  .trend{margin:8px 10px 2px;}
  .trend-hd{flex-wrap:wrap;row-gap:6px;margin:8px 10px 0;font-size:12px;}
  .trend-hd .hint{order:3;flex:1 1 100%;white-space:normal;line-height:1.7;word-break:break-word;}
  .trend-hd .pg{order:2;}
  .trend-hd .trend-lg{flex-wrap:wrap;min-width:0;}
  .pg{gap:8px;}
  .pg button{min-width:40px;min-height:40px;padding:0 10px;font-size:13px;}
  .pg .pg-i{min-width:44px;}

  /* --- 7. 表格 → 卡片：13 列在手机上没法读，一行变一张卡，列名走 td::before --- */
  #ctx-rounds .tbl{overflow:visible;}
  #ctx-rounds .tbl table{display:block;width:100%;border-collapse:separate;border-spacing:0;}
  #ctx-rounds .tbl thead{display:none;}
  #ctx-rounds .tbl tbody{display:block;}
  #ctx-rounds .tbl tr.round-row{display:block;margin:8px 10px;padding:4px 10px 6px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);}
  #ctx-rounds .tbl tr.round-row.open{margin-bottom:0;border-bottom-left-radius:0;
    border-bottom-right-radius:0;border-bottom-color:transparent;}
  #ctx-rounds .tbl tr.round-row td{display:flex;align-items:baseline;gap:8px;min-width:0;
    padding:3px 0;border:0;text-align:left;white-space:normal;vertical-align:baseline;
    /* anywhere 而不是 break-word：flex 子项的最小宽度按「可以随处断」算，长模型名/长 URL 才不会把卡片撑破 */
    overflow-wrap:anywhere;}
  #ctx-rounds .tbl tr.round-row td::before{content:attr(data-label);flex:0 0 86px;
    color:var(--muted);font-size:11px;font-weight:400;line-height:1.55;word-break:break-word;}
  #ctx-rounds .tbl tr.round-row td:not([data-label])::before{content:none;}
  /* 第一列原本有个 ▸/▾ 展开箭头（tr.round-row td:first-child:before），卡片化后
     ::before 被列名占用了，这里把箭头和列名拼在一起，别把「点开看详情」的提示弄丢。 */
  #ctx-rounds .tbl tr.round-row td:first-child::before{content:"\25B8  " attr(data-label);}
  #ctx-rounds .tbl tr.round-row.open td:first-child::before{content:"\25BE  " attr(data-label);}
  #ctx-rounds .tbl tr.round-row td > *{min-width:0;}
  #ctx-rounds .tbl tr.round-row td.num,
  #ctx-rounds .tbl tr.round-row td.res{white-space:normal;}
  /* 手机上卡片化后正文该换行，别省略 */
  #ctx-rounds .tbl tr.round-row td.rtxt .ell{max-width:none;white-space:normal;overflow:visible;text-overflow:clip;}
  #ctx-rounds .tbl tr.round-row td .sub{white-space:normal;}
  #ctx-rounds .tbl tr.round-row td.tokc{position:static;}
  #ctx-rounds .tbl tr.round-row td.tokc .tokw{position:static;left:auto;top:auto;transform:none;}
  #ctx-rounds .tbl tr.round-row td.tokc .stp{position:static;left:auto;margin-left:6px;}
  #ctx-rounds .tbl tr.round-detail{display:block;margin:0 10px 8px;padding:0;
    border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--card);}
  #ctx-rounds .tbl tr.round-detail td{display:block;padding:8px 10px 10px;border:0;text-align:left;}
  #ctx-rounds .tbl tr.round-detail td::before{content:none;}

  /* --- 7b. .mini 小胶囊（展开 / 收起 / 清空摘要 / 返回实时）也是可点的：
     视觉尺寸不动，用伪元素把命中区撑到 40px，免得把消息头撑高 --- */
  .mini{position:relative;}
  .mini::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;
    height:40px;margin-top:-20px;}

  /* --- 8. 弹窗：宽度跟屏幕走，按钮不换行 --- */
  .mask{padding:12px;overflow-y:auto;}
  .dlg{width:calc(100vw - 24px);max-width:calc(100vw - 24px);padding:16px;
    max-height:calc(100vh - 24px);overflow-y:auto;}
  .dlg p{font-size:13px;}
  .dlg-btns{flex-wrap:nowrap;gap:8px;margin-top:12px;}
  .dlg-btns button{flex:1 1 0;min-width:0;min-height:40px;padding:0 10px;
    font-size:13px;white-space:nowrap;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="navseg">
      <button id="btn-home" class="navbtn on" title="回到首页">首页</button>
      <button id="btn-settings" title="打开设置页" class="navbtn">设置</button>
      <!-- 用户 m19731：重载并进导航胶囊当第三段，紫色 + 刷新图标，跟页面切换区分开 -->
      <span class="navsep"></span>
      <button id="btn-reload" class="navbtn nav-reload" title="重载插件：改完设置或代码后不用回桌面端重启"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>重载</button>
    </span>
    <!-- 用户 m19542 第 1 条：启用 / 自动刷新 改成折叠柱子那种「字写在轨道里」的开关 -->
    <label class="sw sw-state" id="sw-plugin" title="插件总开关"><span class="tr"></span></label>
    <label class="sw sw-state on" id="sw-auto" title="每 5 秒自动刷新"><span class="tr"></span></label>
    <!-- v3.51（用户 m07385 第 3 条）：先用等宽占位顶住，等数据回来换成「更新于 HH:MM:SS」，
         免得字一长一短把右边的东西推来推去。 -->
    <span class="sub" id="subtitle">更新于 --:--:--</span>
    <span class="grow"></span>
  </header>

  <div class="hbar" id="health-bar"><span class="dot"></span><span class="hs-sub">正在检查插件状态…</span></div>

  <div class="cards" id="cards"></div>

  <div class="split">
    <div class="list" id="ctx-list"></div>
    <div>
      <div class="panel" id="ctx-window" style="margin-bottom:12px">
        <div class="sec-hd"><span class="pane-sw"><button data-pane="window">实时窗口</button><button data-pane="rounds">回复记录</button><button data-pane="decisions">决策记录</button></span><span class="vsw"><button data-view="pretty">美化</button><button data-view="mixed">对照</button><button data-view="raw">原文</button></span><span class="sw sw-fold" data-trend-fold="1" title="只留裁切、快照和实时柱"><span class="tr"></span></span><span class="grow"></span></div>
        <div data-ctx-trend></div>
      </div>
      <div class="panel" id="ctx-rounds" style="display:none"></div>
      <script>
      // 右栏标题行以前是 renderCtxWindow 用 innerHTML 生成的，刷新后要等 JS 跑完（实测 111ms）
      // 才出现，下面的内容会突然往下跳一截（用户 m39759 图1）。现在骨架常驻在 HTML 里，
      // 选中态在这里按 localStorage 先设好，renderCtxWindow 之后只刷 class 和标题行以下的内容。
      (function(){
        try{
          var pv0 = localStorage.getItem("mdp_ctx_pane") || "window";
          var pane = (pv0 === "rounds" || pv0 === "decisions") ? pv0 : "window";
          var view = localStorage.getItem("mdp_view") || "pretty";
          var hd = document.querySelector("#ctx-window .sec-hd");
          if(hd){
            Array.prototype.forEach.call(hd.querySelectorAll("[data-pane]"), function(b){
              b.classList.toggle("on", b.getAttribute("data-pane") === pane);
            });
            Array.prototype.forEach.call(hd.querySelectorAll("[data-view]"), function(b){
              b.classList.toggle("on", b.getAttribute("data-view") === view);
            });
            // 折叠柱子开关的初始态也在这里落位，别等第一次重画才亮起来。
            var tf0 = hd.querySelector("[data-trend-fold]");
            if(tf0){
              var on0 = false;
              try{ on0 = localStorage.getItem("mdp_trend_fold") === "1"; }catch(e){}
              tf0.classList.toggle("on", on0);
            }
          }
          var wb = document.getElementById("ctx-window"), rb = document.getElementById("ctx-rounds");
          if(wb) wb.classList.toggle("linked", pane !== "window");
          if(rb){
            rb.classList.toggle("linked", pane !== "window");
            rb.style.display = (pane !== "window") ? "" : "none";
          }
        }catch(e){}
      })();
      </script>
    </div>
  </div>
</div>

</body>
</html>
