<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>多样决策</title>
<script>
/* 首帧引导（v3.06）
   ① 按上次缓存先把「启用」开关摆到正确位置，避免刷新时播放一次「自动重开」的滑动动画；
   ② KiraAI 外壳是单页应用，菜单接口返回前标题先显示占位「插件页面」，插件页一加载就纠正，
      接口越慢收益越大（实测慢接口下可提前约 2 秒）。 */
(function(){
  var d = document, e = d.documentElement;
  e.className += " booting";
  try{ if(localStorage.getItem("mdp_plugin_enabled") === "1") e.className += " plugin-on"; }catch(x){}
  // 记住上次停在哪个页（v3.12）：外壳刷新会重建 iframe、src 回到 decision-log，
  // 于是在设置页一刷新就被弹回首页（用户 m39759 ①）。发现上次停在设置页就直接跳过去。
  // 放在最前面：此时 body 还没解析，replace 不会闪一帧首页。
  (function(){
    try{
      if(localStorage.getItem("mdp_page") === "settings"){
        var m = location.pathname.match(/\/page\/plugin\/([^\/]+)\//);
        if(m){ location.replace("/page/plugin/" + m[1] + "/settings/"); return; }
      }
      localStorage.setItem("mdp_page", "home");
    }catch(x){}
  })();
  // 主题也从首帧就定下来，深色模式下刷新不再先白一下（v3.08）
  (function(){
    var t = "";
    try{
      var p = window.parent;
      if(p && p !== window && p.document && p.document.documentElement){
        var v = p.document.documentElement.getAttribute("data-theme");
        if(v === "dark" || v === "light") t = v;
      }
    }catch(x){}
    if(!t){ try{ var c = localStorage.getItem("mdp_theme"); if(c === "dark" || c === "light") t = c; }catch(x){} }
    if(t) e.setAttribute("data-theme", t);
  })();
  function release(){ e.classList.remove("booting"); }
  window.__releaseBoot = release;
  setTimeout(release, 1500);
  try{
    var p = window.parent;
    if(p && p !== window && p.document){
      var fix = function(){
        try{
          var h = p.document.querySelector("header.app-header h2");
          if(h && h.textContent.trim() === "插件页面") h.textContent = "多样决策";
        }catch(x){}
      };
      fix();
      var t0 = Date.now();
      (function loop(){ fix(); if(Date.now() - t0 < 2000) requestAnimationFrame(loop); })();
    }
  }catch(x){}
})();
</script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e3e9f3;--text:#1f2937;--muted:#6b7280;--accent:#3b82f6;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--soft:rgba(127,127,127,.08);}
html[data-theme="dark"]{--bg:#0f172a;--card:#16213a;--line:#26344f;--text:#e5edff;--muted:#93a4c4;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:rgba(255,255,255,.06);}
html[data-theme="dark"] .list .it:hover{background:rgba(255,255,255,.10);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
/* 不再限制 1500px：宽屏下撑满内容区，否则两侧留一大圈空白 */
.wrap{padding:18px 22px 40px;max-width:none;margin:0;}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.navseg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:11px;background:var(--soft);border:1px solid var(--line);height:32px;}
.navbtn{height:26px;padding:0 15px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;line-height:1;transition:background .15s,color .15s;}
.navbtn:hover{color:var(--text);}
.navbtn.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.10);}
html[data-theme="dark"] .navbtn.on{background:rgba(255,255,255,.10);}
h1{font-size:20px;margin:0;font-weight:600;}
.sub{color:var(--muted);font-size:12px;}
/* 用户 m07864 第 1 条：刷新时这句长度一变，右边的热重载按钮就像被推了一下。
   定宽 + 等宽数字，占位文案「更新于 --:--:--」跟真时间几乎一样宽。 */
#subtitle{display:inline-block;min-width:104px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0 5px;}
  .stack span{display:block;height:100%;}
  .lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .lg .k{display:flex;align-items:center;gap:5px;}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;}
  .s0{background:var(--accent);}
  .s1{background:#8b5cf6;}
  .s2{background:#10b981;}
  .s3{background:#94a3b8;}
  .sysbox{margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:6px 9px;}
  .sysbox summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none;}
  .sysbox summary:hover{color:var(--accent);}
  .sysbox pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:11.5px;line-height:1.55;max-height:36vh;overflow:auto;}
  .seqh{font-size:12.5px;font-weight:600;margin:12px 0 5px;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
/* v4.10（用户 m17328 第 2 条）：历史消息里哪几条真能命中缓存，在这条线上分开 */
.coldline{margin:10px 0 6px;padding:5px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;color:var(--warn);background:rgba(245,158,11,.10);border:1px dashed rgba(245,158,11,.42);}
html[data-theme="dark"] .coldline{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.38);}
/* v4.14（用户 m19095）：前缀之后那一段里，本轮输入用蓝调，跟「冷」区分开 */
.coldline.in{color:var(--info,#3b82f6);background:rgba(59,130,246,.09);border-color:rgba(59,130,246,.38);}
html[data-theme="dark"] .coldline.in{color:#93c5fd;background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.40);}
  .seqh .mini{font-size:11px;font-weight:400;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;}
  .seqh .mini:hover{border-color:var(--accent);color:var(--accent);}
  .mc-bd .segh{display:flex;gap:6px;margin-bottom:5px;}
  .seqh .dim{font-weight:400;color:var(--muted);}
  .msg.pend{opacity:.85;border-left:2px solid var(--accent);}
  .msg.pend .role{color:var(--accent);}
  .msg.summary{border-left:2px solid #8b5cf6;background:var(--soft);border-radius:0 8px 8px 0;}
  .msg.summary .role{color:#8b5cf6;display:flex;align-items:center;gap:8px;}
  .msg.summary .mono{color:var(--muted);}
  .msg.summary .mini{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer;font-weight:400;}
  .msg.summary .mini:hover{border-color:var(--bad);color:var(--bad);}
  .tail-note{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--soft);border:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.6;}
  .trace-hd{margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px;font-weight:600;}
  .tk{font-weight:400;font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);
    border-radius:999px;padding:1px 8px;}
  .tstep{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden;}
  .tstep .th{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:6px 10px;background:var(--soft);
    font-size:12px;font-weight:600;border-bottom:1px solid var(--line);}
  .tstep .tb{padding:8px 10px;}
  .lbl{font-size:11px;color:var(--muted);margin:7px 0 3px;letter-spacing:.02em;}
  .lbl:first-child{margin-top:0;}
  .think{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:var(--muted);
    background:var(--soft);border-left:2px solid #8b5cf6;border-radius:0 6px 6px 0;padding:6px 9px;
    max-height:22vh;overflow:auto;}
  .call{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--soft);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:4px 0;word-break:break-all;line-height:1.55;}
  .call b{color:var(--accent);}
  .res{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;border:1px dashed var(--line);
    border-radius:6px;padding:5px 8px;margin:4px 0;white-space:pre-wrap;word-break:break-word;
    max-height:24vh;overflow:auto;color:var(--muted);line-height:1.55;}
  .out{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;}
  /* 输出跟「思考」用同一个块（用户 m33573 图1：同一段轨迹里一个紫块一个绿卡，两个长相），
     只把左边条和字色换掉，字号/行高/内边距/圆角全部一致 */
  .think.out-blk{border-left-color:#10b981;color:var(--text);max-height:32vh;}
  /* 长内容只随页面滚动，轨迹和系统文本不再各套一层内滚动。 */
  .think,.think.out-blk,.res,.sysbox pre{max-height:none;overflow:visible;}
.grow{flex:1;}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;}
button:hover{border-color:var(--accent);color:var(--accent);}
button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
button.mini{padding:2px 8px;font-size:12px;border-radius:6px;}
/* 用户 m07085 新2：热重载是改完设置/代码后的常用动作，换成强调色实心按钮，
   别再跟旁边那些普通小按钮一个灰样。 */
header #btn-reload{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
header #btn-reload:hover{filter:brightness(1.08);color:#fff;border-color:var(--accent);}
header #btn-reload:disabled{opacity:.55;cursor:default;filter:none;}
button.icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border-radius:7px;color:var(--muted);flex:none;}
button.icon svg{width:15px;height:15px;display:block;}
button.icon:hover{color:var(--accent);border-color:var(--accent);background:rgba(59,130,246,.10);}
button.icon.danger{color:var(--bad);}
button.icon.danger:hover{color:#fff;background:var(--bad);border-color:var(--bad);}
/* 滑动开关：左关右开 */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;color:var(--muted);}
.sw .tr{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:.18s;flex:none;}
.sw .tr:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.18s;}
.sw.on .tr{background:var(--accent);}
.sw.on .tr:after{transform:translateX(18px);}
.sw.on{color:var(--text);}
.sw.busy{opacity:.5;pointer-events:none;}
/* 首帧引导：booting 期间禁用过渡，缓存态直接落位，刷新不再播放「自动重开」动画 */
html.booting .sw .tr,html.booting .sw .tr:after{transition:none;}
html.plugin-on #sw-plugin{color:var(--text);}
html.plugin-on #sw-plugin .tr{background:var(--accent);}
html.plugin-on #sw-plugin .tr:after{transform:translateX(18px);}
/* 会话状态点：绿=真实运行，红=运行异常，黄=排队，灰=等待或手动关闭 */
.st{display:inline-flex;align-items:center;gap:5px;flex:none;margin-left:2px;}
.st:empty{display:none;}
.st .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.st .dot.ok{background:#2fb344;box-shadow:0 0 0 2px rgba(47,179,68,.18);}
.st .dot.bad{background:#e5484d;box-shadow:0 0 0 2px rgba(229,72,77,.18);}
.st .dot.wait{background:#f5a524;}
.st b{font-weight:500;font-size:12px;}
.st b.ok{color:#2fb344;}
.st b.bad{color:#e5484d;}
.st b.wait{color:#b37b12;}
.st .dot.idle{background:var(--muted);opacity:.5;}
.st .idle{font-size:12px;color:var(--muted);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.card .k{color:var(--muted);font-size:12px;}
.card .v{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
.card .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px;}
.card .metric-sep{font-size:16px;font-weight:400;color:var(--muted);margin:0 9px;}
/* 副行一律不折行（用户 m02080 图2）：原来插件数据那行会掉到第二行，卡片被撑高、右边还剩一大片空 */
.card .sub{font-size:11px;line-height:15px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 插件数据卡：空出来的右边用来画各目录占比，完整明细在悬停里。
   用户 m02580：图形放大、副行整行落到图形下面（grid 两行两列），
   这样副行不再被图形挤掉右半边，目录多时能多写几项。
   用户 m02693 第 1 条：甜甜圈换成柱状分类——柱子的高低直接是 MB，
   谁占得多一眼就看出来，不用在脑子里换算角度。 */
/* 用户 m05552 第 6 条：柱状图别贴着卡片右边缘——文字列按内容宽、柱子紧跟其后、
   右边剩下的空白留白，看上去更像「文字 + 分类图」，不再中间空一大块。 */
.cards .card.pie{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"h p ." "s s s";align-items:center;column-gap:10px;row-gap:1px;}
.card.pie .pie-h{grid-area:h;min-width:0;}
.card.pie .bars-c{grid-area:p;display:flex;align-items:flex-end;gap:3px;height:40px;}
.card.pie .bars-c i{display:block;width:9px;border-radius:2px 2px 1px 1px;opacity:.9;}
.card.pie .sub{grid-area:s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 群聊/私聊那一行必须整行不折（用户 m42220）；放不下时靠下面这条缩小字距兜底 */
  .card .sub .nowrap{white-space:nowrap;display:inline-block;letter-spacing:-.2px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
/* 请求页：标题行那张卡和下面的表格贴成一块，中间不留缝（用户 m30252 图1） */
#ctx-window.linked{margin-bottom:0 !important;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none;}
#ctx-rounds.linked{border-top-left-radius:0;border-top-right-radius:0;border-top:none;margin-top:0;}
#ctx-rounds.linked .tbl table thead th:first-child{padding-left:14px;}
.tbl{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);white-space:nowrap;}
.tag.cut{background:rgba(6,182,212,.14);color:#0e7490;border-color:rgba(6,182,212,.45);}
html[data-theme="dark"] .tag.cut{background:rgba(6,182,212,.22);color:#67e8f9;}
.tag.ok{color:var(--ok);border-color:var(--ok);}
.tag.bad{color:var(--bad);border-color:var(--bad);}
.tag.warn{color:var(--warn);border-color:var(--warn);}
.empty{padding:36px;text-align:center;color:var(--muted);}
/* v3.15（用户 m40335）：窗口被重置、还没等到新消息时的居中提示 */
.waitbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:72px 20px;text-align:center;}
.waitbox .wbi{width:34px;height:34px;border-radius:50%;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--line);font-size:15px;line-height:1;}
.waitbox .wbt{font-size:13.5px;color:var(--text);font-weight:500;}
.waitbox .wbs{font-size:12.5px;color:var(--muted);line-height:1.8;}
/* 切档（美化/对照/原文）时右栏内容整块换掉，同一批消息的高度能差两千多像素，
   直接替换看着像「闪一下」（用户 m41961）。给新内容一层极短的淡入，
   只改观感不改布局；DOM 每次都是新节点，加类必播一次。 */
#ctx-window > .vswap-in{animation:vwswap .13s ease-out both;}
@keyframes vwswap{from{opacity:.55}to{opacity:1}}
.scroll{max-height:none;overflow:visible;}
.split{display:grid;grid-template-columns:304px 1fr;gap:12px;align-items:start;}
/* v3.62（用户 m18059 第 6 条）：右栏的 grid item 默认 min-width:auto，走势图柱子一多就被撑宽
   （容器跟着内容长，永远滚不动）。压成 0，让 .trend 在自己的框里横向滚动。 */
.split > *{min-width:0;}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;
  max-height:calc(100vh - 24px);position:sticky;top:12px;}
.list .grp{padding:9px 13px 7px;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);letter-spacing:.4px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;}
.list .it{display:block;position:relative;padding:11px 13px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
.list .it:hover{background:rgba(127,127,127,.13);}
.list .it:hover:not(.active):not(.off){background:rgba(127,127,127,.13);}
.list .it.active{background:rgba(59,130,246,.12);}
/* 用户 m03014 第 3 条：竖杠本身就当指示灯；用户 m04917 第 2 条把它拆成四色——
   选中蓝（没动）、静音中性浅灰（用户 m05552 第 3 条：深灰在浅色卡片上像「坏的弱化版」，
   而且和红/蓝/绿三个「有状态」的颜色抢眼；浅灰只表示「这条没开」，不参与运行指示）、
   运行中绿（带呼吸）、等待中蓝、出错红。竖杠绝对定位贴在卡片左边缘，折叠后 row2 收起，
   它是唯一还看得见的运行指示，所以必须常显、悬停给具体状态。 */
.list .it .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;
  background:transparent;transition:background .2s,opacity .2s;}
.list .it.active .stripe{background:#3b82f6;}
.list .it.off .stripe{background:#c4cad5;}
.list .it .stripe.ok{background:#10b981;animation:stripePulse 1.6s ease-in-out infinite;}
.list .it .stripe.wait{background:#3b82f6;}
.list .it .stripe.bad{background:#e5484d;}
@keyframes stripePulse{0%,100%{opacity:1}50%{opacity:.35}}
.list .it .avw{width:32px;height:32px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#a5b4fc,#818cf8);color:#fff;font-size:13px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;}
.list .it .avw::before{content:attr(data-ch);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.list .it .avw img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;}
.list .it .body{min-width:0;}
.list .it .nm-row{display:flex;align-items:center;gap:6px;}
.list .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px;font-weight:600;letter-spacing:.1px;}

.list .it .cfg .chip.hi-adapt{background:rgba(139,92,246,.16);color:#7c3aed;}
html[data-theme="dark"] .list .it .cfg .chip.hi-adapt{background:rgba(167,139,250,.18);color:#c4b5fd;}
/* v3.83（用户 m03849 图2）：「随机」也是一种生效中的掷骰方式，配蓝色跟「节奏」的绿分开，
   两者都点亮——这样一眼能看出这一格现在按哪种方式掷骰，不会以为随机是「没开」。 */
.list .it .cfg.st .chip.hi-rand{border-style:solid;border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.12);color:#2563eb;opacity:1;}
html[data-theme="dark"] .list .it .cfg.st .chip.hi-rand{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.45);color:#93c5fd;}
/* v3.94（用户 m08398 图9）：决策模式单独一颗紫色实底。选择器必须带 .cfg.st，
   否则打不过下面 .list .it .cfg.st .chip.on 的绿底（那条比 hi-* 多一级）。 */
.list .it .cfg.st .chip.hi-dec{border-style:solid;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.20);color:#6d28d9;opacity:1;}
html[data-theme="dark"] .list .it .cfg.st .chip.hi-dec{background:rgba(167,139,250,.24);border-color:rgba(167,139,250,.55);color:#ddd6fe;}
/* 决策模式钉在状态行最右：正好在首行「全局配置」下面（用户 m08398 图9） */

.list .it .cfg .chip.scope{margin-left:auto;}
.list .it .cfg .chip.scope.global{background:transparent;color:var(--muted);padding-right:6px;} /* v4.02（用户 m11629 图3）：原来是 padding-right:0，右边缘比下一行的实心胶囊少 6px（5 padding + 1 border），「全局配置」和「决策模式」就右边缘对不齐 */
/* 用户 m07864 第 3 条：开关类标签单独一行，两个字一个，开着用绿底、关着用虚线灰框。
   原来跟模式/百分比/窗口挤在同一行，五个四字标签一换行就看不见谁是谁。 */
/* v4.11（用户 m17596 第 3 条）：静默/休兜那颗倒计时胶囊带秒数，一进读秒就 68px 宽，
   状态行 6 颗合计 286px > 容器 276px，「决策模式」被挤到第二行（用户截图）。
   这里改成不换行，只让带 data-eta 的倒计时自己收缩（超长省略号），其余胶囊不吃亏。 */
.list .it .cfg.st{margin-top:4px;margin-left:0;}
.list .it .cfg.st{flex-wrap:nowrap;gap:3px;}
.list .it .cfg.st .chip{margin:0;padding:0 4px;border:1px dashed var(--line);background:rgba(148,163,184,.10);color:var(--muted);font-size:11.5px;flex:none;}
.list .it .cfg.st .chip.on{border-style:solid;border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.12);color:var(--ok);opacity:1;}
/* v4.02（用户 m11629 图3）：决策模式的紫色要排在这条 .chip.on 之后才压得住——两条选择器同级，
   后写的赢；以前 hi-dec 写在 275 行，白天就只剩底色紫、字和框还是绿的。 */
.list .it .cfg.st .chip.on.hi-dec{border-style:solid;border-color:rgba(139,92,246,.55);
  background:rgba(139,92,246,.20);color:#6d28d9;opacity:1;}
html[data-theme="dark"] .list .it .cfg.st .chip.on.hi-dec{background:rgba(167,139,250,.24);
  border-color:rgba(167,139,250,.55);color:#ddd6fe;}
  /* 用户 m11091 第 1 条：静默 / 休兜 冒过泡的胶囊打个勾，字重提一档好认 */
  .list .it .cfg.st .chip.ok{font-weight:600;border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.18);}
/* 用户 m08226 第 2 条：关着的标签也要有底，不然一排虚线框在浅色卡片上像漏画的。
   倒计时胶囊的数字用等宽，秒数往下减的时候宽度不跳。 */
.list .it .cfg.st .chip.off{color:var(--muted);opacity:.85;}
.list .it .cfg.st .chip[data-eta]{font-variant-numeric:tabular-nums;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.list .it .row2{display:flex;align-items:center;gap:6px;margin-top:7px;min-height:16px;}
.list .it .row2 .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;}
.list .it .row2 .hint{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--text);}
.list .it .swm{width:32px;height:18px;margin-left:2px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;}
.list .it .swm::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s;}
.list .it .swm.on{background:var(--accent);}
.list .it .swm.on::after{transform:translateX(13px);}
/* 折叠按钮常显一点，否则没人知道卡片能收（用户 m02080）。
   按钮顺序：改名、删除、开关、折叠（用户 m02580：折叠要坐在最右边原来是垃圾桶的位置）。
   折叠只收起运行状态和配置胶囊，这四个按钮留在原位不隐藏——位置和展开时一模一样，
   不用先展开就能点；折叠态下也给一点透明度，免得鼠标不在卡片上就看不见。 */
.list .it .foldb{opacity:.4;margin-left:2px;}
.list .it:hover .foldb{opacity:.85;}
.list .it .foldb svg{transition:transform .15s;}
.list .it.fold .foldb svg{transform:rotate(-90deg);}
.list .it.fold .row2,.list .it.fold .cfg{display:none;}
/* 用户 m06761 第 3 条：折叠态也不再常显图标——鼠标不在卡片上时改名/删除/折叠

.list .it.off .nm{opacity:.55;}
/* 顶部健康条（v2.82）：插件是不是活着、消息收到没有、为什么一条都没回 */
.hbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);font-size:12.5px;line-height:1.5;flex-wrap:wrap;}
.hbar .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--muted);}

.hbar.ok .dot{background:#10b981;}
.hbar.warn{border-color:rgba(245,165,36,.55);background:rgba(245,165,36,.12);}
.hbar.warn .dot{background:#f5a524;}
.hbar.bad{border-color:rgba(229,72,77,.55);background:rgba(229,72,77,.12);}
.hbar.bad .dot{background:#e5484d;}
.hbar b{font-weight:600;}
.hbar .hs-sub{color:var(--muted);}
.hbar .hs-sub.warn2{color:#b45309;font-weight:500;}
/* 用户 2026-10-24 图3：「我已知晓」要贴着说明文字后面，不再推到整条最右边 */
.hbar button{margin-left:2px;flex:0 0 auto;padding:3px 10px;border-radius:8px;border:1px solid var(--line);

.list .it.off .avw{filter:grayscale(.5);opacity:.8;}
.list .it:hover{background:rgba(127,127,127,.13);}
.list .it.active:hover{background:rgba(59,130,246,.16);}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;}
.msg{padding:8px 12px;border-bottom:1px solid var(--line);}
.msg .role{font-size:12px;color:var(--muted);margin-bottom:2px;}
.msg.user{background:rgba(59,130,246,.06);}
.msg.assistant{background:rgba(16,185,129,.06);}
.msg.tool{background:rgba(245,158,11,.06);}

/* ---- 视图模式：美化 / 对照 / 原文 ---- */
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);}
.vsw button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 11px;cursor:pointer;}
.vsw button+button{border-left:1px solid var(--line);}
.vsw button.on{background:var(--accent);color:#fff;font-weight:600;}
/* 上下文页两页切换（当前窗口 / 最近请求），放在标题行里 */
.pane-sw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);}
.pane-sw button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 16px;cursor:pointer;letter-spacing:.02em;min-width:76px;text-align:center;}
.pane-sw button+button{border-left:1px solid var(--line);}

.trend-lg{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:400;}
.trend-lg .tb{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.trend-lg .tb.ok{background:var(--accent);}
.trend-lg .tb.no{background:#94a3b8;}
.trend-lg .tb.error{background:var(--bad);}
.trend-lg .tb.cut{background:#f59e0b;}
.trend-lg .tb.trim{background:#06b6d4;}

.trend-hd .snap-back{margin-left:10px;border-color:#10b981;color:#0e9f6e;}

/* 卡片式消息 */
.mc{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0;overflow:hidden;}
.mc.pend{border-style:dashed;}
/* 连续同角色的消息并成一组：一个色块 + 左侧竖条，组内只留一条细线，
   不再每条都套一层气泡框（用户 m31327）。窗口页与请求页的历史都按 role 分组。 */
.mgrp{margin:0;background:var(--card);}
.mgrp + .mgrp{margin-top:0;border-top:1px solid rgba(0,0,0,.22);}
.mgrp + .mgrp > .mgrp-hd{padding-top:5px;}
html[data-theme="dark"] .mgrp + .mgrp{border-top-color:rgba(255,255,255,.22);}
.mgrp.user{background:rgba(59,130,246,.11);}
.mgrp.assistant{background:rgba(16,185,129,.11);}
.mgrp.tool{background:rgba(245,158,11,.10);}
.mgrp.system,.mgrp.summary{background:rgba(139,92,246,.11);}
.mgrp > .mc{margin:0;border:none;border-radius:0;background:transparent;}
.mgrp > .mc + .mc{border-top:1px solid rgba(0,0,0,.06);}
.mgrp > .mc .mc-hd{padding:3px 10px 1px;background:transparent;border-bottom:none;}
.mgrp > .mc .mc-hd .k{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.06);}
.mgrp > .mc .mc-bd{padding:0 12px 5px;}
.mgrp > .mc.pend{border:none;border-left:2px dashed var(--accent);}
/* 组内消息悬停：v2.78 把 .mc 的边框去掉后，.mc:hover 的 border-color 就失效了（用户 m32094） */
.mgrp > .mc:hover{background:rgba(0,0,0,.035);}
html[data-theme="dark"] .mgrp > .mc:hover{background:rgba(255,255,255,.05);}
/* v2.80：组头（圆形头像 + 名字）+ 组内一条一行（左时间 / 中正文 / 右字数） */
.mgrp-hd{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:8px;align-items:center;padding:6px 10px 1px;}
.mgrp-hd .gh-info{display:flex;align-items:center;gap:6px;min-width:0;}
.mgrp-hd .gh-av{position:relative;grid-column:1;justify-self:start;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;overflow:hidden;flex:0 0 auto;font-size:12px;font-weight:600;color:#fff;line-height:1;}
.mgrp-hd .gh-av.u{background:#3b82f6;}
.mgrp-hd .gh-av.bot{background:#10b981;}
.mgrp-hd .gh-ch{position:relative;z-index:0;}
.mgrp-hd .gh-av.hasimg .gh-ch{visibility:hidden;}
.mgrp-hd .gh-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
.mgrp-hd .gh-nm{font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mgrp > .mc.user,.mgrp > .mc.assistant,.mgrp > .mc.system{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:8px;align-items:start;padding:2px 10px 3px;}
.mgrp > .mc.user > .mc-hd,.mgrp > .mc.assistant > .mc-hd,.mgrp > .mc.system > .mc-hd{grid-column:1;padding:0;background:transparent;border:0;min-height:0;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.mgrp > .mc.user > .mc-hd .k:not(.you),.mgrp > .mc.assistant > .mc-hd .k:not(.you){padding:0;background:none;border:0;font-size:11px;color:var(--muted);}
.mgrp > .mc.user > .mc-bd,.mgrp > .mc.assistant > .mc-bd,.mgrp > .mc.system > .mc-bd{grid-column:2;padding:0;}
/* v3.60（用户 m17581 第 7 条）：组内工具卡（「tool search 5 条结果 …」那一条和它下面的结果列表）
   自己不占 46px 时间列，于是标题与结果比正文靠左 52px。给它补上与时间列等宽的缩进（46 + 8 间距），

.mgrp > .mc .mts .d{font-size:9.5px;line-height:11px;opacity:.72;letter-spacing:-.2px;}

.mc-bd .mixnote{margin-top:3px;font-size:10px;line-height:14px;color:var(--muted);opacity:.85;}

.tbl td .est{color:var(--muted);}

.seqh .mini{order:-1;}

.mdbox{font-size:12.5px;line-height:1.62;}
.mdh{font-size:12.5px;font-weight:600;margin:10px 0 4px;color:var(--fg);}

/* v4.32：决策注记只高亮名字，仍是普通 assistant 消息。 */

.mc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);}
.mc-hd .rq{font-weight:700;color:var(--text);font-size:12px;}
.mc-hd .rq.user{color:var(--accent);}
.mc-hd .rq.assistant{color:#10b981;}
.mc-hd .rq.tool{color:#f59e0b;}
.mc-hd .rq.system{color:#8b5cf6;}
.mc-hd .k{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11.5px;}
.mc-hd .grow{flex:1;}
.mc-bd{padding:9px 12px;}
.mc-bd .seg{margin-bottom:8px;}
.mc-bd .seg:last-child{margin-bottom:0;}
.emoji{display:inline-flex;align-items:center;vertical-align:-4px;margin-right:3px;}
.emoji .em-img{width:20px;height:20px;display:block;}
.emoji .em-txt{display:none;font-size:12px;color:var(--muted);}
.emoji.miss .em-img{display:none;}
.emoji.miss .em-txt{display:inline;}
.mc-bd .emoji{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:4px;}
.mc .more{margin-top:6px;font-size:11px;color:var(--accent);cursor:pointer;user-select:none;display:block;width:max-content;margin-left:0;border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--card);}
.mc .more:hover{border-color:var(--accent);}
.mc.fail{border-color:var(--bad);}
.mc-hd .k.bad{color:var(--bad);border-color:var(--bad);}
/* 原文模式 */
.rawhd{display:flex;align-items:center;gap:8px;margin:14px 0 6px;padding:6px 10px;background:var(--soft);border-radius:8px;font-size:12.5px;font-weight:600;}
.rawhd .dim{font-weight:400;color:var(--muted);font-size:11.5px;}
.rawblk{margin:0;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:9px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.rawblk .rl{color:var(--muted);}
.rawblk.full{max-height:none;overflow:visible;}
/* ---- 美化档细节（v2.19） ---- */
.mc{transition:border-color .12s,box-shadow .12s;}
.mc:hover{border-color:var(--muted);}
/* 窗口里悬停一条消息才出现的「拉黑」（v3.36 用户第 13 条）：点了把整条消息塞进
   这个群的「不触发短语」清单，和设置页里那张表是同一份。按钮挂成 .mc 的绝对定位子元素，
   组内卡片的左列只有 46px，塞不进 hd 里。已在清单里的常驻显示「已拉黑」。 */
.mc{position:relative;}
/* 拉黑按钮改挂在头部标签行里（用户 m01011 第 3 条：要跟在「字数」这类小标签后面，
   不是浮在卡片最右边那一个）。组内卡片头部只有一列时间，也照样跟在时间后面。 */
/* 用户 m01522 第 2 条：组内卡片头部只有一列时间（没有标签行），按钮挂 hd 会掉到时间下面、
   离正文好几行。那种卡改挂正文末尾（字数气泡之后），所以选择器不能只认 .mc-hd。 */
.mc .mc-blk{display:none;margin-left:6px;vertical-align:1px;padding:1px 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px;line-height:16px;
  cursor:pointer;user-select:none;white-space:nowrap;}
.mc:hover .mc-blk{display:inline-block;}
.mc .mc-blk:hover{color:#b45309;border-color:#f59e0b;}
.mc .mc-blk.on{display:inline-block;color:#b45309;border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.12);}
html[data-theme="dark"] .mc .mc-blk:hover,html[data-theme="dark"] .mc .mc-blk.on{color:#fbbf24;border-color:rgba(245,158,11,.6);}
.mc-hd .k.weak{opacity:.6;font-weight:400;}
.k.you{display:inline-block;padding:0 7px;border-radius:8px;background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.45);color:#b45309;font-size:11px;font-weight:600;line-height:16px;vertical-align:1px;}
html[data-theme="dark"] .k.you{background:rgba(245,158,11,.26);border-color:rgba(245,158,11,.5);color:#fbbf24;}
.mc-hd .k.ts{background:none;padding:0;opacity:.65;font-weight:400;}
.mc-hd .k.mk.ok{color:#059669;background:rgba(16,185,129,.12);}
.mc-hd .k.mk.no{color:var(--muted);background:var(--soft);}
.mc-hd .id{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);opacity:.7;cursor:default;}
.mc-hd .id:hover{opacity:1;color:var(--accent);}
.mc-bd .seg+.seg{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
/* 引用块：被回复的原话缩进一块，左边一条竖线，别跟正文糊在一起 */
/* v3.75（用户本轮第 3 条）：窗口快照结尾的失败说明（只显示，不进上下文） */
.wfail{margin:10px 0 2px;padding:9px 12px;border-radius:8px;background:rgba(239,68,68,.09);
  border:1px solid rgba(239,68,68,.35);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;}
.wfail b{color:var(--bad);font-size:13px;}
.wfail span{flex:1;min-width:0;font-size:13px;word-break:break-word;}
.wfail i{font-style:normal;font-size:12px;color:var(--muted);}
.mc-bd .quote{border-left:3px solid var(--line);background:var(--soft);border-radius:0 6px 6px 0;
  padding:5px 9px;margin-bottom:7px;font-size:12px;line-height:1.6;color:var(--muted);}
.mc-bd .quote .qwho{display:block;font-weight:600;color:var(--muted);opacity:.85;margin-bottom:1px;}
.mc-bd .quote .qfile{color:var(--accent);font-weight:500;}
.mc-bd .quote .qtx{display:block;white-space:pre-wrap;word-break:break-word;}
/* v3.76：被引用的图在这一轮没留下来（快照不存媒体）时的占位，别让 [图片] 冒充正文 */
.mc-bd .quote .qpic-ph{display:inline-flex;align-items:center;gap:5px;margin-top:2px;padding:1px 8px;
  border:1px dashed var(--line);border-radius:5px;font-size:11.5px;color:var(--muted);opacity:.9;}
.mc-bd .quote .qpic-ph:before{content:"🖼";font-size:11px;}
/* 引用原话里可能既有文字又有卡片/多条（用户第 2 条），别糊成一段 */
.mc-bd .quote .qtx+.qtx{margin-top:4px;}
/* v4.19（用户 m21126 图1）：框架只给被引用消息的 id，本地查不到原话时也要有框 */
.mc-bd .quote .qmiss{font-size:11.5px;color:var(--muted);opacity:.7;word-break:break-all;}
/* v4.18（用户 m20749 图2）：引用里的小程序分享框架只留了「[QQ小程序]标题」一行纯文本，
   还原不出原卡，画成和分享卡同一套的小卡，别再让方括号字面量露在引用里 */
.mc-bd .qmini{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;margin-top:1px;
  border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.02);}
.mc-bd .qmini-ic{flex:none;width:24px;height:24px;border-radius:7px;background:rgba(59,130,246,.13);
  color:#1d4ed8;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;}
.mc-bd .qmini-bd{display:flex;flex-direction:column;gap:2px;min-width:0;}
.mc-bd .qmini-t{font-size:12.5px;line-height:1.45;color:var(--text);word-break:break-word;}
.mc-bd .qmini-d{font-size:11px;color:var(--muted);}
.mc-bd .qmini-tag{display:inline-block;padding:0 5px;border-radius:6px;background:rgba(59,130,246,.12);
  color:#1d4ed8;font-size:11px;}
html[data-theme="dark"] .mc-bd .qmini{background:rgba(255,255,255,.04);}
html[data-theme="dark"] .mc-bd .qmini-ic{background:rgba(59,130,246,.22);color:#93c5fd;}
html[data-theme="dark"] .mc-bd .qmini-tag{background:rgba(59,130,246,.22);color:#93c5fd;}
/* v4.22（用户 m21783）：文件消息画成文件卡——图标 + 文件名 + 大小，仿 QQ 那张卡 */
.mc-bd .fcards{display:flex;flex-direction:column;gap:6px;margin-top:5px;}
.mc-bd .fcard{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);max-width:330px;}
.mc-bd .fcard .fico{flex:none;width:30px;height:30px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-size:15px;line-height:1;background:rgba(59,130,246,.12);}
.mc-bd .fcard .fmain{display:flex;flex-direction:column;gap:1px;min-width:0;}
.mc-bd .fcard .fname{font-size:12.5px;line-height:1.4;color:var(--text);word-break:break-all;}
.mc-bd .fcard .fsub{font-size:11px;color:var(--muted);}
html[data-theme="dark"] .mc-bd .fcard .fico{background:rgba(59,130,246,.22);}
.mc-bd .fwd{margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;}
.mc-bd .fwd-hd{padding:4px 9px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft);display:flex;align-items:center;gap:6px;}
.mc-bd .fwd-b{padding:4px 9px 5px;display:flex;flex-direction:column;gap:2px;}
.mc-bd .fwd-it{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:11.5px;line-height:17px;}
.mc-bd .fwd-it .fw-w{color:var(--muted);flex:none;}
.mc-bd .fwd-it .fw-t{color:var(--muted);opacity:.7;font-size:10px;flex:none;}
/* m24522 ④⑥：转发条目里的 [图片]/[表情] 以前原样留一段灰字，卡片里又没图可看，
   看着就是多出来的占位。改成一颗小图标 chip，不占行宽也不再重复写「[图片]」。 */
.fw-pic{display:inline-block;font-size:10.5px;line-height:15px;padding:0 5px;border-radius:6px;
  background:rgba(127,127,127,.16);color:var(--muted);margin:0 2px;vertical-align:1px;}
.mc-bd .fwd-it .fw-c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* v4.48（用户 m25038 第 4 项）：预览行末尾露几张真图，尺寸压到 22px，行高不变 */
.fw-ims{display:inline-flex;gap:2px;margin-left:4px;vertical-align:-7px;}
.mc-bd .fwd-hd .fw-ims{margin-left:auto;vertical-align:middle;}
.fw-ims .fw-im{width:22px;height:22px;object-fit:cover;border-radius:4px;cursor:zoom-in;
  background:rgba(127,127,127,.18);flex:none;}
  /* 嵌套转发小卡（用户 m14708 图2）：框架格式化时把内层 Forward 从链里剔掉
     （message_formatter.py:198），那条只剩「时间 昵称:」空尾巴。以前按 QQ 的样子
     给它补 [图片]，结果占掉下一张图的槽位——猪头贴纸跑到第一条下面去了。
     现在画成一张小卡：一行「合并转发 N 条」+ 后端爬到的一行摘要，不再参与图片认领。 */
  .mc-bd .fwd-sub{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;padding:1px 7px;
    border:1px solid var(--line);border-radius:6px;background:var(--soft);font-size:11px;line-height:16px;}
  .mc-bd .fwd-sub .fwb{color:var(--accent);flex:none;}
  .mc-bd .fwd-sub .fwp{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-bd .at{display:inline-block;white-space:nowrap;padding:0 5px;margin:0 1px;border-radius:8px;background:rgba(59,130,246,.14);color:#1d4ed8;font-weight:600;font-size:.94em;line-height:16px;vertical-align:1px;}
html[data-theme="dark"] .mc-bd .at{background:rgba(59,130,246,.26);color:#93c5fd;}
    /* 分享卡（v3.22 用户 m42531 图4/图5）：左图标、右标题+描述、脚下来源与「打开」，
       整张卡可点。原来是「一小行灰条」，群里和窗口里都不像一张卡。 */
    .mc-bd .qcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;
      background:var(--card);padding:0;margin-bottom:7px;text-decoration:none;color:inherit;overflow:hidden;
      max-width:420px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s,box-shadow .15s,transform .15s;}
    .mc-bd a.qcard:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(16,24,40,.10);transform:translateY(-1px);}
    .mc-bd .qcard .qc-row{display:flex;align-items:flex-start;gap:9px;min-width:0;padding:9px 11px;}
    .mc-bd .qcard .qc-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto;}
    .mc-bd .qcard .qc-t{font-size:13px;font-weight:600;color:var(--text);line-height:1.45;text-decoration:none;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .mc-bd a.qcard:hover .qc-t{color:var(--accent);}
    .mc-bd .qcard .qc-logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
      border-radius:9px;background:var(--soft);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;flex:none;overflow:hidden;}
    .mc-bd .qcard .qc-logo.xianyu{background:#ffe24b;border-color:#ecd23f;color:#302b13;}
    /* 品牌图标（用户 m04325）：B 站用官方 TV 图形染白压在品牌粉底上，小黑盒用官方黑色标志放白牌上；
       都是内嵌 data URI，外网图标挂了、内网离线也照样显示。 */
    .mc-bd .qcard .qc-logo.bili{background:#fb7299;border-color:#f2658c;padding:4px;}
    .mc-bd .qcard .qc-logo.heybox{background:#fff;border-color:rgba(16,24,40,.12);padding:4px;}
    /* 用户 m17212 图7：抖音用官方图标（内嵌 data URI，内网/离线照样显示） */
    .mc-bd .qcard .qc-logo.dy{background:#111;border-color:#111;padding:5px;}
    .mc-bd .qcard .qc-logo > img{width:100%;height:100%;object-fit:contain;display:block;}
/* favicon 兜底：首字垫在底下，图标加载成功就盖住它，失败（onerror 移除）就露出来 */
.mc-bd .qcard .qc-logo.fav{position:relative;overflow:hidden;font-size:14px;font-weight:600;}
.mc-bd .qcard .qc-logo.fav > img{position:absolute;left:2px;top:2px;width:calc(100% - 4px);
  height:calc(100% - 4px);object-fit:contain;border-radius:4px;background:transparent;}
    .mc-bd .qcard img.qc-logo{object-fit:contain;background:transparent;padding:2px;}
    .mc-bd .qcard .qc-go{flex:none;color:var(--muted);font-size:12px;opacity:.55;line-height:1.5;}
    .mc-bd .qcard .qc-ft{display:flex;align-items:center;gap:8px;padding:5px 11px 6px;border-top:1px solid var(--line);
      font-size:11px;color:var(--muted);background:var(--soft);}
    .mc-bd .qcard .qc-src{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mc-bd .qcard .qc-open{flex:none;color:var(--accent);font-weight:500;}
    /* 用户 m02993 图9：直播间卡片。以前直播间和视频卡一模一样（同款粉色 B + 同款边框），
       只在脚注多四个字，点开才知道是直播。现在左边是红底 LIVE 牌、标题后钉红色「直播」
       徽标、脚注写「进入直播间」，扫一眼就分得开。 */
    .mc-bd .qcard.live{border-color:rgba(244,63,94,.40);}
    .mc-bd a.qcard.live:hover{border-color:#f43f5e;box-shadow:0 3px 10px rgba(244,63,94,.16);}
    .mc-bd .qcard .qc-logo.live{background:#f43f5e;border-color:#e11d48;color:#fff;
      font-size:10px;font-weight:800;letter-spacing:.3px;padding:0;}

    /* 徽标要跟标题同一行：.qc-t 平时是 2 行截断的 -webkit-box，子元素会各占一行 */
    .mc-bd .qcard.live .qc-t{display:block;overflow:hidden;}
    html[data-theme="dark"] .mc-bd .qcard.live{border-color:rgba(244,63,94,.46);}
    html[data-theme="dark"] .mc-bd .qcard .qc-logo.live{background:#f43f5e;border-color:#e11d48;}
    html[data-theme="dark"] .mc-bd .qcard .qc-live{background:#f43f5e;color:#fff;}

       数据要等后端回来，所以先画一张骨架卡，fillTweets() 拿到数据再按 .tw-* 重画：

    .mc-bd .qcard.tw .tw-tx{padding:6px 11px 0;font-size:13px;line-height:1.62;color:var(--text);

    .mc-bd .qcard.tw .tw-med{display:grid;gap:3px;margin:8px 0 0;grid-template-columns:1fr;}

    .mc-bd .qcard.tw .tw-mi.bad{display:none;}

    .mc-bd .qcard.tw .qc-src{display:flex;align-items:center;gap:5px;}
    .mc-bd .qcard.tw .qc-src svg{flex:none;opacity:.75;}
    .mc-bd .qcard.tw.tw-bad{border-style:dashed;}
    .source-note{display:flex;align-items:flex-start;gap:9px;margin:8px 12px;padding:9px 11px;background:var(--soft);border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px;line-height:1.65;}
    .source-note .source-mark{flex:none;color:var(--accent);font-weight:600;}

    /* 转发里一条都没解出来时（框架只给了 {"type":"forward"}）如实说明，不铺空表格 */
    .mc-bd .fwd-note{padding:1px 0;font-size:11.5px;line-height:1.65;color:var(--muted);white-space:normal;}
/* v3.61（用户 m17581 第 1 条）：合并转发只拿到空壳时的占位——一行灰底提示，别画成空转发卡。 */
.mc-bd .fwd-miss{display:inline-block;padding:0 6px;border-radius:6px;background:var(--soft);
  color:var(--muted);font-size:11.5px;line-height:18px;}
    /* 转发卡默认只露前 3 条、第 3 条留半截，底部渐变盖住；点一下才看全部
       （用户 m01011 第 2 条）。折叠高度由 fitForwardCards() 按实际行高量出来。 */
    .mc-bd .fwd[data-fwd] .fwd-b{overflow:hidden;position:relative;}
    .mc-bd .fwd[data-fwd] .fwd-b::after{content:"";position:absolute;left:0;right:0;bottom:0;
      height:22px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--card));pointer-events:none;}
    /* 用户 m03273：卡里只有预览，图片全在弹层模板里，不再需要按 .open 藏图；

    /* 用户 m03343 第 1 条：弹层里的图不能按原图尺寸铺开（大图会把框撑破、也关不掉）。
       这里按原比例自适应：限宽 100%、限高 min(240px,40vh)，等比缩小，不裁切。 */

    /* 关闭按钮收进图片右上角内侧：深色半透明底 + 白 ×（用户 m03561：悬在外面的白圆点很难看） */

      display:flex;align-items:center;justify-content:center;line-height:1;
      border:0;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:19px;font-family:inherit;

    .img-pop .ip-note{display:none;padding:18px 22px;border-radius:10px;background:var(--card);
      color:var(--muted);font-size:12.5px;box-shadow:0 18px 52px rgba(0,0,0,.3);}
    /* 图片缩略图：点开看原图 */
    .mc-bd .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}

    /* 被引用的那张图（用户 m01522 图1/图5）：画在引用块内部，别再浮到卡片外面 */
    .mc-bd .quote .thumbs{margin:3px 0 4px;}

    /* 图被框架清掉、插件也没留到副本时，别再露一张裂图 + 一大片空白（用户 m01011 图1）：
       占位块尺寸和缩略图一致，写明是已经清理掉的图。 */
    .mc-bd .thumb.bad{display:flex;align-items:center;justify-content:center;
      border-style:dashed;color:var(--muted);text-decoration:none;}
    .mc-bd .thumb.bad::after{content:"图片\A已清理";white-space:pre;font-size:11px;line-height:1.3;text-align:center;}

/* v3.60（用户 m17581 第 6 条）：选中柱的描边（2px + 外扩 1px）原来被容器的 overflow 裁掉——按满高画的柱子
   正好顶到内容区上边缘，左右第一根也贴着边，所以绿柱的框看起来缺一段。上下各留 8px、左右留 4px 给描边；
   内容高度仍是 54（64 − 8 上 − 1 下 − 1 边框），柱子比例一点没变。 */
/* v3.63（用户 m18492 图5）：裁切线原来画在滚动容器里，跟着柱子一起滚走了；滚到头以后滚轮还会把整页滚起来。
   结构拆成 .trend（定位框，overflow 可见，不滚）> .trend-in（真正横向滚的那条）+ .tline（画在 .trend 上，不随滚动）。
   描边留白（上 8、左右 4、下 1）跟着挪进 .trend-in，柱子高度仍是 54，比例没变。 */
.trend{margin:10px 12px 2px;position:relative;height:64px;overflow:visible;border-bottom:1px solid var(--line);}
.trend-in{height:100%;display:flex;align-items:flex-end;gap:3px;padding:8px 4px 1px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;}
.trend-in::-webkit-scrollbar{display:none;width:0;height:0;}
.trend .bar{flex:0 0 auto;width:26px;background:var(--line);border-radius:2px 2px 0 0;transition:background .15s;cursor:pointer;}
.trend .bar:hover{background:var(--muted);}
.trend .bar.ok:hover{background:var(--accent);opacity:.75;}
.trend .bar.ok{background:var(--accent);}
.trend .bar.no{background:#94a3b8;}
.trend .bar.no:hover{background:#64748b;}
.trend .bar.error{background:var(--bad);}
.trend .bar.error:hover{opacity:.75;}
.trend .bar.pending{background:var(--warn);}
.tag.neutral{color:var(--muted);border-color:var(--line);}
/* v3.90（用户 m05623 第 1 条）：裁切快照在「触发」列挂「待发 N」，虚线跟快照里那几条待发的虚线框呼应 */
.tag.pend{font-size:11.5px;padding:0 7px;border-style:dashed;color:var(--muted);border-color:var(--line);margin-left:6px;}
/* 等待中的重试（用户 m05552 第 1 条）：跟柱状图、竖杠的 wait 同一支暖黄 */
.tag.wait{color:#b45309;border-color:#f5a524;}
a.tag.ret{text-decoration:none;cursor:pointer;}
a.tag.ret:hover{text-decoration:underline;}
/* 用户 m05828 第 2 条：跳转箭头原来用一个 ›，又细又小，看着像装饰；换成实心 ↗ 并留出间距 */
a.tag.ret .go{margin-left:5px;font-weight:700;font-size:13px;line-height:1;}
.trend .bar.cut,.trend .bar.cut:hover{background:#f59e0b;box-shadow:none;}
/* v3.75（用户本轮第 5 条）：非请求触发的裁切自己也是一份快照，用青色跟「裁过」的橙区分开 */
.trend .bar.trim,.trend .bar.trim:hover{background:#06b6d4;box-shadow:none;}
.trend .bar.error.cut,.trend .bar.error.cut:hover{background:var(--bad);}
/* v3.99（用户 m10577）：决策轮也是一次窗口快照，柱子单独给一个紫色，别混进「未回复」的灰。 */
.trend .bar.dec,.trend .bar.dec:hover{background:#8b5cf6;box-shadow:none;}
.trend .bar.dec.sel{outline-color:#8b5cf6;}
/* v4.13（用户 m18728 第 1 条）：决策轮自己触发了裁切时，橙色要盖住紫色。
   .cut 的规则写在 .dec 前面，同特异性下会被后写的紫盖掉，所以这里单独再写一条。 */
.trend .bar.dec.cut,.trend .bar.dec.cut:hover{background:#f59e0b;}
.trend-lg .tb.dec{background:#8b5cf6;}
.trend .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--bad);opacity:.55;pointer-events:none;}
.trend .tline span{position:absolute;right:0;top:-14px;font-size:10.5px;color:var(--bad);background:var(--panel);padding:0 3px;border-radius:3px;}
.trend-hd{display:flex;align-items:center;gap:6px;margin:8px 12px 0;font-size:12px;color:var(--muted);}
.trend-hd .grow{flex:1;}
.pg{display:inline-flex;align-items:center;gap:4px;}
.pg button{background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:6px;
  padding:2px 8px;font-size:12px;cursor:pointer;line-height:1;font-family:inherit;}
.pg button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.pg button:disabled{opacity:.35;cursor:default;}
.pg .pg-i{font-size:12px;color:var(--muted);min-width:48px;text-align:center;}
@media (max-width:860px){
  .wrap{padding:12px 12px 30px;}
  .cards{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
  .split{grid-template-columns:1fr;}
  .list{max-height:34vh;}
  th,td{padding:6px 8px;}
}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:99;}
.dlg{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35);}
.dlg h3{margin:0 0 10px;font-size:15px;}
.dlg p{margin:0 0 8px;font-size:12.5px;line-height:1.75;color:var(--muted);}
.dlg p.p2{color:var(--text);}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.dlg-btns button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:12.5px;}
.dlg-btns button.danger{background:var(--bad);border-color:var(--bad);color:#fff;}

    <button id="btn-reload" class="mini" title="热重载插件：改完设置或代码后不用回桌面端重启">热重载</button>

      <div class="panel" id="ctx-window" style="margin-bottom:12px">
        <div class="sec-hd"><span class="pane-sw"><button data-pane="window">当前窗口</button><button data-pane="rounds">回复记录</button><button data-pane="decisions">决策记录</button></span><span class="vsw"><button data-view="pretty">美化</button><button data-view="mixed">对照</button><button data-view="raw">原文</button></span><span class="grow"></span></div>
        <div data-ctx-trend></div>
      </div>
      <div class="panel" id="ctx-rounds" style="display:none"></div>
      <script>
      // 右栏标题行以前是 renderCtxWindow 用 innerHTML 生成的，刷新后要等 JS 跑完（实测 111ms）
      // 才出现，下面的内容会突然往下跳一截（用户 m39759 图1）。现在骨架常驻在 HTML 里，
      // 选中态在这里按 localStorage 先设好，renderCtxWindow 之后只刷 class 和标题行以下的内容。
      (function(){
        try{
          var pv0 = localStorage.getItem("mdp_ctx_pane") || "window";
          var pane = (pv0 === "rounds" || pv0 === "decisions") ? pv0 : "window";
          var view = localStorage.getItem("mdp_view") || "pretty";
          var hd = document.querySelector("#ctx-window .sec-hd");
          if(hd){
            Array.prototype.forEach.call(hd.querySelectorAll("[data-pane]"), function(b){
              b.classList.toggle("on", b.getAttribute("data-pane") === pane);
            });
            Array.prototype.forEach.call(hd.querySelectorAll("[data-view]"), function(b){
              b.classList.toggle("on", b.getAttribute("data-view") === view);
            });
          }
          var wb = document.getElementById("ctx-window"), rb = document.getElementById("ctx-rounds");
          if(wb) wb.classList.toggle("linked", pane !== "window");
          if(rb){
            rb.classList.toggle("linked", pane !== "window");
            rb.style.display = (pane !== "window") ? "" : "none";
          }
        }catch(e){}
      })();
      </script>
    </div>
  </div>
</div>

  function cfgOf(sid){

    if(!e) return CFG;

      decision: !!e.decision_enabled,
      window: !!e.window_enabled,
      keep: e.window_keep || 0,
      trim: e.window_trim_threshold || 0,
      mode: e.trigger_mode || "",

  // 返回数组而不是一整串：项一多就换行挤成一团，拆成小气泡各自换行才看得清（用户 m30009 图2）
  // 一位小数、去掉多余的 .0（胶囊里塞不下两位数小数）
  function trimNum(n){
    return (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
  }
  // 倒计时文案：静默 / 休兜 开着时标签直接显示还剩多少秒（用户 m08226 第 2 条）

  function mdDialog(opt){

      var mask = document.createElement("div");
      mask.className = "mask";
      var box = document.createElement("div");
      box.className = "dlg";

            esc(opt.ok || (opt.alert ? "知道了" : "确定")) + "</button>" +
        "</div>";

      document.body.appendChild(mask);
      var done = false;

        if(done) return;
        done = true;
        document.removeEventListener("keydown", onkey, true);

        if(e.key === "Escape"){ e.preventDefault(); close(false); }

        return { n: DIR_LABEL[x.name] || x.name, mb: x.mb || 0,
                 lbl: x.lbl || ((x.mb || 0).toFixed(1) + " MB") };
      });
      var rest = 0;
      if(!noFold) list.slice(5).forEach(function(x){ rest += (x.mb || 0); });
      if(rest > 0) segs.push({ n: "其他 " + (list.length - 5) + " 项", mb: rest });
      var sum = segs.reduce(function(a, s){ return a + s.mb; }, 0);
      var max = segs.reduce(function(a, s){ return Math.max(a, s.mb); }, 0);
      if(!(sum > 0) || !(max > 0)) return "";
      var bars = segs.map(function(s, i){

      }).join("");

    var cost = t.cost || {};

    // 最右一格放内存（用户 m28965）：窗口和待发都吃内存，出问题先看这里。

  function setSwitch(id, on){
    var n = document.getElementById(id);
    if(!n) return;
    n.classList.toggle("on", !!on);
    if(id === "sw-plugin"){
      try{ localStorage.setItem("mdp_plugin_enabled", on ? "1" : "0"); }catch(e){}
      document.documentElement.classList.toggle("plugin-on", !!on);
    }
  }

  // API 秒数是采样值；本地只补接收后的单调时钟间隔，新 busy_since 立刻换轮。
  var stateClocks = {};
  function sampleStateClock(s){
    if(!s || !s.sid) return;
    if(!s.busy){ delete stateClocks[s.sid]; return; }
    stateClocks[s.sid] = {since: s.busy_since, seconds: Math.max(0, Number(s.busy_seconds) || 0), at: performance.now()};
  }
  function busyElapsed(s){
    var c = s && stateClocks[s.sid];
    if(!c || c.since !== s.busy_since) return s.busy_seconds;
    return c.seconds + Math.max(0, performance.now() - c.at) / 1000;
  }
  function stateTag(s){
    // 手动关闭是配置状态，不是故障；绝不据此修改会话开关。
    if(s && (s.muted || (s.eff && s.eff.session_enabled === false))){
      return "<span class='dot idle'></span><span class='idle'>决策未开启</span>";
    }
    if(s && s.busy){
      if(s.busy_since !== undefined && !(s.busy_since > 0))
        return "<span class='dot wait'></span><b class='wait'>运行中 · 准备请求</b>";
      if(s.stalled) return "<span class='dot bad'></span><b class='bad'>运行超时 " + fmtDur(busyElapsed(s)) + "</b>";
      return "<span class='dot ok'></span><b class='ok'>运行中 · 已请求 " + fmtDur(busyElapsed(s)) + "</b>";
    }
    if(s && s.retry_in > 0){
      return "<span class='dot bad'></span><b class='bad'>运行出错 · " + s.retry_in + " 秒后重试" +
             (s.retry_count ? "（第 " + s.retry_count + " 次）" : "") + "</b>";
    }
    if(s && s.queued) return "<span class='dot wait'></span><b class='wait'>排队中</b>";
    if(s && s.last_error){
      return "<span class='dot bad'></span><b class='bad' title='" + esc(s.last_error) + "'>上次出错：" +
             esc(String(s.last_error).slice(0, 18)) + "</b>";
    }
    // last_mark 描述收消息时的计数，不代表现在仍在运行或上一轮未完成。
    return "<span class='dot idle'></span><span class='idle'>等待触发</span>";
  }
  // 左栏那条竖杠只认四档（用户 m03014 第 3 条）：ok 运行中、bad 出错、wait 等待/排队、
  // idle 关掉。判定顺序和 stateTag 一模一样，改一边记得改另一边。
  // 用户 m05205 第 1 条：等待触发也要亮灯（蓝），以前留成透明，卡片上什么都看不见。
  // 用户 m04917 第 2 条：出错必须立刻能看见 —— 所以 retry_in / last_error 提到 busy 之前判，
  // 否则「180 秒卡死 → 看门狗放开 → 2 秒后重试」这段里 busy 一直为真，竖杠就一直绿着。
  function stateLvl(s){
    if(s && (s.muted || (s.eff && s.eff.session_enabled === false))) return "idle";
    if(s && s.retry_in > 0) return "bad";
    if(s && s.busy){
      if(s.busy_since !== undefined && !(s.busy_since > 0)) return "wait";
      return s.stalled ? "bad" : "ok";
    }
    if(s && s.queued) return "wait";
    if(s && s.last_error) return "bad";
    return "wait";   // 等待触发：亮蓝灯（要求见上）
  }
  // 竖杠本身就是那盏灯：运行时绿、等待/排队蓝、出错红，关掉的会话靠 .it.off 压成深灰。
  // 它绝对定位在卡片左边缘，折叠收起 row2 之后仍然看得见运行状态。
  // 用户 m13708 第 2 条：竖杠以前只在整列表重画时换颜色（5 秒一次），开始/结束触发后
  // 要等好几秒才变色。现在每秒那一拍也用同一个判定把 class 与 title 刷一遍，所以把颜色
  // 对应的提示文字拆成独立函数——两处都调它，避免又出现「同一盏灯两套判定」。
  function stateStripeTitle(s, lv){
    if(lv === "ok") return "运行中 · 已请求 " + fmtDur(busyElapsed(s));
    if(lv === "wait") return (s && s.queued) ? "排队中"
                          : (s && s.busy) ? "运行中 · 准备请求" : "等待触发";
    if(lv === "bad") return (s && s.retry_in > 0) ? ("运行出错 · " + s.retry_in + " 秒后重试")
                                  : (s && s.stalled) ? "运行超时" : "上次出错";
    return (s && (s.muted || (s.eff && s.eff.session_enabled === false))) ? "决策未开启" : "等待触发";
  }
  function stateStripe(s){
    var lv = stateLvl(s);
    return "<span class='stripe " + lv + "' title='" + esc(stateStripeTitle(s, lv)) + "'></span>";
  }

  // ---------------------------------------------------------------- 健康条
  var ctxHealth = null;
  var lastHealthSig = "";
  // 看门狗提示是「已经自愈」的通报，不是持续故障：点过「我已知晓」就该消掉。
  // 这里只存已确认到的次数，下次再放开才会重新变橙（用户 m01927）。
  var WD_ACK_KEY = "mdp_wd_ack";
  // v3.75（用户本轮第 3 条）：请求失败且重试也没救回来的横幅。跟看门狗一样，
  // 记的是「已确认到哪个时间点」，同一个失败只提醒一次。
  var FAIL_ACK_KEY = "mdp_fail_ack";

  function healthSub(h){
    var out = [];
    // v3.51（用户 m07385 第 1 条）：运行状态只看「本次运行」——插件启动/热重载起算，
    // 刷新页面不会清零；跨重载的累计数已经去掉（那个数对不上账，用户说没必要）。
    var up = Number(h.uptime) || 0;
    if(up > 0) out.push("本次运行 " + fmtDur(up));
    if(h.last_msg_ago >= 0){
      out.push(h.last_msg_ago < 60 ? (h.last_msg_ago + " 秒前收到消息") : (fmtDur(h.last_msg_ago) + "前收到消息"));
    } else {
      out.push("还没收到消息");
    }
    var trig = h.triggers || 0;
    out.push("本次触发 " + trig + " 轮");
    if(h.delivered) out.push("投递 " + h.delivered + " · 结算 " + (h.finals || 0));
    if(h.watchdog) out.push("看门狗放开 " + h.watchdog + " 次");
    // 用户 2026-10-24 图3：静音跳过不用再报了（条数只增不减，越看越长）；
    // 换成「这一次放开之后到底重试了几次、最后成没成」——那才是要看的东西。
    var wr = h.watchdog_retry || null;
    if(wr){
      var att = Math.max(0, Number(wr.attempts) || 0);
      var tail = wr.outcome === "success" ? "成功"
               : wr.outcome === "failed" ? "未成功" : "还没结论";
      out.push("重试 " + att + " 次 · " + tail);
    }
    return out.join(" · ");
  }

  function renderHealth(h){
    var bar = document.getElementById("health-bar");
    if(!bar || !h) return;
    ctxHealth = h;
    var wr = h.watchdog_retry || null;
    var sig = JSON.stringify([h.enabled, h.decision, h.muted, h.busy, h.delivered, h.finals,
                              h.watchdog, h.msgs, Math.floor((h.last_msg_ago || 0) / 5),
                              h.triggers, Math.floor((h.uptime || 0) / 5), h.uptime > 600,
                              (h.last_fail && h.last_fail.ts) || 0,
                              wr ? [wr.attempts, wr.outcome, wr.status] : 0]);
    if(sig === lastHealthSig) return;
    lastHealthSig = sig;

    var wdAck = 0;
    try { wdAck = parseInt(localStorage.getItem(WD_ACK_KEY) || "0", 10) || 0; } catch(e){ wdAck = 0; }
    var failAck = 0;
    try { failAck = Number(localStorage.getItem(FAIL_ACK_KEY) || 0) || 0; } catch(e){ failAck = 0; }
    var failTs = (h.last_fail && Number(h.last_fail.ts)) || 0;
    var cls = "hbar", head = "", extra = "", fix = "";
    var muted = h.muted || [];
    var busy = (h.busy || []).filter(function(x){ return muted.indexOf(x.sid) < 0; });
    var stalled = busy.filter(function(x){ return x.stalled; });
    if(!h.enabled || !h.decision){
      head = !h.enabled ? "插件未开启" : "决策未开启";
      extra = "当前为手动关闭状态，不是运行故障";
    } else if(stalled.length){
      cls += " bad";
      head = stalled.length + " 个会话卡住";
      extra = "投递后超过 3 分钟没结算，看门狗到点会自动放开";
    } else if(busy.length){
      cls += " ok";
      head = busy.length + " 个会话运行中";
      extra = "请求尚未完成，等待本轮结算";
    } else if(failTs > failAck){
      // v3.75（用户本轮第 3 条）：红色报错 + 重试也没成功 —— 不能只在某个会话卡的
      // 小红字里躺着，翻到别的页签就没人知道了。整条变红 + 一个「我已知晓」。
      cls += " bad";
      var lf = h.last_fail || {};
      var who = String(lf.sid || "").split(":").pop();
      head = "请求失败，重试也没成功";
      extra = (who ? who + " · " : "") + fmtTime(lf.ts) + " · " +
              String(lf.text || "请求失败").slice(0, 40) +
              (Number(lf.retries) > 0 ? "（重试 " + lf.retries + " 次）" : "");
      fix = "<button id='hbar-fail'>我已知晓</button>";
    } else if((h.watchdog || 0) > wdAck){
      cls += " warn";
      head = "看门狗已强制释放 " + h.watchdog + " 次";
      extra = "有轮次投递后没等到结算，已自动恢复";
      // 它不会自己消失，只能让人点掉：给一个明确的「我知道了」
      fix = "<button id='hbar-wd'>我已知晓</button>";
    } else if(h.watchdog > 0){
      // 已确认过的历史次数：整条回到正常态，次数仍留在下面的灰字里
      cls += " ok";
      head = "运行正常";
    } else if((h.msgs || 0) === 0 && !(h.last_msg_ago >= 0) && (h.uptime || 0) > 600){
      cls += " bad";
      head = fmtDur(h.uptime) + " 一条消息都没收到";
      extra = "机器人可能没连上，或者消息根本没到插件";
    } else {
      cls += " ok";
      head = "运行正常";
    }
    var sub = healthSub(h);
    bar.className = cls;
    bar.innerHTML = "<span class='dot'></span><b>" + esc(head) + "</b>" +
      (extra ? "<span class='hs-sub warn2'>" + esc(extra) + "</span>" : "") +
      "<span class='hs-sub'>" + esc(sub) + "</span>" + fix;
  }

  // v3.75（用户本轮第 3 条）：点掉失败横幅，记住这个失败的时间点
  function ackFail(){
    var ts = (ctxHealth && ctxHealth.last_fail && ctxHealth.last_fail.ts) || 0;
    try { localStorage.setItem(FAIL_ACK_KEY, String(ts)); } catch(e){}
    lastHealthSig = "";
    if(ctxHealth) renderHealth(ctxHealth);
  }

  // 点掉看门狗提示：记住当前次数，整条健康条回到正常态（用户 m01927）
  function ackWatchdog(){
    var n = (ctxHealth && ctxHealth.watchdog) || 0;
    try { localStorage.setItem(WD_ACK_KEY, String(n)); } catch(e){}
    lastHealthSig = "";
    if(ctxHealth) renderHealth(ctxHealth);
  }

  // 一键把静音的会话全部恢复：静音最容易看成卡死，得给条明路
  function resumeAllMuted(){
    var list = (ctxHealth && ctxHealth.muted) || [];
    if(!list.length) return;
    var left = list.length;
    list.forEach(function(sid){
      get(API + "/overrides?sid=" + encodeURIComponent(sid)).then(function(d){
        var ov = (d && d.override) || {};
        delete ov.session_enabled;
        // 不能带 merge=1：merge 会把旧覆盖并回来，刚删掉的 session_enabled 又被加回去
        return post(API + "/overrides?sid=" + encodeURIComponent(sid) +
                    "&values=" + encodeURIComponent(JSON.stringify(ov)));
      }).catch(function(){}).then(function(){
        left -= 1;
        if(left <= 0) load();
      });
    });
  }

  var lastListSig = "";
  function renderCtxList(){
    var box = document.getElementById("ctx-list");

      if(s.eff) sEff[s.sid] = s.eff;   // 上下文页自带每个会话的有效配置，直接复用
      if(s.silent_eta) sEta[s.sid] = s.silent_eta;   // 静默/休兜倒计时（用户 m08226 第 2 条）
      sFired[s.sid] = { silent: s.silent_fired_ts || 0, rest: s.rest_fired_ts || 0 };
      sStat[s.sid] = {                  // 胶囊要的实时数字：24h 统计 + 计数器（v3.23）
        messages: s.r24_messages || 0,
        replied: s.r24_replied || 0,
        counter: s.counter || 0
      };
      (isDM(s.sid) ? groups.dm : groups.gm).push(s);
    });
    // 每 5 秒轮询一次，数据没变就别重画：一重画，用户刚滚到的位置、
    // 按下的焦点全回原点，看着就像「自己弹回去」（用户 m29158）
    // 签名里必须带上「当前选中会话」和「别名表」：切会话、改名的时候
    // ctxSessions 一个字都没变，只比数据会直接早退，active 高亮和改后的名字
    // 永远落不到 DOM（审查 bug）
    var listSig = JSON.stringify([ctxSid, aliases, ctxSessions, Object.keys(foldedSids).sort()]);
    if(listSig === lastListSig) return;
    lastListSig = listSig;
    var listTop = box.scrollTop;
    var html = "";
    [["gm", "群聊"], ["dm", "私聊"]].forEach(function(g){
      var arr = groups[g[0]];
      if(!arr.length) return;
      html += "<div class='grp'>" + g[1] + "（" + arr.length + "）</div>";
      arr.forEach(function(s){
        var on = !(s.eff && s.eff.session_enabled === false);
        // 每个胶囊自己带 data-cfg：原来整块 .cfg 都是可点区域，鼠标划过下面那一片
        // 也会跳去设置页（用户 m31156）。现在只有点中胶囊才跳。
        // cfgChips 每项带 sec（top 首行 / st 状态行）与 on（开关态），这里拆成两行摊平：
        // 首行只放模式、百分比/计数、窗口，最右边是「独立配置/全局配置」；五个两字
        // 状态标签单独一行（用户 m07864 第 3 条）。
        var cfgAll = cfgChips(s.sid);
        var chips = cfgAll.filter(function(x){
          return !(x && typeof x === "object" && x.sec === "st");
        }).map(function(x){ return ctxChipHtml(x, s.sid); }).join("");
        // v3.94（用户 m08398 图9）：带 right 的那颗（决策模式）要贴在最右边、
        // 正好落在首行那颗「全局配置」下面，所以从状态行里单拿出来放到末尾
        // （.chip.rt 的 margin-left:auto 只有在它排最后时才推得动）。
        var stAll = cfgAll.filter(function(x){
          return !!(x && typeof x === "object" && x.sec === "st");
        });
        var chipsSt = stAll.filter(function(x){ return !x.right; })
                           .map(function(x){ return ctxChipHtml(x, s.sid); }).join("");
        var chipsStR = stAll.filter(function(x){ return !!x.right; })
                            .map(function(x){ return ctxChipHtml(x, s.sid); }).join("");
        var own = !!(s.eff && s.eff.overridden);
        chips += "<i class='chip scope" + (own ? "" : " global") + "' data-cfg='" + esc(s.sid) + "' title='" +
                 (own ? "这个会话有自己的配置，点一下去改" : "跟随全局配置，点一下给这个会话单独设") + "'>" +

        html += "<div class='it" + (s.sid === ctxSid ? " active" : "") + (on ? "" : " off") +
                (fold ? " fold" : "") + "' data-ctx='" + esc(s.sid) + "'>";
        // 头像和名字放同一排（用户 m31259）；头像不再单独占一列，下面两行从卡片左边开始
        html += stateStripe(s) + "<div class='nm-row'>" + avatarHtml(s.sid) + "<span class='nm' title='窗口 " + (s.window || 0) + " 条 · 请求 " +
                (s.rounds || 0) + " 轮'>" + esc(displayName(s.sid)) + "</span>" +
                "<button class='icon' data-rename='" + esc(s.sid) + "' title='改个名字' aria-label='改个名字'>" + ICON_PENCIL + "</button>" +
                "<button class='icon danger' data-hide='" + esc(s.sid) + "' title='隐藏或删除这个会话的记录' aria-label='删除会话'>" + ICON_TRASH + "</button>" +
                "<span class='swm" + (on ? " on" : "") + "' data-swm='" + esc(s.sid) +
                "' title='" + (on ? "这个会话的决策已开启，点一下关闭" : "这个会话的决策未开启，点一下开启") +
                "' aria-label='这个会话的决策开关'></span>" +
                "<button class='icon foldb' data-foldsid='" + esc(s.sid) + "' title='" +
                (fold ? "展开这条卡片的运行状态和配置" : "收起运行状态和配置胶囊，按钮位置不动") +
                "' aria-label='" + (fold ? "展开会话卡片" : "收起会话卡片") + "'>" + ICON_CHEV + "</button></div>";
        // 第二行只放运行状态（用户 m30428：窗口条数这类不常驻，状态要单独一行）
        html += "<div class='row2'><span class='st' data-st='" + esc(s.sid) + "'>" + stateTag(s) + "</span></div>";
        html += "<div class='cfg'>" + chips + "</div>";
        if(chipsSt || chipsStR) html += "<div class='cfg st'>" + chipsSt + chipsStR + "</div>";
        html += "</div>";
      });
    });
    box.innerHTML = html;
    if(listTop) box.scrollTop = listTop;
  }

  // 折叠只改显示，不动任何记录；重画靠 lastListSig 清空强制走一遍
  function toggleFoldSid(sid){
    sid = String(sid || "");
    if(!sid) return;
    if(foldedSids[sid]) delete foldedSids[sid]; else foldedSids[sid] = true;
    saveFolded();
    lastListSig = "";
    renderCtxList();
  }

  // 每个会话一个独立开关：关掉 = 这个群/私聊插件完全不管（不计数、不进窗口、不触发）。
  // 存的是 overrides 里的 session_enabled；开回来就把这个键删掉（跟随全局默认 true）。
  function setSessionEnabled(sid, on){
    var url = API + "/overrides?sid=" + encodeURIComponent(sid);
    get(url).then(function(d){
      var ov = (d && d.override) || {};
      if(on){ delete ov.session_enabled; } else { ov.session_enabled = false; }
      return post(url + "&values=" + encodeURIComponent(JSON.stringify(ov)));
    }).then(function(){
      ctxSessions.forEach(function(s){
        if(s.sid !== sid) return;
        s.eff = s.eff || {};
        s.eff.session_enabled = !!on;
      });
      if(sEff[sid]) sEff[sid].session_enabled = !!on;
      lastHealthSig = "";
      renderCtxList();
      load();
      if(ctxWin && ctxWin.sid === sid) renderCtxWindow(ctxWin, true);
    }).catch(function(e){ mdAlert("切换失败：" + e.message); });
  }

  // 每轮结果只由该轮持久化字段判断，不从当前会话的 busy/error 推断。
  function roundResult(r){
    r = r || {};
    var outcome = String(r.outcome || "");
    var error = r.error ? (typeof r.error === "string" ? r.error : JSON.stringify(r.error)) : "";
    if(r.failed || outcome === "failed" || outcome === "error" || error) return { label: "运行出错", cls: "error", tag: "bad", detail: error };
    // v3.75（用户本轮第 5 条）：这不是一次请求，而是「没人说话时顺手做的一次
    // 窗口裁切」单独落的快照。不能算成「未回复」——那样颜色和统计都说错话。
    if(outcome === "trim") return { label: "窗口裁切", cls: "trim", tag: "cut", detail: "" };
    // v3.99（用户 m10577）：决策轮的快照不是「未回复」，它压根没发请求。
    if(outcome === "decision") return { label: r.decision_reply ? "判定要回" : "判定不回", cls: "dec", tag: "neutral", detail: String(r.decision_reason || "") };
    if(outcome === "pending" || outcome === "running") return { label: "运行中", cls: "pending", tag: "neutral", detail: "" };
    // 用户 m05552 第 1 条：全站不再写「已回复」，统一叫「请求成功」——这一格说的是
    // 请求有没有跑成功，跟「模型决定不回」不是一回事。
    if(r.replied || outcome === "replied") return { label: "请求成功", cls: "ok", tag: "ok", detail: "" };
    // 用户 m02159 图6：模型明明写了话，可它没包在 <msg> 里，框架解析出 0 条消息，
    // 于是这一轮记成「未回复」。标签上要说清是这种没回，别让人以为模型一声不吭。
    if(r.reply_unwrapped){
      return {
        label: "未回复（没包 <msg>）",
        cls: "no",
        tag: "neutral",
        detail: "模型写了话，但没有包在 <msg> 里，框架解析出 0 条消息，所以没发出去。现在会自动补一层壳再发。"
      };
    }
    return { label: "未回复", cls: "no", tag: "neutral", detail: "" };
  }
  // 用户 2026-10-24 图4/图5/图7：出错那一行不能只有「运行出错」——后面到底重试了几次、
  // 最后成没成、回复落在哪一份记录，都要在行里直接看得见；点一下能跳到重试那一轮。
  // 这些字段都是后端读取时现算的（请求记录本身是证据，一个字节都没改）。
  function retryBadge(r){
    r = r || {};
    var out = r.retry_outcome || null;
    // 用户 m05552 第 1 条：原轮只写「运行出错」一个标签，重试几次、成没成由下面各自的
    // 重试轮行自己说。这里的汇总信息不丢，挂到标签的 title 上（见 roundResultHtml）。
    if(out){ return ""; }
    var link = r.retry_of || null;
    if(link){
      // 用户 m04917 第 3 条：原来写「补重试 2 次」，既读不懂（这行自己就是那次重试）、
      // 又跟原轮的「重试 2 次」重复报同一个数字。重试轮只说自己是重试轮 + 现在到哪一步。
      var linkRes = roundResult(r);
      // 用户 m05205 第 3 条：每行重试要说清自己是第几次、现在到哪一步，不能两行都只写「重试轮」。
      // 用户 m05828 第 2 条：「重试失败 X1 / X2」里的 X 看不出是第几次，像倍数，去掉；
      // 第几次只留在悬停提示里。箭头也换成实心 ↗（原来的 › 太细，看不出能点）。
      var nth = Math.max(0, Number(link.attempt_index) || 0);
      var t2;

  function mdLite(t){
    var lines = String(t == null ? "" : t).split(/\r?\n/);
    var out = "", buf = [];
    function flush(){
      if(!buf.length) return;
      out += "<div class='mdp'>" + inlineMd(buf.join("\n")) + "</div>";
      buf = [];
    }
    for(var i = 0; i < lines.length; i++){
      var ln = lines[i], m;
      if((m = ln.match(/^\s*#{1,6}\s+(.+?)\s*#*\s*$/))){
        flush();
        out += "<div class='mdh'>" + inlineMd(m[1]) + "</div>";
        continue;
      }
      if((m = ln.match(/^\s*[-*+]\s+(.*)$/))){
        flush();
        out += "<div class='mdli'>" + inlineMd(m[1]) + "</div>";
        continue;
      }
      if((m = ln.match(/^\s*(\d+[.)])\s+(.*)$/))){
        flush();
        out += "<div class='mdli'>" + inlineMd(m[1] + " " + m[2]) + "</div>";
        continue;
      }
      if(!ln.trim()){ flush(); continue; }
      buf.push(ln);

      if(html.indexOf("class='qcard") >= 0){

  // ------------------------------------------------------------ 窗口拉黑短语（v3.36）
  // 用户第 13 条：鼠标移到一条消息上才出现「拉黑」，点了把整条消息塞进这个群的
  // 「不触发短语」清单——和设置页里那张表是同一份，走单群覆盖，不影响别的群。
  // 后端比对口径是「整条消息归一化后完全等于清单里的词」（decision/engine.py:1960
  // _phrase_hit + :39 _norm_phrase），所以这里的 blkNorm 必须跟 :36 的 _PHRASE_STRIP
  // 用同一套字符，不然「已拉黑」会显示不出来。
  var BLK_STRIP = " \t\r\n，。！？!?~～、,.;；:：…·•—-_*#@'\"“”‘’";
  var blkList = null;   // {enabled, items, count}：这个会话当前生效的清单
  var blkSid = "";
  function blkNorm(t){
    t = String(t === null || t === undefined ? "" : t);
    var i = 0, j = t.length;
    while(i < j && BLK_STRIP.indexOf(t.charAt(i)) >= 0) i++;
    while(j > i && BLK_STRIP.indexOf(t.charAt(j - 1)) >= 0) j--;
    return t.slice(i, j).toLowerCase();
  }
  // 一张卡片「真正说的那句话」：引用块、展开按钮、字数气泡、卡片标题都不算正文，
  // 不然拉黑存下来的是一串元数据，永远匹配不上下一句一样的话
  function blockTextOf(card){
    var bd = card.querySelector(".mc-bd");
    if(!bd) return "";
    var c = bd.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll(".quote,.more,.chb,.mixnote,.qcard,.qfile"), function(x){
      if(x.parentNode) x.parentNode.removeChild(x);
    });
    var t = c.textContent || "";
    t = t.replace(/\[图片\]|\[表情\]|\[语音\]|\[视频\]|\[文件\]/g, " ");
    return t.replace(/[\s\u00a0]+/g, " ").trim();
  }
  function markBlockBtn(card){
    if(!card) return;
    // 用户 m03014 第 2 条：转发卡不给「拉黑」——一张合并转发不是「某个人说的一句话」，
    // 拿卡里的文字去比对短语清单只会误伤，按钮挂在转发卡上也容易被当成转发的一部分。
    if(card.querySelector(".fwd")) return;
    // 用户 m01011 第 3 条：按钮要排在小标签（字数、名字、时间…）后面，不再浮在卡片最右边。
    // 普通卡片：插在头部标签行 .grow 之前，正好落在字数气泡后面。
    // 组内卡片（用户 m01522 第 2 条）：头部只有一列时间，塞进去会掉到时间下面，
    // 改挂正文末尾 —— 字数气泡本来就在 .mono 里面，这样读起来就是「… 25 字 拉黑」。
    var hd = card.querySelector(".mc-hd");
    var bd0 = card.querySelector(".mc-bd");
    if((hd && hd.querySelector("[data-blk]")) || (bd0 && bd0.querySelector("[data-blk]"))) return;
    // v3.60（用户 m17581 第 5 条）：只调工具、没有人话的卡片也不给「拉黑」——截图里
    // 「调用 search · 搜索『…』」下面挂着拉黑按钮，点下去拉黑的是工具参数，不是谁说的话。
    if(card.querySelector(".tcall-wrap")) return;

    var role = (String(card.className || "").match(/(?:^|\s)(user|assistant)(?:\s|$)/) || [])[1] || "";
    if(!role) return;
    var txt = blockTextOf(card);
    if(!txt) return;

    if(hd && grow && grow.parentNode === hd){ hd.insertBefore(b, grow); return; }
    var mono = bd0 ? bd0.querySelector(".mono") : null;
    if(mono){ mono.appendChild(b); return; }
    if(bd0){ bd0.appendChild(b); return; }

    card.appendChild(b);

  function paintBlockBtns(){
    var box = document.getElementById("ctx-window");

    (blkList.items || []).forEach(function(w){ var k = blkNorm(w); if(k) set[k] = 1; });

      var on = !!set[blkNorm(b.getAttribute("data-txt"))];
      if(on) b.classList.add("on"); else b.classList.remove("on");

      b.title = on

  // 清单按会话缓存：切群才重拉，同一群重画窗口直接用缓存，不然每 5 秒一次刷新都要打接口
  function loadPhraseBlock(sid){
    if(!sid || sid === blkSid) return;

  async function toggleBlockPhrase(btn){

  function sendBlockPhrase(sid, txt, action){

        if(r.enabled === false) msg += "\n\n注意：设置里「不触发短语」的开关是关的，这条先记着，打开开关才生效。";

  // 拆 user 消息开头那串元数据：
  //   [Oct 19 2026 16:31 Mon] [message_id: xxx] [user_nickname: 我, user_id: admin] | 正文
  // 拆不动的部分原样留在 body 里，绝不吞内容。
  // 有人把群头衔塞进昵称，QQ 那边编码坏了就成了「[%ĀĀ␇Ö]我在未来，等你」这种。
  // 只在拆元数据（美化/对照档）时剥掉开头这段乱码，原文档走原文，一个字都不动。
  function cleanNick(n){
    var raw = String(n == null ? "" : n);
    var t = raw.replace(/^\[[^\[\]]*(?:[\u0080-\u009f\u0100-\u017f\u2400-\u243f])[^\[\]]*\]\s*/, "");
    t = t.trim();
    return t || raw;   // 剥干净了也不吞，宁可难看
  }

  // 括号配平：从 s[pos]（必须指向 [）找到配对的 ]，任意层嵌套都认。
  // 转发消息是 [Reply ID: x content: [Forward [时间] 人: [Video name: …]]]，套了三层，
  // 原来那个只认一层的正则整块匹配不上，全漏进正文了（用户 m33994 图1）。
  function bracketEnd(s, pos){
    var d = 0;
    for(var i = pos; i < s.length; i++){
      var ch = s.charAt(i);
      if(ch === "[") d++;
      else if(ch === "]"){ d--; if(d === 0) return i; }
    }
    return -1;
  }

  // 引用的原话里分享卡会丢壳：框架把它写进 Reply 时变成
  //   [Reply ID: x content: [时间] 某人: {"app":…,"title":…,"jumpUrl":…}]
  // [Json card 前缀和结尾那个 ] 都被吃掉，剩一坨裸 JSON 铺在正文里，
  // richText 又从 JSON 里的 b23.tv 认出站点、就地插一张卡把 JSON 劈成两半
  // （用户 m13768：卡片内的东西飞外面了，卡片里没内容）。
  // 从开头配平一对花括号，字符串里的 { } 与转义不算深度。
  function bareJsonEnd(s){
    if(s.charAt(0) !== "{") return -1;
    var d = 0, inStr = false, esc0 = false;
    for(var i = 0; i < s.length; i++){
      var ch = s.charAt(i);
      if(inStr){
        if(esc0){ esc0 = false; continue; }
        if(ch === "\\"){ esc0 = true; continue; }
        if(ch === '"') inStr = false;
        continue;
      }
      if(ch === '"'){ inStr = true; continue; }
      if(ch === "{") d++;
      else if(ch === "}"){ d--; if(d === 0) return i; }
    }
    return -1;
  }
  // 裸 JSON 值不值得当分享卡：卡片类字段至少有一个；纯小对象别乱认
  function looksLikeCard(o){
    if(!o || typeof o !== "object") return false;
    if(Object.prototype.toString.call(o) === "[object Array]") return false;
    var keys = ["jumpUrl", "qqdocurl", "url", "app", "title", "prompt", "desc"];
    for(var i = 0; i < keys.length; i++){ if(o[keys[i]]) return true; }
    return false;
  }

  function splitMeta(t){
    var rest = String(t || ""), m = { ts: "", mid: "", name: "", uid: "", at: [] };
    // 括号里可能还套一层括号（Reply ID 的 content 自己带 [时间]），
    // 所以允许一层嵌套，否则 `[Reply ID: x content: [..] 某人: 话]` 会被切半
    var re = /^\[((?:[^\[\]]|\[[^\[\]]*\]){1,600})\]\s*/;
    for(var i = 0; i < 12; i++){
      // 「[昵称] | 正文」那条竖线每轮都清一下，不然后面的 [At …] 剥不到
      rest = rest.replace(/^\s*\|\s*/, "");
      // Reply 先按括号配平单独切：里面可能套着 Forward 和 [Video name: …]（用户 m33994 图1）
      if(rest.indexOf("[Reply ID:") === 0){
        var e2 = bracketEnd(rest, 0);
        if(e2 > 0){
          var rm0 = rest.slice(1, e2).match(/^Reply ID:\s*([\s\S]*?)\s+content:\s*([\s\S]*)$/);
          if(rm0){ m.reply = { id: rm0[1].trim(), text: rm0[2].trim() }; rest = rest.slice(e2 + 1); continue; }
          // v4.19：只有 id 没有原话（框架实测「[Reply 1050111951]」，用户 m21126 图1）
          var ro0 = rest.slice(1, e2).match(/^Reply ID:\s*(-?\d+)\s*$/);
          if(ro0){ m.reply = { id: ro0[1].trim(), text: "" }; rest = rest.slice(e2 + 1); continue; }
        }
      }
      // 正文本身是一整块合并转发的聊天记录（不是引用里那种）：
      // 收进 meta.fwd 单独画卡片，别把「[Forward [时间] 人: 话」这串中括号铺在正文里
      if(rest.indexOf("[Forward") === 0){
        var ef = bracketEnd(rest, 0);
        if(ef > 0){ m.fwd = rest.slice(0, ef + 1); rest = rest.slice(ef + 1); continue; }
      }
      // 引用原话里的分享卡只剩裸 JSON（见 bareJsonEnd 注释）：配平出一整块，
      // 解析成功、又像张卡，就收进 meta.card 当卡片画，别让 JSON 铺在正文里
      if(rest.charAt(0) === "{"){
        var bj = bareJsonEnd(rest);
        if(bj > 0){
          var obj = null;
          try { obj = JSON.parse(rest.slice(0, bj + 1)); } catch(e0){ obj = null; }
          if(looksLikeCard(obj)){ m.card = obj; rest = rest.slice(bj + 1).replace(/^\s+/, ""); continue; }
        }
      }
      var x = rest.match(re);
      if(!x) break;
      var inner = x[1];
      // 四种时间戳都认：框架原样 [Oct 19 2026 23:09 Mon]、v2.26 [10-19 23:09]、v2.27 [23:09]，
      // 以及引用原话里的 ISO [2026-10-23 21:01:00]（用户第 2 条：不能让它当正文露出来）
      if(/^(?:[A-Z][a-z]{2} \d{1,2} \d{4} \d{1,2}:\d{2}|\d{4}-\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}|\d{1,2}-\d{1,2} \d{1,2}:\d{2}|\d{1,2}:\d{2})/.test(inner)){
        m.ts = inner; rest = rest.slice(x[0].length); continue;
      }
      if(inner.indexOf("message_id:") === 0){
        m.mid = inner.slice(11).trim(); rest = rest.slice(x[0].length); continue;
      }
      if(inner.indexOf("user_nickname:") >= 0){
        var nm0;
        var g = inner.match(/user_nickname:\s*([\s\S]*?),\s*user_id:\s*([\s\S]*)$/);
        if(g){ nm0 = cleanNick(g[1].trim()); m.uid = g[2].trim(); }
        else { nm0 = cleanNick(inner.slice(inner.indexOf("user_nickname:") + 14).trim()); }
        // 用户 m04917 第 1 条：有人把群头衔/装饰混进昵称，落下来就是

  //      —— QQ markdown 消息里的 mention（机器人 / 小程序分享都这么发），

      .replace(/\\n/g, "\n")
      .replace(/\[Image attached\]/gi, "[图片]")

      .replace(/\[Voice attached\]/gi, "[语音]")

  var BODY_PH_RE = /^\[(图片|表情|语音|视频|文件)\]$/;

  function splitMetaAll(t){

    // forwardHtml 的「空行分条」匹配不到，整张卡糊成一条。
    var lines = String(t || "").replace(/\r\n?/g, "\n").split("\n"), blocks = [], cur = [];

    var head = /^\s*\[(?:[A-Z][a-z]{2} \d{1,2} \d{4} \d{1,2}:\d{2}|\d{4}-\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}|\d{1,2}-\d{1,2} \d{1,2}:\d{2}|\d{1,2}:\d{2}|message_id:|user_nickname:)/;
    // 反过来也要防：一整段 [Forward …] 内部每条本身就以 [ISO 时间] 打头，
    // 按 head 切就会把一张转发卡腰斩成两条普通气泡——正文露出「[Forward [时间] 人:」、
    // 第二条只剩「人: 链接]」尾巴多一个 ]、字数还各算一份（用户截图：一条合并转发拆成 33 字 + 5 字）。

    function fwdBodyOpen(text){
      var from = text.lastIndexOf("[Forward");
      if(from < 0) return false;
      var d = 0;
      for(var i = from; i < text.length; i++){
        var ch = text.charAt(i);
        if(ch === "[") d++;
        else if(ch === "]"){ d--; if(d <= 0) return false; }

      return d > 0;

    lines.forEach(function(ln){

        if(fwdBodyOpen(cur.join("\n")) && swallowed < 200){ swallowed++; cur.push(ln); return; }
        blocks.push(cur.join("\n")); cur = []; swallowed = 0;

    blocks.forEach(function(x){ if(x.trim()) out.push(splitMeta(x)); });

  // 多模态 content 是数组（[{type:'text'},{type:'image_url'},…]），
  // 直接 JSON.stringify 出来就是一坨字典，模型看到的是图，人看到的应该是「[图片]」
  function contentText(c){
    if(c === null || c === undefined) return "";
    if(typeof c === "string") return c;
    if(Array.isArray(c)){
      var out = [], seenImg = 0, flat = "";
      // v4.48（用户 m25438）：原文里本来就带着 [图片]/[表情] 占位时，别再给图片 part 补一个。
      // 以前每张图都无条件补一个「[图片]」，于是「[表情] + [图片]」两行占位只对应一张图；
      // 美化档按「占位数 == 图片数」认领，认不上就把 [图片] 原样留在气泡里（图下面多一行字）。
      var phRe = /\[(?:Image attached|图片|表情|image)\]/gi;
      c.forEach(function(it){
        if(!it || typeof it !== "object"){ flat += "\n" + String(it); out.push(String(it)); return; }
        var tp = it.type || "";
        if(tp === "text"){ flat += "\n" + (it.text || ""); out.push(it.text || ""); }
        else if(tp === "image_url" || tp === "image" || tp === "kira_image_ref"){
          seenImg += 1;
          var phN = (flat.match(phRe) || []).length;
          if(phN < seenImg){ flat += "\n[图片]"; out.push("[图片]"); }
        }
        else if(tp === "input_audio" || tp === "audio"){ flat += "\n[语音]"; out.push("[语音]"); }
        else { flat += "\n[" + (tp || "附件") + "]"; out.push("[" + (tp || "附件") + "]"); }
      });
      return out.join("\n");
    }

    if(typeof c === "object") return c.text ? String(c.text) : JSON.stringify(c);
    return String(c);
  }

  // 拆 assistant 的 <msg message_id="..."><text>正文</text><emoji>182</emoji></msg>
  function parseAssistant(t){
    var src = String(t || ""), out = [], re = /<msg\b[^>]*>([\s\S]*?)<\/msg>/gi, mm;
    while((mm = re.exec(src))){
      var seg = mm[1], texts = [], emojis = [];

      seg.replace(/<emoji>([\s\S]*?)<\/emoji>/gi, function(_, x){ emojis.push(x); return ""; });
      out.push({ text: texts.join("\n").trim(), emojis: emojis });

    if(!out.length){
      var plain = src.replace(/<\/?[A-Za-z_][^>]{0,300}>/g, " ").replace(/[ \t]+/g, " ").trim();
